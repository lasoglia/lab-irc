<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>Una grazia che rinnova</title><text x="400" y="60" font-family="Figtree, sans-serif" font-size="36" fill="#A78BFA" text-anchor="middle">Trento</text><rect x="90" y="110" width="220" height="170" rx="18" fill="#1D1B2B" stroke="#C7C3DA" stroke-width="6" /><path d="M120 160 Q150 140 180 165 T250 160" fill="none" stroke="#C7C3DA" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" /><path d="M120 220 Q160 200 200 225 T280 215" fill="none" stroke="#C7C3DA" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" /><rect x="215" y="230" width="70" height="32" rx="8" fill="#4FB0FF" transform="rotate(-15 250 246)" /><path d="M350 200 L440 200" stroke="#E3C27A" stroke-width="8" stroke-linecap="round" /><polyline points="420,180 445,200 420,220" fill="none" stroke="#E3C27A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M600 300 C520 240 490 190 520 150 C545 118 585 125 600 155 C615 125 655 118 680 150 C710 190 680 240 600 300 Z" fill="#1D1B2B" stroke="#FB7BB5" stroke-width="6" stroke-linejoin="round" /><path d="M600 270 L600 180" stroke="#34D399" stroke-width="6" stroke-linecap="round" /><path d="M600 215 Q570 205 565 180 Q590 182 600 210" fill="#34D399" /><path d="M600 200 Q630 190 635 165 Q610 167 600 195" fill="#34D399" /><text x="200" y="330" font-family="Figtree, sans-serif" font-size="26" fill="#ECEAF5" text-anchor="middle">cancella soltanto i peccati</text><text x="600" y="345" font-family="Figtree, sans-serif" font-size="28" fill="#ECEAF5" text-anchor="middle">rinnova l'uomo dentro</text><text x="200" y="440" font-family="Figtree, sans-serif" font-size="30" fill="#C7C3DA" fill-opacity="0.6" text-anchor="middle">stimati giusti</text><text x="600" y="440" font-family="Figtree, sans-serif" font-size="32" fill="#E3C27A" text-anchor="middle">lo siamo davvero</text></svg>