<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>Il decreto del 1616</title><rect x="190" y="50" width="420" height="340" rx="20" fill="#1D1B2B" stroke="#E3C27A" stroke-width="6" /><line x1="260" y1="140" x2="540" y2="140" stroke="#C7C3DA" stroke-width="4" stroke-linecap="round" /><line x1="300" y1="275" x2="500" y2="262" stroke="#FF7A59" stroke-width="7" stroke-linecap="round" /><circle cx="545" cy="335" r="32" fill="#FF7A59" /><circle cx="545" cy="335" r="18" fill="none" stroke="#1D1B2B" stroke-width="4" /><g font-family="Figtree, sans-serif" text-anchor="middle"><text x="400" y="115" font-size="36" fill="#E3C27A">1616</text><text x="400" y="205" font-size="30" fill="#ECEAF5">«falsa e contraria»</text><text x="400" y="280" font-size="30" fill="#C7C3DA">«eretica»</text><text x="400" y="460" font-size="28" fill="#A78BFA">non tenerla né difenderla</text></g></svg>