<!-- @dsCard group="Colors" viewport="700x165" name="Exam Platform Colors" subtitle="Institutional blue + gold — Area Verifiche palette" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 14px 16px; background: #f4f5f8; }
.row { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; }
.sw { border-radius: 12px; padding: 12px 10px 10px; min-height: 80px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(0,0,0,.08); }
.n { font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 700; margin-top: 4px; }
.h { font-family: monospace; font-size: 9.5px; opacity: .7; margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:#1E3A8A"><span class="n" style="color:#fff">--exam-blu</span><span class="h" style="color:rgba(255,255,255,.7)">#1E3A8A</span></div>
  <div class="sw" style="background:#162a63"><span class="n" style="color:#fff">--exam-blu-dark</span><span class="h" style="color:rgba(255,255,255,.7)">#162a63</span></div>
  <div class="sw" style="background:#e8edf9; border-color:#d0d8ef"><span class="n" style="color:#1E3A8A">--exam-blu-light</span><span class="h" style="color:#6a7ba0">#e8edf9</span></div>
  <div class="sw" style="background:#D4A017"><span class="n" style="color:#3a2a06">--exam-gold</span><span class="h" style="color:rgba(0,0,0,.45)">#D4A017</span></div>
  <div class="sw" style="background:#1c7c4a"><span class="n" style="color:#fff">--exam-ok</span><span class="h" style="color:rgba(255,255,255,.7)">#1c7c4a</span></div>
  <div class="sw" style="background:#b42318"><span class="n" style="color:#fff">--exam-err</span><span class="h" style="color:rgba(255,255,255,.7)">#b42318</span></div>
</div>
</body>
</html>
