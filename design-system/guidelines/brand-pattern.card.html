<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 18px 22px; background: var(--lab-bg); }
.block { margin-bottom: 20px; }
.block:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div style="display:flex; gap:60px; flex-wrap:wrap">
  <div class="block">
    <p class="lab-eyebrow">Per fare lezione</p>
    <h2 style="font-family:var(--lab-font-display); font-size:28px; margin:0; font-weight:600; letter-spacing:-.015em">Strumenti &amp; Video</h2>
  </div>
  <div class="block">
    <p class="lab-eyebrow">Anno I</p>
    <h1 style="font-family:var(--lab-font-display); font-size:38px; margin:0; font-weight:600; letter-spacing:-.02em">
      Il laboratorio di
      <span style="background:linear-gradient(135deg,#8B5CF6,#22D3EE); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent">Religione</span>
    </h1>
  </div>
</div>
</body>
</html>
