<!-- @dsCard group="Brand" viewport="700x160" name="Gradients" subtitle="Brand, warm, and surface gradients" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 14px 16px; background: var(--lab-bg); font-family: var(--lab-font-body); }
.row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.sw { border-radius: 14px; padding: 16px 14px 12px; min-height: 88px; display: flex; flex-direction: column; justify-content: flex-end; }
.n { font-size: 11.5px; font-weight: 700; }
.d { font-size: 10px; opacity: .75; margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:linear-gradient(135deg,#8B5CF6,#22D3EE)">
    <span class="n" style="color:#fff">--lab-grad</span>
    <span class="d" style="color:rgba(255,255,255,.8)">viola → ciano · 135°</span>
  </div>
  <div class="sw" style="background:linear-gradient(135deg,#F472B6,#FBBF24)">
    <span class="n" style="color:#fff">--lab-grad-warm</span>
    <span class="d" style="color:rgba(255,255,255,.8)">rosa → ambra · 135°</span>
  </div>
  <div class="sw" style="background:linear-gradient(160deg,#1E1C2E,#14131F); border:1px solid var(--lab-line)">
    <span class="n" style="color:var(--lab-ink)">--lab-grad-soft</span>
    <span class="d" style="color:var(--lab-muted)">surface → bg · 160°</span>
  </div>
</div>
</body>
</html>
