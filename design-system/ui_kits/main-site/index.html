/* ---------- motion helpers ---------- */
function Reveal({ children, delay = 0, style }) {
  const ref = useRef(null); const [on, setOn] = useState(false);
  useEffect(() => {
    if (on) return;
    const check = () => { const el = ref.current; if (el && el.getBoundingClientRect().top < innerHeight * .92) setOn(true); };
    check();
    let io;
    if ('IntersectionObserver' in window) { io = new IntersectionObserver(([e]) => { if (e.isIntersecting) setOn(true); }, { threshold: .12 }); io.observe(ref.current); }
    addEventListener('scroll', check, { passive: true });
    const safety = setTimeout(() => setOn(true), 1618);
    return () => { io && io.disconnect(); removeEventListener('scroll', check); clearTimeout(safety); };
  }, [on]);
  const tr = `987ms cubic-bezier(.16,1,.3,1) ${delay}ms`;
  return <div ref={ref} style={{ opacity: on ? 1 : 0, transform: on ? 'none' : 'translateY(21px)', filter: on ? 'none' : 'blur(6px)', transition: `opacity ${tr}, transform ${tr}, filter ${tr}`, ...style }}>{children}</div>;
}

function useMouse() {
  const [m, setM] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const f = e => setM({ x: e.clientX / innerWidth * 2 - 1, y: e.clientY / innerHeight * 2 - 1 });
    addEventListener('mousemove', f); return () => removeEventListener('mousemove', f);
  }, []);
  return m;
}

function CursorHalo() {
  const ref = useRef(null);
  useEffect(() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let x = innerWidth / 2, y = innerHeight / 3, tx = x, ty = y, raf;
    const mv = e => { tx = e.clientX; ty = e.clientY; if (ref.current) ref.current.style.opacity = 1; };
    const loop = () => { x += (tx - x) * .1618; y += (ty - y) * .1618; if (ref.current) ref.current.style.transform = `translate(${x - 233}px,${y - 233}px)`; raf = requestAnimationFrame(loop); };
    loop(); addEventListener('mousemove', mv);
    return () => { cancelAnimationFrame(raf); removeEventListener('mousemove', mv); };
  }, []);
  return <div ref={ref} aria-hidden="true" style={{ position:'fixed', left:0, top:0, width:466, height:466, borderRadius:'50%', pointerEvents:'none', zIndex:0, opacity:0, transition:'opacity 610ms', background:'radial-gradient(circle, rgba(139,92,246,.10), rgba(227,194,122,.04) 38.2%, transparent 61.8%)' }} />;
}

/* ---------- rosone (rose window) ---------- */
const PETAL = 'M0 -40 C15 -52 15 -80 0 -93 C-15 -80 -15 -52 0 -40 Z';
const CROSS = 'M-2 -12 H2 V-5 H8 V-1 H2 V12 H-2 V-1 H-8 V-5 H-2 Z';
function Rosone({ onYear }) {
  const ref = useRef(null);
  const [c, setC] = useState({ a: -90, p: .35, tx: 0, ty: 0 });
  const [hi, setHi] = useState(null);
  const [ch, setCh] = useState(false);
  useEffect(() => {
    const mv = e => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      setC({ a: Math.atan2(y, x) * 180 / Math.PI, p: Math.max(.3, 1 - Math.hypot(x, y) / (r.width * 1.618)), tx: Math.max(-1, Math.min(1, x / r.width)), ty: Math.max(-1, Math.min(1, y / r.height)) });
    };
    addEventListener('mousemove', mv); return () => removeEventListener('mousemove', mv);
  }, []);
  const lit = ang => { const d = Math.abs(((c.a - ang) % 360 + 540) % 360 - 180); return Math.pow((Math.cos(d * Math.PI / 180) + 1) / 2, 3) * c.p; };
  const rad = d => d * Math.PI / 180;
  const items = Array.from({ length: 10 }, (_, i) => { const y = i % 5 + 1, ang = -90 + i * 36, l = lit(ang); return { i, y, ang, l, op: hi === y ? 1 : .22 + .78 * l }; });
  const info = hi ? ANNI.find(x => x.year === hi) : null;
  return (
    <div style={{ position:'relative', maxWidth:440, margin:'0 auto' }}>
      <div aria-hidden="true" style={{ position:'absolute', inset:'-21%', borderRadius:'50%', pointerEvents:'none', background:`conic-gradient(from ${c.a + 90 - 13}deg, rgba(227,194,122,0) 0deg, rgba(227,194,122,${(.26 * c.p).toFixed(3)}) 13deg, rgba(227,194,122,0) 26deg, rgba(227,194,122,0) 360deg)`, WebkitMaskImage:'radial-gradient(circle, #000 21%, transparent 70%)', maskImage:'radial-gradient(circle, #000 21%, transparent 70%)' }} />
      <div ref={ref} style={{ position:'relative', transform:`perspective(987px) rotateX(${(-c.ty * 8).toFixed(2)}deg) rotateY(${(c.tx * 8).toFixed(2)}deg)`, transition:'transform 610ms cubic-bezier(.16,1,.3,1)', animation:'labRise 1597ms cubic-bezier(.16,1,.3,1) 233ms both' }}>
        <svg viewBox="-100 -100 200 200" style={{ width:'100%', display:'block', overflow:'visible' }} onMouseLeave={() => setHi(null)}>
          <circle r="98" style={{ fill:'var(--lab-bg-2)', stroke:'var(--lab-oro)', strokeWidth:1.5, strokeOpacity:.85 }} />
          <circle r="94" style={{ fill:'none', stroke:'var(--lab-oro)', strokeWidth:.6, strokeOpacity:.45 }} />
          {items.map(p => (
            <g key={p.i} transform={`rotate(${p.i * 36})`} onMouseEnter={() => setHi(p.y)} onClick={() => onYear(p.y)} style={{ cursor:'pointer' }}>
              <path d={PETAL} style={{ fill:`var(--lab-anno-${p.y})`, fillOpacity:p.op, stroke:'var(--lab-bg)', strokeWidth:2.5, transition:'fill-opacity 377ms ease' }} />
              <circle cy="-67" r="5.5" style={{ fill:'none', stroke:'var(--lab-bg)', strokeWidth:1.6, strokeOpacity:.8 }} />
              <path d="M0 -46 V-58 M0 -76 V-86" style={{ stroke:'var(--lab-bg)', strokeWidth:1.4, strokeOpacity:.7 }} />
            </g>
          ))}
          {items.map(p => <circle key={'o' + p.i} cx={86 * Math.cos(rad(p.ang + 18))} cy={86 * Math.sin(rad(p.ang + 18))} r="5" style={{ fill:'var(--lab-oro)', fillOpacity:.35 + .6 * lit(p.ang + 18), transition:'fill-opacity 377ms' }} />)}
          <circle r="37" style={{ fill:'none', stroke:'var(--lab-oro)', strokeWidth:1, strokeOpacity:.8 }} />
          {items.map(p => <circle key={'r' + p.i} cx={28 * Math.cos(rad(p.ang + 18))} cy={28 * Math.sin(rad(p.ang + 18))} r="7.5" style={{ fill:`var(--lab-anno-${(p.i + 2) % 5 + 1})`, fillOpacity:.3 + .6 * lit(p.ang + 18), stroke:'var(--lab-bg)', strokeWidth:2, transition:'fill-opacity 377ms' }} />)}
          <g onMouseEnter={() => setCh(true)} onMouseLeave={() => setCh(false)} onClick={() => window.dispatchEvent(new Event('lab:amdg'))}
            style={{ transform:`scale(${ch ? 1.13 : 1})`, transition:'transform 610ms cubic-bezier(.16,1,.3,1)', filter: ch ? 'drop-shadow(0 0 8px rgba(227,194,122,.8))' : 'none' }}>
            <circle r="19" style={{ fill:'var(--lab-surface)', stroke:'var(--lab-oro)', strokeWidth:1.2 }} />
            <path d={CROSS} style={{ fill:'var(--lab-oro)' }} />
          </g>
        </svg>
      </div>
      <div style={{ textAlign:'center', marginTop:21, minHeight:55, fontFamily:'var(--lab-font-inscription)', fontWeight:600, fontSize:12.5, letterSpacing:'.18em', textTransform:'uppercase', color: info ? `var(--lab-anno-${info.year})` : 'var(--lab-muted)', transition:'color 377ms' }}>
        {info ? <>Anno {ROMAN[info.year]} · {info.nome}<div style={{ fontFamily:'var(--lab-font-body)', fontWeight:500, textTransform:'none', letterSpacing:0, fontSize:13.5, color:'var(--lab-muted)', marginTop:5 }}>{info.desc}</div></> : 'Passa il cursore sulle vetrate'}
      </div>
    </div>
  );
}

      {item.anno ? <span style={{ position:'absolute', right:13, top:119, zIndex:2 }}><YearMascot year={item.anno} size={42} /></span> : null}
      {item.feat && <span style={{ position:'absolute', top:13, left:13, background:'var(--lab-ambra)', color:'#3a2a06', fontSize:10.5, fontWeight:800, letterSpacing:'.08em', textTransform:'uppercase', padding:'5px 8px', borderRadius:999 }}>In evidenza</span>}
      <div style={{ padding:21, display:'flex', flexDirection:'column', gap:13 }}>
        <div><Badge variant={BADGE[item.tipo]}>{item.tipo}</Badge></div>
        <h3 style={{ fontSize:24, margin:0 }}>{item.titolo}</h3>
        <p style={{ fontSize:14, color:'var(--lab-muted)', margin:0 }}>{item.desc}</p>
        <div><Button size="sm" variant={item.tipo === 'Video' ? 'ghost' : 'primary'}>{item.tipo === 'Video' ? 'Guarda ▶' : item.tipo === 'Artefatto' ? 'Apri' : 'Scarica'}</Button></div>
      </div>
    </Card>
  );
}
function YearPage({ year, onBack }) {
  const a = ANNI.find(x => x.year === year), color = COL(year);
  const mats = MATERIALI.filter(m => m.anno === year || m.anno === 0);
  const [chip, setChip] = useState('Tutti');
  const types = ['Tutti', ...new Set(mats.map(m => m.tipo))];
  const shown = chip === 'Tutti' ? mats : mats.filter(m => m.tipo === chip);
  const [p, setP] = useState({ x: 0, y: 0 });
  return (
    <div style={{ maxWidth:1140, margin:'0 auto', padding:'0 21px 89px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:14, color:'var(--lab-muted)', margin:'34px 0 0' }}>
        <a href="#" onClick={e => { e.preventDefault(); onBack(); }} style={{ fontWeight:600 }}>← Home</a><span style={{ opacity:.4 }}>›</span><span>Anno {ROMAN[year]}</span>
      </div>
      <div onMouseMove={e => { const r = e.currentTarget.getBoundingClientRect(); setP({ x:(e.clientX - r.left) / r.width - .5, y:(e.clientY - r.top) / r.height - .5 }); }} onMouseLeave={() => setP({ x:0, y:0 })}
        style={{ position:'relative', padding:'55px 34px', borderRadius:34, margin:'21px 0 34px', overflow:'hidden', color:'#fff', background:`linear-gradient(130deg, ${color}, color-mix(in srgb, ${color} 50%, #14101a))`, animation:'labRise 987ms cubic-bezier(.16,1,.3,1) both' }}>
        <div aria-hidden="true" style={{ position:'absolute', right:21, bottom:-34, fontSize:199, opacity:.14, fontFamily:'var(--lab-font-inscription)', fontWeight:600, lineHeight:1, transform:`translate(${p.x * 34}px, ${p.y * 21}px)`, transition:'transform 610ms cubic-bezier(.16,1,.3,1)' }}>{ROMAN[year]}</div>
        <div style={{ position:'absolute', right:34, top:34, zIndex:2 }}><YearMascot year={year} size={72} /></div>
        <Eyebrow color="rgba(255,255,255,.85)">Anno {ROMAN[year]}</Eyebrow>
        <h2 style={{ fontSize:'clamp(33px,5vw,55px)', margin:'0 0 8px', color:'#fff' }}>{a.nome}</h2>
        <p style={{ margin:0, maxWidth:'46ch', color:'rgba(255,255,255,.9)' }}>{a.desc}</p>
      </div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:34 }}>{types.map(t => <Chip key={t} active={chip === t} onClick={() => setChip(t)}>{t}</Chip>)}</div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(288px,1fr))', gap:21 }}>
        {shown.map((m, i) => <Reveal key={m.id + chip} delay={i * 89}><MatCard item={m} color={color} /></Reveal>)}
      </div>
    </div>
  );
}

/* ---------- chrome ---------- */
function ThemeToggle() {
  const [dark, setDark] = useState(document.documentElement.dataset.tema !== 'chiaro');
  const [n, setN] = useState(0);
  const toggle = () => { const next = dark ? 'chiaro' : 'scuro'; document.documentElement.dataset.tema = next; try { localStorage.setItem('tema_lab', next); } catch (e) {} setDark(!dark); setN(n + 1); };
  return (
    <button onClick={toggle} aria-label="Cambia tema" style={{ position:'fixed', right:21, bottom:21, zIndex:60, width:47, height:47, borderRadius:'50%', border:'1px solid var(--lab-line)', background:'var(--lab-surface)', color:'var(--lab-ink)', fontSize:18, cursor:'pointer', boxShadow:'var(--lab-shadow)', display:'grid', placeItems:'center', transform:`rotate(${n * 180}deg)`, transition:'transform 610ms cubic-bezier(.16,1,.3,1)' }}>
      {dark ? '☀️' : '🌙'}
    </button>
  );
}
function Footer() {
  return (
    <footer style={{ maxWidth:1140, margin:'0 auto', padding:'34px 21px 55px', borderTop:'1px solid var(--lab-line-soft)', color:'var(--lab-muted)', fontSize:13.5, display:'grid', gridTemplateColumns:'minmax(0,1.618fr) auto minmax(0,1fr)', alignItems:'center', gap:21 }}>
      <span>© 2026 {SITE.autore} · Tutti i diritti riservati</span>
      <Amdg />
      <a href="#" style={{ justifySelf:'end', whiteSpace:'nowrap', color:'var(--lab-muted)' }}>Area gestione</a>
    </footer>
  );
}
function App() {
  const [year, setYear] = useState(null);
  const go = y => { setYear(y); window.scrollTo({ top:0 }); };
  return (
    <>
      <CursorHalo />
      <div style={{ position:'relative', zIndex:1, minHeight:'100vh' }}>
        <Header onHome={() => go(null)} />
        {year ? <YearPage year={year} onBack={() => go(null)} /> : <HomePage onYear={go} />}
        <Footer />
      </div>
      <ThemeToggle />
      <AmdgEgg />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
