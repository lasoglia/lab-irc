<!doctype html>
<html lang="it">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body style="margin:0;padding:14px 16px;background:var(--lab-bg)">
<div id="root"></div>
<script type="text/babel">
const { YearCard } = window.LabIrc_948687;
const anni = [
  { year:1, name:"Primo anno",   description:"Le radici: il senso del sacro.", count:12 },
  { year:2, name:"Secondo anno", description:"Gesù di Nazaret nella storia.", count:9  },
  { year:3, name:"Terzo anno",   description:"La Chiesa nella storia.",        count:14 },
  { year:4, name:"Quarto anno",  description:"Etica e questioni di senso.",    count:8  },
  { year:5, name:"Quinto anno",  description:"Le sfide del presente.",         count:11 },
];
function Demo() {
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:13 }}>
      {anni.map(a => <YearCard key={a.year} {...a} />)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
