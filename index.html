<!-- Applica subito il tema salvato (chiaro/scuro) per evitare il "lampo".
     Default del sito = scuro ("Notte studio"). Chiave condivisa con artefatti e verifiche. -->
<script>try{var t=localStorage.getItem('tema_lab');if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>

<!-- Animazioni (Motion One via CDN, ~5 KB, nessuna build): transizioni fra
     le pagine e un piccolo "tilt" luminoso al passaggio del mouse sulle
     card. Se il CDN non è raggiungibile il sito resta comunque perfettamente
     funzionante, solo senza questi effetti (vedi i controlli su window.__motion
     nello script principale). -->
<script type="module">
import { animate } from "https://cdn.jsdelivr.net/npm/motion@11/+esm";
window.__motion = { animate };

/* Il tilt 3D esiste SOLO su dispositivi con mouse vero: su touch i gestori
   pointer scattavano dopo il tap e lasciavano trasformazioni a metà
   (perspective(0)…), che su alcuni telefoni facevano lampeggiare le card. */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const puntatoreFine = matchMedia("(hover: hover) and (pointer: fine)").matches;
if(!reduceMotion && puntatoreFine){
  const TILT_SEL = ".card,.ycard,.fcard,.tile";
  let raf=null, lastEvt=null;

  function applyTilt(e){
    const card=e.target.closest(TILT_SEL);
    if(!card) return;
    const r=card.getBoundingClientRect();
    const px=((e.clientX-r.left)/r.width)*100, py=((e.clientY-r.top)/r.height)*100;
    const rx=((py/100)-.5)*-6, ry=((px/100)-.5)*6;
    card.dataset.tilt="1";
    card.style.backgroundImage=`radial-gradient(320px circle at ${px}% ${py}%, rgba(255,255,255,.10), transparent 60%)`;
    animate(card, {transform:`perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px)`}, {duration:.25, easing:[.2,.8,.2,1]});
  }

  document.addEventListener("pointermove",(e)=>{
    if(e.pointerType!=="mouse") return;
    lastEvt=e;
    if(raf) return;
    raf=requestAnimationFrame(()=>{ raf=null; applyTilt(lastEvt); });
  });

  document.addEventListener("pointerleave",(e)=>{
    if(e.pointerType && e.pointerType!=="mouse") return;
    const card=e.target.closest && e.target.closest(TILT_SEL);
    if(!card || !card.dataset.tilt) return;
    delete card.dataset.tilt;
    card.style.backgroundImage="";
    animate(card, {transform:"none"}, {duration:.3, easing:[.2,.8,.2,1]}).finished.then(()=>{ card.style.transform=""; }).catch(()=>{ card.style.transform=""; });
  }, true);
}
</script>

/* Feedback "a scatto" al tocco/click, SOLO sugli elementi interattivi grandi

  <!-- SICUREZZA: niente "allow-same-origin" né "allow-popups-to-escape-sandbox".

<script>

/* =====================================================================
   CONFIGURAZIONE BASE PATH
   ===================================================================== */
const BASE = (()=>{
  const p = location.pathname;
  const last = p.endsWith('/') ? p : p.substring(0, p.lastIndexOf('/') + 1);
  return last;
})();

function resolvePath(p){
  if(!p || p === '#') return p;
  p = String(p);
  if(/^https?:\/\//.test(p)) return p;
  p = p.replace(/^\/+/, '');
  return BASE + p;
}

/* I colori puntano alle variabili CSS (--anno-N), così seguono da soli
   il tema chiaro/scuro senza dover rigenerare le schede. */
const ANNI = [
  {n:"1", rom:"I",   nome:"Primo anno",   color:"var(--anno-1)"},
  {n:"2", rom:"II",  nome:"Secondo anno", color:"var(--anno-2)"},
  {n:"3", rom:"III", nome:"Terzo anno",   color:"var(--anno-3)"},
  {n:"4", rom:"IV",  nome:"Quarto anno",  color:"var(--anno-4)"},
  {n:"5", rom:"V",   nome:"Quinto anno",  color:"var(--anno-5)"},
];

const BRAND = "var(--brand)";
const ACC = {strumento:"var(--c-strumento)", video:"var(--c-video)"};
const KEY = {"1":"primo","2":"secondo","3":"terzo","4":"quarto","5":"quinto"};

let SITE={}, ANNIDESC={}, MAT=[], STR=[], VID=[], UDA=[], LEZ=[], ITEMS=[];

const SAMPLE = {
  site:{titolo:"Lab IRC", sottotitolo:"Il laboratorio di Religione", intro:"Uno spazio per fare lezione in modo vivo: slide, documenti, video e strumenti interattivi, organizzati per anno di corso.", pensiero:"Le grandi domande meritano risposte all'altezza.", email:"", autore:"Matteo Sestili"},
  anni:{},
  materiali:[
    {titolo:"Il Cantico dei Cantici e il linguaggio dell'amore", anno:"5", tipo:"Slide", descrizione:"Esempio. L'amore nella Bibbia, con un ponte alla cultura di oggi.", link:"#", in_evidenza:true},
    {titolo:"Galileo e la Chiesa: una lettura onesta", anno:"4", tipo:"Documento/PDF", descrizione:"Esempio. Il caso Galileo senza concordismi né leggende.", link:"#"},
    {titolo:"Lemaître e l'origine dell'universo", anno:"3", tipo:"Slide", descrizione:"Esempio. Il sacerdote che ipotizzò il Big Bang.", link:"#"}
  ],
  strumenti:[
    {titolo:"Bacheca collaborativa", anno:"", descrizione:"Esempio. Gli studenti rispondono in tempo reale dallo smartphone con un QR.", link:"#", in_evidenza:true},
    {titolo:"Linea del tempo della Chiesa", anno:"", descrizione:"Esempio. Una timeline interattiva da esplorare insieme in classe.", link:"#"}
  ],
  video:[
    {titolo:"Che cos'è la Bibbia?", anno:"1", descrizione:"Esempio. Breve introduzione per la classe.", youtube:"jNQXAC9IVRw"}
  ]
};

const $ = s => document.querySelector(s);

function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function load(p, fb){
  try{
    const r = await fetch(resolvePath(p), {cache:"no-store"});
    if(!r.ok) throw 0;
    return await r.json();
  } catch(e){ return fb; }
}

function annoMeta(n){return ANNI.find(a=>a.n===String(n));}

function setAccent(c){$("#main").style.setProperty("--accent",c||BRAND);}

function yr(){return new Date().getFullYear();}

function ytId(u){
  if(!u)return"";
  u=String(u).trim();
  if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m?m[1]:"";
}

/* FIX — i JSON del pannello hanno la forma {chiave:[...]}: qui si normalizza
   tutto in array semplici, così ogni pagina può usarli direttamente */
function pickArr(x, key){
  if(Array.isArray(x)) return x;
  if(x && Array.isArray(x[key])) return x[key];
  return [];
}

function buildItems(){
  const mm=MAT.map(x=>Object.assign({kind:"materiale"},x));
  const ss=STR.map(x=>Object.assign({kind:"strumento",tipo:"Strumento"},x));
  const vv=VID.map(x=>Object.assign({kind:"video",tipo:"Video"},x));
  ITEMS=mm.concat(ss,vv);
}

function matchAnno(item, n){
  return String(item.anno) === String(n);
}

function countAnno(n){return ITEMS.filter(it=>matchAnno(it,n)).length;}

/* ---------- UDA (cartelle per anno) ---------- */

function normT(s){return String(s==null?"":s).trim().toLowerCase();}

/* Le UDA di un anno: quelle definite nel pannello, più eventuali cartelle
   "automatiche" se un contenuto cita un'UDA non ancora definita (così
   nessun materiale va perso per un titolo scritto a mano) */
function byOrdine(a,b){
  const oa=(a.ordine==null||a.ordine==="")?999:+a.ordine;
  const ob=(b.ordine==null||b.ordine==="")?999:+b.ordine;
  return oa-ob || String(a.titolo).localeCompare(String(b.titolo),"it");
}

function udaForYear(n){
  const list=UDA.filter(u=>String(u.anno)===String(n)).slice();
  const titles=new Set(list.map(u=>normT(u.titolo)));
  ITEMS.forEach(it=>{
    const t=normT(it.uda);
    if(matchAnno(it,n) && t && !titles.has(t)){
      titles.add(t);
      list.push({titolo:String(it.uda).trim(), anno:String(n)});
    }
  });
  list.sort(byOrdine);
  return list;
}

function itemsInUda(n,titolo){
  return ITEMS.filter(it=>matchAnno(it,n) && normT(it.uda)===normT(titolo));
}

/* ---------- Lezioni (sottocartelle dentro le UDA) ---------- */

/* Le lezioni di una UDA: quelle definite nel pannello, più eventuali
   sottocartelle "automatiche" citate dai contenuti ma non definite */
function lezioniForUda(n,udaTitolo){
  const list=LEZ.filter(l=>String(l.anno)===String(n) && normT(l.uda)===normT(udaTitolo)).slice();
  const titles=new Set(list.map(l=>normT(l.titolo)));
  ITEMS.forEach(it=>{
    const t=normT(it.lezione);
    if(matchAnno(it,n) && normT(it.uda)===normT(udaTitolo) && t && !titles.has(t)){
      titles.add(t);
      list.push({titolo:String(it.lezione).trim(), anno:String(n), uda:udaTitolo});
    }
  });
  list.sort(byOrdine);
  return list;
}

function itemsInLezione(n,udaTitolo,lezTitolo){
  return ITEMS.filter(it=>matchAnno(it,n) && normT(it.uda)===normT(udaTitolo) && normT(it.lezione)===normT(lezTitolo));
}

/* Se un contenuto indica la lezione ma non l'UDA, l'UDA si deduce
   dalla definizione della lezione: un campo in meno da compilare */
function inferUda(){
  ITEMS.forEach(it=>{
    if(normT(it.lezione) && !normT(it.uda)){
      const L=LEZ.find(l=>String(l.anno)===String(it.anno) && normT(l.titolo)===normT(it.lezione));
      if(L && L.uda) it.uda=L.uda;
    }
  });
}

function folderHTML(u,color,n,i){
  const count=itemsInUda(n,u.titolo).length;
  const slug=encodeURIComponent(String(u.titolo||"").trim());
  return '<a class="fcard" href="#anno/'+esc(String(n))+'/uda/'+slug+'" style="--c:'+color+';animation-delay:'+(.05*i+.05).toFixed(2)+'s">'
    +'<span class="ficon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>'
    +'<div class="ftitle">'+esc(u.titolo)+'</div>'
    +(u.descrizione?'<p class="fdesc">'+esc(u.descrizione)+'</p>':'')
    +'<div class="fcount">'+count+' '+(count===1?"contenuto":"contenuti")+'</div>'
    +'</a>';
}

function lessonFolderHTML(l,color,n,udaTitolo,i){
  const count=itemsInLezione(n,udaTitolo,l.titolo).length;
  const slugU=encodeURIComponent(String(udaTitolo||"").trim());
  const slugL=encodeURIComponent(String(l.titolo||"").trim());
  return '<a class="fcard" href="#anno/'+esc(String(n))+'/uda/'+slugU+'/lezione/'+slugL+'" style="--c:'+color+';animation-delay:'+(.05*i+.05).toFixed(2)+'s">'
    +'<span class="ficon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>'
    +'<div class="ftitle">'+esc(l.titolo)+'</div>'
    +(l.descrizione?'<p class="fdesc">'+esc(l.descrizione)+'</p>':'')
    +'<div class="fcount">'+count+' '+(count===1?"contenuto":"contenuti")+'</div>'
    +'</a>';
}

/* ---------- filtro per tipo (condiviso da pagina anno e pagina UDA) ---------- */

function typeChipsHTML(items){
  const types=[...new Set(items.map(it=>it.tipo||"Materiale"))].filter(Boolean);
  if(types.length<2) return "";
  return '<div class="filters" id="filters-type">'
    +'<button class="chip on" data-type="tutti">Tutti</button>'
    +types.map(t=>'<button class="chip" data-type="'+esc(t)+'">'+esc(t)+'</button>').join("")
    +'</div>';
}

function wireTypeFilter(items,color){
  const f=document.getElementById("filters-type"); if(!f) return;
  f.addEventListener("click",e=>{
    const btn=e.target.closest(".chip"); if(!btn) return;
    f.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    btn.classList.add("on");
    const type=btn.dataset.type;
    const filtered=type==="tutti"?items:items.filter(it=>(it.tipo||"Materiale")===type);
    document.getElementById("type-cont").innerHTML=gridHTML(filtered,color);
    wireGrid();
  });
}

/* ---------- card pieces ---------- */

function mediaTag(it,accent){
  if(it.immagine){
    const src = resolvePath(it.immagine);
    return '<div class="cmedia" data-bg="'+esc(src)+'"></div>';
  }
  if(it.kind==="video"){
    const id=ytId(it.youtube);
    if(id) return '<div class="cmedia" data-bg="https://img.youtube.com/vi/'+esc(id)+'/hqdefault.jpg"><span class="playbadge" data-play="1"></span></div>';
  }
  let g="✦";
  if(it.kind==="video")g="▶";
  else if(it.kind==="strumento")g="⚙";
  else if(it.kind==="materiale"){const a=annoMeta(it.anno);g=a?a.rom:"＋";}
  const ticon=it.kind==="materiale"?tipoIconSvg(it.tipo):"";
  return '<div class="cmedia grad" style="background-color:'+(accent||BRAND)+'">'+ticon+'<span>'+g+'</span></div>';
}

/* Icona per tipo di materiale, mostrata nell'angolo della copertina quando
   non c'è un'immagine caricata: aiuta a distinguere slide/PDF/artefatti/link
   a colpo d'occhio in una griglia di card. */
function tipoIconSvg(tipo){
  const paths={
    "Slide":'<rect x="3" y="5" width="18" height="13" rx="2"/><path d="M3 9.5h18"/><path d="M9 21h6"/>',
    "Documento/PDF":'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    "Artefatto interattivo":'<path d="M4 4l7.5 18 2.4-7.6L22 12z"/>',
    "Link":'<path d="M10 13a5 5 0 0 0 7.07 0l1.94-1.94a5 5 0 0 0-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.99 12.94a5 5 0 0 0 7.07 7.07L13.5 18.5"/>'
  };
  const d=paths[tipo];
  if(!d) return "";
  return '<span class="ticon" title="'+esc(tipo)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg></span>';
}

/* Illustrazione decorativa dell'hero: un libro aperto da cui esce luce.
   Solo SVG (nessuna immagine esterna da generare), quindi si adatta da
   sola al tema chiaro/scuro tramite le variabili colore. */
function heroIllusSvg(){
  return '<svg class="hero-illus" viewBox="0 0 230 230" fill="none" aria-hidden="true" focusable="false">'
    +'<defs><radialGradient id="heroGlow"><stop offset="0%" stop-color="var(--gold)" stop-opacity=".55"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></radialGradient></defs>'
    +'<g stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" opacity=".6">'
    +'<path d="M115 34v-24"/><path d="M152 46l17-17"/><path d="M78 46l-17-17"/>'
    +'<path d="M168 76l22-7"/><path d="M62 76l-22-7"/>'
    +'</g>'
    +'<circle cx="115" cy="80" r="46" fill="url(#heroGlow)"/>'
    +'<circle cx="115" cy="80" r="13" fill="var(--gold)" opacity=".9"/>'
    +'<g stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">'
    +'<path d="M36 128c30-16 58-16 79 0 21-16 49-16 79 0v58c-30-16-58-16-79 0-21-16-49-16-79 0z" fill="var(--bg2)"/>'
    +'<path d="M115 128v58"/>'
    +'<path d="M52 137l46-11" opacity=".55"/><path d="M52 152l46-11" opacity=".55"/><path d="M52 167l38-9" opacity=".55"/>'
    +'<path d="M178 137l-46-11" opacity=".55"/><path d="M178 152l-46-11" opacity=".55"/><path d="M178 167l-38-9" opacity=".55"/>'
    +'</g>'
    +'</svg>';
}

function svgArrow(){return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg>';}
function svgDown(){return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>';}
function svgPlay(){return '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';}
function svgOpen(){return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>';}

function actionBtn(it){
  /* Un artefatto interattivo si apre DENTRO il sito (visore in sandbox), non si
     scarica. Lo riconosciamo dagli strumenti, dal "tipo" scelto nel pannello,
     oppure in automatico se il file caricato è una pagina .html (es. un
     materiale-artefatto di una lezione). */
  const fileStr = String(it.file||"");
  const isHtml = /\.html?($|\?|#)/i.test(fileStr);
  const isArt = it.kind==="strumento" || it.tipo==="Artefatto interattivo" || it.tipo==="Lezione interattiva" || isHtml;
  const rawHref = it.file || it.link || "";
  const href = (rawHref && rawHref !== "#") ? resolvePath(rawHref) : rawHref;

  if(it.kind==="video"){
    const id=ytId(it.youtube);
    if(id) return '<button class="go playv" data-yt="'+esc(id)+'">Guarda '+svgPlay()+'</button>';
    return '<span class="go ghost" style="cursor:default">Video non valido</span>';
  }
  if(isArt && it.file){
    return '<button class="go openart" data-href="'+esc(href)+'" data-title="'+esc(it.titolo||"")+'">Apri '+svgOpen()+'</button>';
  }
  if(isArt && href && href !== "#"){
    /* FIX — i link esterni (es. artifact pubblicati su Claude) non possono
       essere mostrati nel visore interno: molti siti bloccano gli iframe.
       Si aprono quindi in una nuova scheda. */
    if(/^https?:\/\//.test(href)){
      return '<a class="go" href="'+esc(href)+'" target="_blank" rel="noopener">Apri '+svgArrow()+'</a>';
    }
    return '<button class="go openart" data-href="'+esc(href)+'" data-title="'+esc(it.titolo||"")+'">Apri '+svgOpen()+'</button>';
  }
  if(it.file){
    return '<a class="go" href="'+esc(href)+'" target="_blank" rel="noopener">Scarica '+svgDown()+'</a>';
  }
  if(href && href !== "#"){
    return '<a class="go" href="'+esc(href)+'" target="_blank" rel="noopener">Apri '+svgArrow()+'</a>';
  }
  return '<span class="go ghost" style="cursor:default">Presto disponibile</span>';
}

function cardHTML(it,accent,i){
  return '<article class="card'+(it.in_evidenza?" feat":"")+'" style="--accent:'+(accent||BRAND)+';animation-delay:'+(.05*i+.05).toFixed(2)+'s">'
    + mediaTag(it,accent)
    + '<div class="cbody">'
    +   '<span class="badge" data-k="'+esc(it.kind)+'">'+esc(it.tipo||"Materiale")+'</span>'
    +   '<h3>'+esc(it.titolo||"Senza titolo")+'</h3>'
    +   '<p class="desc">'+esc(it.descrizione||"")+'</p>'

    + '</div></article>';
}

function gridHTML(items,accent){
  if(!items.length) return '<div class="empty"><b>Ancora nessun contenuto</b>Apri l\'<a href="admin/">area gestione</a> per aggiungerne.</div>';
  return '<div class="grid" id="grid">'+items.map((it,i)=>cardHTML(it,accent,i)).join("")+'</div>';
}

function wireGrid(){
  const g=$("#grid"); if(!g) return;
  g.querySelectorAll("[data-bg]").forEach(d=>{
    d.style.backgroundImage="url('"+String(d.dataset.bg).replace(/'/g,"%27")+"')";
  });
  g.querySelectorAll(".openart").forEach(b=>b.addEventListener("click",()=>openViewer(b.dataset.href,b.dataset.title)));
  g.querySelectorAll(".playv").forEach(b=>b.addEventListener("click",()=>playVideo(b)));
  g.querySelectorAll("[data-play]").forEach(s=>{
    const c=s.closest(".card");
    const b=c&&c.querySelector(".playv");
    if(b)s.addEventListener("click",()=>playVideo(b));
  });
}

function playVideo(btn){
  const id=btn.dataset.yt; if(!id) return;
  const card=btn.closest(".card"); const media=card&&card.querySelector(".cmedia"); if(!media) return;
  const w=document.createElement("div"); w.className="ytembed";
  w.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  media.replaceWith(w);
}

/* ---------- viewer iframe ---------- */

let viewerOpen=false;

function openViewer(href,title){
  if(!href||href==="#") return;
  $("#viewerTitle").textContent=title||"";
  $("#viewerFrame").src=href;
  $("#viewerEl").classList.add("on");
  document.body.classList.add("viewing");
  /* Registriamo una voce nella cronologia: così il tasto "indietro" del
     browser chiude il visore invece di navigare la pagina nascosta sotto. */
  if(!viewerOpen){
    viewerOpen=true;
    history.pushState({viewer:true},"");
  }
}

/* Chiusura "logica" (pulsante della pagina): torniamo indietro nella cronologia,
   così il comportamento è identico a quello del tasto indietro del browser. */
function closeViewer(){
  if(!viewerOpen) return;
  if(history.state && history.state.viewer){
    history.back();          /* fa scattare popstate → hideViewer() */
  } else {
    hideViewer();
  }
}

/* Chiusura "fisica": nasconde davvero il visore. */
function hideViewer(){
  viewerOpen=false;
  $("#viewerEl").classList.remove("on");
  document.body.classList.remove("viewing");
  setTimeout(()=>{$("#viewerFrame").src="about:blank";},300);
}

/* ---------- router ---------- */

function renderRoute(hash){
  if(typeof hash==="undefined") hash=location.hash.replace(/^#/,"");
  if(searchQ){renderSearch(searchQ); return;}
  if(!hash||hash===""){renderHome(); renderFooter(); return;}
  if(hash.startsWith("anno/")){
    const parts=hash.split("/");
    if(parts[2]==="uda" && parts[3]){
      let u=parts[3];
      try{u=decodeURIComponent(u);}catch(e){}
      if(parts[4]==="lezione" && parts[5]){
        let l=parts[5];
        try{l=decodeURIComponent(l);}catch(e){}
        renderLezione(parts[1],u,l); renderFooter(); return;
      }
      renderUda(parts[1],u); renderFooter(); return;
    }
    renderAnno(parts[1]); renderFooter(); return;
  }
  if(hash==="strumenti"){renderStrumenti(); renderFooter(); return;}
  if(hash==="video"){renderVideo(); renderFooter(); return;}
  renderHome(); renderFooter();
}

/* Cambio pagina con una piccola dissolvenza (Motion One, caricato via CDN
   in testa alla pagina). Se lo script non è disponibile — offline, blocco
   annunci — si passa direttamente a renderRoute() senza transizione: il
   sito resta comunque perfettamente funzionante. */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function route(hash){
  const m=window.__motion;
  if(!m || reduceMotion || document.body.classList.contains("viewing")){ renderRoute(hash); return; }
  const targets=[$("#heroWrap"), $("#main")].filter(Boolean);
  m.animate(targets, {opacity:[1,0], transform:["translateY(0px)","translateY(-6px)"]}, {duration:.12, easing:"ease-in"})
   .finished.then(()=>{
      renderRoute(hash);
      m.animate(targets, {opacity:[0,1], transform:["translateY(6px)","translateY(0px)"]}, {duration:.3, easing:[.2,.8,.2,1]});
    }).catch(()=>renderRoute(hash));
}

/* ---------- avvio ---------- */

async function init(){
  [SITE, ANNIDESC, MAT, STR, VID, UDA, LEZ] = await Promise.all([
    load("data/site.json",      SAMPLE.site),
    load("data/anni.json",      SAMPLE.anni),
    load("data/materiali.json", SAMPLE.materiali),
    load("data/strumenti.json", SAMPLE.strumenti),
    load("data/video.json",     SAMPLE.video),
    load("data/uda.json",       []),
    load("data/lezioni.json",   []),
  ]);
  /* FIX — qui si normalizzano i dati del pannello ({chiave:[...]} → array):
     senza questo passaggio le pagine Strumenti e Video andavano in errore */
  MAT = pickArr(MAT, "materiali");
  STR = pickArr(STR, "strumenti");
  VID = pickArr(VID, "video");
  UDA = pickArr(UDA, "uda");
  LEZ = pickArr(LEZ, "lezioni");
  applySite();
  buildItems();
  inferUda();
  route(location.hash.replace(/^#/,""));
}

/* ---------- event listeners globali ---------- */

window.addEventListener("hashchange",()=>{
  if(!searchQ) route(location.hash.replace(/^#/,""));
});

/* Tasto "indietro" del browser: se il visore è aperto, lo chiudiamo (la voce
   di cronologia che avevamo aggiunto in openViewer è appena stata rimossa). */
window.addEventListener("popstate",()=>{
  if(viewerOpen) hideViewer();
});

$("#viewerBack").addEventListener("click", closeViewer);

$("#q").addEventListener("input",e=>{
  const v=e.target.value.trim();
  searchQ=v;
  if(v.length>1){
    history.replaceState(null,"","#");
    renderSearch(v);
  } else if(v.length===0){
    searchQ="";
    route(location.hash.replace(/^#/,""));
  }
});

$("#brandLink").addEventListener("click",e=>{
  e.preventDefault();
  $("#q").value=""; searchQ="";
  history.pushState(null,"","#");
  route("");
});

init();
