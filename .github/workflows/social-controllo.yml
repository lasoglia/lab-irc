name: Social · controllo delle uscite
# Ogni mattina controlla che i post del giorno prima siano usciti (il giovedì solo nei periodi dei giochi).
# Serve perché la pubblicazione usa continue-on-error e non segnala i rifiuti di Meta.
# Se manca qualcosa, social-meccanico scrive la diagnosi in un Issue e l'Action fallisce,
# così GitHub manda un'email. Se è tutto a posto Claude non parte e non si spende nulla.
# Ogni mattina misura anche i post (seo/social_metriche.py, solo conteggi): così il quaderno del Lab
# ha i numeri di ogni giorno e non solo quelli della domenica (il piano della settimana li rilegge).

on:
  schedule:
    - cron: '17 6 * * *'   # ogni giorno alle 6:17 UTC
  workflow_dispatch:
    inputs:
      giorno:
        description: 'Giorno da controllare (AAAA-MM-GG), vuoto per ieri'
        type: string
        required: false

permissions:
  contents: write
  issues: write
  actions: read

env:
  RAMO: claude/lab-irc-exam-platform-v2-712y8s
  CLAUDE_CODE_VERSIONE: 2.1.316

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Controlla i registri
        id: controllo
        continue-on-error: true
        env:
          GIORNO: ${{ inputs.giorno }}
        run: |
          if [ -n "$GIORNO" ]; then
            python seo/social_controllo.py --giorno "$GIORNO"
          else
            python seo/social_controllo.py
          fi

      - name: Misura i post
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: '1450849821438605'   # Pagina «Lab IRC» (non è un segreto)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: |
          python seo/social_metriche.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-metriche.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Social: i numeri dei post"
            for prova in 1 2 3; do
              git pull --rebase --quiet origin "$RAMO" && git push origin "HEAD:$RAMO" && break
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
          fi

      - name: Raccogli il log dell'ultima pubblicazione
        if: steps.controllo.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh run list --workflow promozione-telegram.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run view "$numero" --log | grep -E '✗|!|rror|rifiutato|Pubblicato|Prossimo|Pagina:' | tail -n 60 > .social/log.txt || true

      - name: Installa Claude Code
        if: false   # Claude spento dal 9/11/2026; prima: steps.controllo.outcome == 'failure'
        run: npm install --global --silent "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSIONE"

      - name: Diagnosi
        if: false   # Claude spento dal 9/11/2026; prima: steps.controllo.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ''   # Claude spento dal 9/11/2026 (decisione di Matteo): niente richieste all'API né all'abbonamento
          CLAUDE_CODE_OAUTH_TOKEN: ''   # Claude spento dal 9/11/2026 (decisione di Matteo): niente richieste all'API né all'abbonamento
        run: bash seo/social_claude.sh "/social-controllo" 2 20

      - name: Avvisa con un Issue
        if: steps.controllo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create allarme --color FF7A59 --force >/dev/null
          gh label create social --color 22D3EE --force >/dev/null
          {
            cat .social/controllo.md
            echo
            cat .social/diagnosi.md 2>/dev/null || echo "La diagnosi automatica non è disponibile: guarda la scheda Actions."
          } > corpo-issue.md
          gh issue create --title "Social: un post non è uscito" --label allarme --label social --body-file corpo-issue.md
          rm -f corpo-issue.md
          exit 1
