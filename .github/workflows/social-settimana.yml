name: Social · piano della settimana
# Ogni domenica gli agenti scelgono le lezioni di lunedì, mercoledì e venerdì e controllano
# anche le strisce del prof (martedì e sabato) e lo speciale della domenica.
# Claude prepara solo file: gli script li validano e li salvano. Il risultato arriva
# come Issue con etichetta «piano», con l'email di notifica di GitHub. Per intervenire
# basta commentare l'Issue scrivendo @claude e la richiesta.
#
# Il giovedì (o a mano con «solo rubriche») un giro leggero ricontrolla soltanto le rubriche del
# weekend riscritte dopo le obiezioni della domenica (.claude/skills/social-rubriche).
#
# Credenziale: se esiste il segreto CLAUDE_CODE_OAUTH_TOKEN si usa il piano Claude;
# altrimenti ANTHROPIC_API_KEY, con i crediti API dell'organizzazione collegata.

on:
  schedule:
    - cron: '23 16 * * 0'   # domenica alle 16:23 UTC (17:23 d'inverno, 18:23 d'estate): il piano intero
    - cron: '23 17 * * 4'   # giovedì alle 17:23 UTC: solo le rubriche del weekend
  workflow_dispatch:
    inputs:
      solo_rubriche:
        description: 'Solo il controllo delle rubriche del weekend (giro leggero)'
        type: boolean
        default: false

concurrency:
  group: social-agenti
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  RAMO: claude/lab-irc-exam-platform-v2-712y8s
  CLAUDE_CODE_VERSIONE: 2.1.316
  SOLO_RUBRICHE: ${{ inputs.solo_rubriche == true || github.event.schedule == '23 17 * * 4' }}

jobs:
  piano:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # direttore, calendarista, controlli, regista, analista: con dieci agenti in fila servono più di 30 minuti
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Raccogli le metriche
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: '1450849821438605'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python seo/social_metriche.py

      - name: Prepara il quadro per gli agenti
        run: |
          pip install --quiet pypdf
          python seo/social_stato.py

      - name: Disegna le immagini dei candidati
        # gli agenti le guardano; restano qui (non entrano nel repo)
        continue-on-error: true
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          CANDIDATI=.social/candidati.json \
          PW_MODULE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.js" \
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || true)" \
            node seo/cartoline.mjs
          # il disegnatore aggiorna anche promozione/cartoline/versioni.json: è un file di lavoro, non del
          # piano, e la validazione (seo/social_valida.py) fermerebbe tutto vedendolo cambiato
          git checkout -- promozione/cartoline/versioni.json 2>/dev/null || true

      - name: Installa Claude Code
        run: npm install --global --silent "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSIONE"

      - name: Lavoro degli agenti
        id: agenti
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$SOLO_RUBRICHE" = true ]; then
            bash seo/social_claude.sh "/social-rubriche" 10 60
          else
            bash seo/social_claude.sh "/social-settimana" 45 200
          fi

      - name: Valida il lavoro
        id: valida
        if: steps.agenti.outcome == 'success'
        continue-on-error: true
        run: python seo/social_valida.py --applica

      - name: Aggiorna il kit
        # le immagini dei post approvati le disegna e le carica su R2 l'Action di pubblicazione
        if: steps.valida.outcome == 'success'
        run: python seo/promozione.py --senza-ia

      - name: Salva
        id: salva
        if: always()
        env:
          VALIDAZIONE: ${{ steps.valida.outcome }}
          AGENTI: ${{ steps.agenti.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-metriche.json 2>/dev/null || true
          # le obiezioni alle rubriche respinte: seo/rubriche.py le riscrive tenendone conto
          if [ "$AGENTI" = "success" ] && [ -s .social/rubriche-da-rifare.md ]; then
            cp .social/rubriche-da-rifare.md data/rubriche-da-rifare.md
            git add data/rubriche-da-rifare.md
          fi
          if [ "$VALIDAZIONE" = "success" ]; then
            git add data/social-coda.json data/promozione.json promozione
            if [ -e data/social-quaderno.json ]; then git add data/social-quaderno.json; fi
          fi
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare."
          else
            if [ "$SOLO_RUBRICHE" = true ]; then git commit -m "Social: rubriche del weekend"; else git commit -m "Social: piano della settimana"; fi
            # se nel frattempo qualcuno ha cambiato gli stessi file, la coda, i testi e il quaderno del
            # piano valgono più dei loro (il piano li ha decisi guardando tutto); i file rigenerati dagli
            # script si tengono nella versione arrivata, tanto si rifanno al giro successivo
            risolvi() {
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  data/social-coda.json|data/promozione.json|data/social-quaderno.json|data/rubriche-da-rifare.md) git checkout --theirs -- "$f" ;;
                  *) git checkout --ours -- "$f" ;;
                esac
                git add "$f"
              done
              GIT_EDITOR=true git rebase --continue
            }
            salvato=no
            for prova in 1 2 3; do
              if git pull --rebase --quiet --autostash origin "$RAMO" || risolvi; then
                git push origin "HEAD:$RAMO" && { salvato=si; break; }
              fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ "$salvato" = si ] || { echo "Non sono riuscito a salvare su $RAMO."; exit 1; }
          fi

      - name: Avvisa con un Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTI: ${{ steps.agenti.outcome }}
          VALIDAZIONE: ${{ steps.valida.outcome }}
          SALVATAGGIO: ${{ steps.salva.outcome }}
        run: |
          gh label create piano --color 8B5CF6 --force >/dev/null
          gh label create rubriche --color F59E0B --force >/dev/null
          gh label create social --color 22D3EE --force >/dev/null
          if [ "$SOLO_RUBRICHE" != true ]; then
            for numero in $(gh issue list --label piano --state open --json number --jq '.[].number'); do
              gh issue close "$numero" --comment "Sostituito dal piano più recente." >/dev/null
            done
          fi
          {
            if [ "$SALVATAGGIO" != "success" ]; then
              echo "> **Attenzione: questo lavoro NON è stato salvato sul ramo del sito** (il salvataggio è fallito:"
              echo "> $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). La coda resta quella di prima."
              echo
            fi
            if [ "$AGENTI" = "success" ] && [ "$VALIDAZIONE" = "success" ]; then
              cat .social/rapporto.md 2>/dev/null || echo "Gli agenti non hanno scritto il rapporto."
            else
              echo "## Il piano non è stato salvato"
              echo
              echo "Senza un piano valido i post nuovi restano fermi: è voluto, meglio un post in meno che uno non controllato."
              echo "Agenti: $AGENTI. Validazione: $VALIDAZIONE."
              echo
              cat .social/validazione.md 2>/dev/null || true
              echo
              echo "Dettagli: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            echo
            echo "---"
            echo "Costo stimato: $(cat .social/costo.txt 2>/dev/null || echo '?') \$. Per intervenire commenta con @claude e la richiesta."
          } > corpo-issue.md
          cat corpo-issue.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$SOLO_RUBRICHE" = true ]; then
            gh issue create --title "Social: rubriche del weekend ($(date +%d/%m/%Y))" --label rubriche --label social --body-file corpo-issue.md
          else
            gh issue create --title "Social: piano del $(date +%d/%m/%Y)" --label piano --label social --body-file corpo-issue.md
          fi
          rm -f corpo-issue.md

      - name: Conserva i file di lavoro degli agenti
        # per capire che cosa è successo quando il piano non si salva (solo per chi vede le Action)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavoro-degli-agenti
          path: |
            .social/
            !.social/candidati/
          retention-days: 7
          if-no-files-found: ignore

      - name: Segnala l'errore
        if: steps.agenti.outcome != 'success' || steps.valida.outcome != 'success'
        run: |
          echo "Il piano della settimana non è stato salvato."
          exit 1
