name: Social · prova della voce
# Confronto tra voci, tutte gratuite: le stesse frasi dette dalla voce clonata del prof
# (XTTS e Chatterbox, dal segreto VOCE_CAMPIONE, mai nel repo) e da due voci italiane già
# pronte (Microsoft Diego tramite edge-tts, Kokoro Nicola). Ogni prova va su Cloudflare R2
# (cartella prove/, cancellata dopo 30 giorni): gli indirizzi sono nel riepilogo.
# Gemini (Google, piano gratuito) usa il segreto GEMINI_API_KEY; «gemini-<Voce>» sceglie la voce.
# Non pubblica nulla.

on:
  workflow_dispatch:
    inputs:
      frasi:
        description: 'Frasi da far dire, separate da |'
        default: 'Lo sapevi? Gesù è nato… avanti Cristo. | Nel 525 un monaco, Dionigi il Piccolo, cominciò a contare gli anni dalla nascita di Gesù. | E l''Occidente conta ancora così. | Però sbagliò di qualche anno: Erode muore nel 4 avanti Cristo, e Gesù era già nato. | Quindi Gesù è nato qualche anno prima dell''anno uno. | La lezione completa è su labirc.it.'
      motori:
        description: 'Motori da confrontare (lista JSON): xtts, chatterbox, edge, kokoro, gemini-<Voce>'
        default: '["gemini-Sadachbia"]'
      velocita:
        description: 'Velocità della voce (1 = normale, 1.06 = un po'' più veloce)'
        default: '1.06'
      stile:
        description: 'Indicazione di tono per Gemini (vuoto = quella di seo/voce.py)'
        default: ''

permissions:
  contents: read

jobs:
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2         # Gemini gratis ha un limite di richieste al minuto
      matrix:
        motore: ${{ fromJSON(inputs.motori) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Modelli in cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tts
            ~/.cache/huggingface
          key: voce-${{ matrix.motore }}

      - name: Installa il motore ${{ matrix.motore }}
        env:
          MOTORE: ${{ matrix.motore }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          case "$MOTORE" in
            xtts)
              pip install --quiet "torch==2.8.0" "torchaudio==2.8.0" --index-url https://download.pytorch.org/whl/cpu
              pip install --quiet coqui-tts six "torch==2.8.0" "torchaudio==2.8.0" --extra-index-url https://download.pytorch.org/whl/cpu ;;
            chatterbox)
              pip install --quiet chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu ;;
            edge)
              pip install --quiet edge-tts ;;
            kokoro)
              sudo apt-get install -y -qq espeak-ng
              pip install --quiet "kokoro>=0.9" soundfile --extra-index-url https://download.pytorch.org/whl/cpu ;;
            gemini*) ;;       # basta Python: nessun pacchetto
          esac

      - name: Genera le frasi
        env:
          VOCE_CAMPIONE: ${{ secrets.VOCE_CAMPIONE }}
          VOCE_CAMPIONE_2: ${{ secrets.VOCE_CAMPIONE_2 }}
          VOCE_CAMPIONE_3: ${{ secrets.VOCE_CAMPIONE_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOCE_MOTORE: ${{ matrix.motore }}
          VOCE_VELOCITA: ${{ inputs.velocita }}
          VOCE_GEMINI_STILE: ${{ inputs.stile }}
          FRASI: ${{ inputs.frasi }}
        run: |
          python -c "import json,os; print(json.dumps([f.strip() for f in os.environ['FRASI'].split('|') if f.strip()], ensure_ascii=False))" > frasi.json
          python seo/voce.py frasi.json voce
          ls voce/*.wav >/dev/null 2>&1 || { echo "Nessuna frase generata"; exit 1; }
          ffmpeg -v error -y -f lavfi -i anullsrc=r=24000:cl=mono -t 0.7 pausa.wav
          for f in voce/voce-*.wav; do echo "file '$PWD/$f'"; echo "file '$PWD/pausa.wav'"; done > elenco.txt
          ffmpeg -v error -y -f concat -safe 0 -i elenco.txt -c:a libmp3lame -b:a 160k "voce-${VOCE_MOTORE//@/-}-${GITHUB_RUN_ID}.mp3"

      - name: Su Cloudflare, da ascoltare dal telefono
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MOTORE: ${{ matrix.motore }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "seo")
          import media_r2 as r2
          f = Path(f"voce-{os.environ['MOTORE'].replace('@', '-')}-{os.environ['GITHUB_RUN_ID']}.mp3")   # «@» rompe la firma di R2
          r2.carica(f, os.environ["R2_ACCESS_KEY_ID"], os.environ["R2_SECRET_ACCESS_KEY"], os.environ["CLOUDFLARE_ACCOUNT_ID"], "prove")
          url = f"{r2.URL_PUBBLICO}/prove/{f.name}"
          print(url)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(f"- {os.environ['MOTORE']}: {url}\n", encoding="utf-8")
          PY
