name: Social · post automatico
# Esce il post del giorno (seo/pubblica.py), secondo il calendario di seo/social_calendario.py:
#   scuola    lunedì, mercoledì e venerdì il reel di una lezione (alle 19), martedì il
#             carosello di una lezione (13:30), sabato «Lo Shabbat del Lab» (11),
#             domenica «La grande domanda» (carosello alle 18, video alle 19:30); giovedì niente
#   vacanze   lunedì e giovedì una striscia simpatica del prof
# Gli orari li dà l'orologio su Cloudflare (seo/orologio-cloudflare.js), puntuale al minuto.
# L'esecuzione programmata qui sotto è la rete di sicurezza della sera: se l'orologio non è
# partito pubblica quello che manca (un post già uscito non esce due volte).
# Se esiste data/social-coda.json escono solo i post approvati dagli agenti.
# Prima di pubblicare prepara in anticipo le rubriche dei giorni seguenti
# (seo/rubriche.py, con Claude) e le loro immagini (seo/cartoline.mjs).
# Segreti: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CANALE, META_TOKEN,
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN (facoltativi: gli sfondi IA gratuiti, seo/immagini_ia.py).
# Il pulsante «Run workflow» permette di scegliere coda e canali, o di
# aggiornare la foto del canale Telegram con l'avatar del prof.

on:
  schedule:
    - cron: '17 20 * * *'   # rete di sicurezza: 20:17 UTC (21:17 d'inverno, 22:17 d'estate)
  workflow_dispatch:
    inputs:
      coda:
        description: 'Che cosa pubblicare (oggi = il calendario)'
        type: choice
        options: [oggi, reel, lezioni, prof, sabato, domenica, video, nulla]
        default: oggi
      canali:
        description: 'Dove pubblicare'
        type: choice
        options: [tutti, telegram, facebook-instagram]
        default: tutti
      foto_profilo:
        description: 'Metti l''avatar del prof come foto del canale Telegram'
        type: boolean
        default: false

concurrency:
  group: telegram-kit-social
  cancel-in-progress: false

permissions:
  contents: write

env:
  RAMO: claude/lab-irc-exam-platform-v2-712y8s

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara le rubriche dei prossimi giorni
        # e disegna le immagini dei post in coda, che vanno su Cloudflare R2 (seo/media_r2.py)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install --quiet anthropic pypdf pyluach numpy
          python seo/rubriche.py
          python seo/immagini_ia.py
          npm install --silent --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          PW_MODULE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.js" \
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || true)" \
            node seo/cartoline.mjs
          python seo/media_r2.py
          # se Cloudflare non risponde, le immagini rimaste si salvano sul sito come prima
          git add -f promozione/cartoline/*.jpg 2>/dev/null || true

      - name: Prepara i video delle lezioni
        # i copioni li scrive Claude (seo/reel.py), i video li monta seo/reel.mjs e
        # seo/media_r2.py li carica su Cloudflare R2 (fuori dal repo): Instagram, Facebook
        # e Telegram li scaricano da lì. Senza le chiavi di R2 restano sul sito, come prima.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODA: ${{ inputs.coda }}
        run: |
          python seo/reel.py
          python seo/immagini_ia.py
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          PW_MODULE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.js" \
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || true)" \
            node seo/reel.mjs
          python seo/media_r2.py
          git add -f promozione/reel/*.mp4 2>/dev/null || true
          for f in promozione/reel.json promozione/reel-domenica.json promozione/reel promozione/immagini-ia data/reel.json data/immagini-ia.json data/media-r2.json; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Social: i video delle lezioni"
            for prova in 1 2 3; do
              git pull --rebase --autostash --quiet origin "$RAMO" && git push origin "HEAD:$RAMO" && break
              sleep 10
            done
          fi

      - name: Foto del canale Telegram
        if: inputs.foto_profilo
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python seo/pubblica.py --foto-profilo assets/avatar/sorriso.png

      - name: Pubblica il post del giorno
        if: inputs.coda != 'nulla'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: '1450849821438605'   # Pagina «Lab IRC» (non è un segreto)
          CODA: ${{ inputs.coda }}
          CANALI: ${{ inputs.canali }}
          EVENTO: ${{ github.event_name }}
        run: |
          argomenti=""
          canali=""
          case "$CODA" in reel|lezioni|prof|sabato|domenica|video) argomenti="--coda $CODA";; esac
          case "$CANALI" in
            telegram) canali="--canali telegram";;
            facebook-instagram) canali="--canali facebook,instagram";;
          esac
          esito=0
          python seo/pubblica.py $argomenti $canali || esito=1
          # il video della grande domanda lo fa partire l'orologio alle 19:30; la sera, nella rete
          # di sicurezza, esce qui se manca (solo se il suo carosello è uscito oggi)
          if [ "$EVENTO" = schedule ]; then
            python seo/pubblica.py --coda video $canali || esito=1
          fi
          exit $esito

      - name: Salva rubriche, immagini e registro dei post usciti
        if: always()
        run: |
          # aggiorna nella pagina del kit la scritta «pubblicato in automatico»
          python seo/promozione.py --senza-ia
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/telegram.json data/meta.json data/rubriche.json promozione
          for f in data/reel.json data/immagini-ia.json data/media-r2.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare."
          else
            git commit -m "Social: post del giorno e rubriche dei prossimi giorni"
            # se nel frattempo un'altra Action ha salvato qualcosa, ci si mette in coda
            for prova in 1 2 3; do
              git pull --rebase --quiet origin "$RAMO" && git push origin "HEAD:$RAMO" && break
              sleep 10
            done
          fi
