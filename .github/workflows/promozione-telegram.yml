name: Social · post automatico
# Due volte a settimana pubblica il prossimo post del kit social, uno alla
# volta e nell'ordine consigliato:
#  - sul canale Telegram (seo/telegram.py), con i segreti TELEGRAM_BOT_TOKEN e TELEGRAM_CANALE;
#  - sulla Pagina Facebook e su Instagram (seo/meta.py), con il segreto META_TOKEN.
# Finché un segreto manca, quel canale viene saltato senza errori.
# Il pulsante «Run workflow» pubblica subito il prossimo post (si può scegliere su quali canali).

on:
  schedule:
    - cron: '47 15 * * 1,4'   # lunedì e giovedì alle 15:47 UTC (17:47 d'estate, 16:47 d'inverno)
  workflow_dispatch:
    inputs:
      canali:
        description: 'Dove pubblicare'
        type: choice
        options: [tutti, telegram, facebook-instagram]
        default: tutti

concurrency:
  group: telegram-kit-social
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
        with:
          ref: claude/lab-irc-exam-platform-v2-712y8s

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pubblica su Telegram
        if: github.event_name == 'schedule' || inputs.canali != 'facebook-instagram'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python seo/telegram.py

      - name: Pubblica su Facebook e Instagram
        if: github.event_name == 'schedule' || inputs.canali != 'telegram'
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: '1450849821438605'   # Pagina «Lab IRC» (non è un segreto)
        run: python seo/meta.py

      - name: Salva il registro dei post usciti
        if: always()
        run: |
          pip install --quiet pypdf
          # aggiorna nella pagina del kit la scritta «pubblicato in automatico»
          python seo/promozione.py --senza-ia
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/telegram.json data/meta.json promozione/index.html
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare."
          else
            git commit -m "Social: pubblicato un post del kit"
            # se nel frattempo la sincronizzazione ha salvato qualcosa, ci si mette in coda
            for prova in 1 2 3; do
              git pull --rebase --quiet origin claude/lab-irc-exam-platform-v2-712y8s && \
                git push origin HEAD:claude/lab-irc-exam-platform-v2-712y8s && break
              sleep 10
            done
          fi
