name: Social · controllo generale (non pubblica)
# Controlla, SENZA pubblicare niente, che la catena dei social funzioni (seo/social_verifica.py):
# Cloudflare R2 (scrive, legge, cancella), le immagini del post di oggi online, Instagram che
# scarica da R2 (un contenitore di prova mai pubblicato, che scade da solo), il bot di Telegram
# e che cosa c'è in coda nei prossimi giorni. Se qualcosa blocca il post di oggi, l'Action
# fallisce e GitHub manda un'email. Da lanciare a mano dopo una modifica o quando un post non esce.

on:
  workflow_dispatch:
    inputs:
      giorno:
        description: 'Giorno da controllare (AAAA-MM-GG), vuoto per oggi'
        type: string
        required: false

permissions:
  contents: read

env:
  RAMO: claude/lab-irc-exam-platform-v2-712y8s

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Controllo generale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGINA_ID: '1450849821438605'   # Pagina «Lab IRC» (non è un segreto)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIORNO: ${{ inputs.giorno }}
        run: |
          if [ -n "$GIORNO" ]; then
            python seo/social_verifica.py --giorno "$GIORNO"
          else
            python seo/social_verifica.py
          fi
