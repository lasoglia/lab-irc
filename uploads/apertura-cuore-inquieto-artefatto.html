.g-seq-t{font-size:17px;line-height:1.35}
.g-seq-y{font:800 13px/1 var(--lab-font-body);letter-spacing:.08em;color:var(--lab-ambra);opacity:0;transition:opacity 377ms}
.g-seq-mv{display:flex;gap:4px}
.g-seq-mv button{width:44px;height:44px;border-radius:var(--g-r);border:1.5px solid var(--g-line);background:var(--g-panel);color:var(--lab-ink);font:800 18px/1 var(--lab-font-body);cursor:pointer}
.g-seq-mv button:hover{border-color:var(--g-a);color:var(--g-a)}
.g-seq-item.is-ok{border-color:var(--g-ok);cursor:default}.g-seq-item.is-ok .g-seq-y{opacity:1}.g-seq-item.is-ok .g-seq-mv{visibility:hidden}.g-seq-item.is-ok .g-seq-n{color:var(--g-ok)}
.g-seq-item.is-wrong{border-color:var(--g-ko)}
/* categorie */
.g-pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;margin-bottom:34px}
.g-chip-d{padding:12px 16px;min-height:48px;font:600 16px/1.3 var(--lab-font-body);color:var(--lab-ink);background:var(--g-panel-2);border:2px solid var(--g-line);border-radius:999px;cursor:grab;transition:transform 144ms,border-color 233ms,box-shadow 233ms;text-align:left}
.g-chip-d:hover:not(:disabled){border-color:var(--g-a);transform:translateY(-2px)}
.g-chip-d.is-sel{border-color:var(--g-b);box-shadow:var(--g-glow-b);transform:translateY(-4px) scale(1.03)}
.g-chip-d.is-in{cursor:default;border-color:var(--g-ok);font-size:14px;padding:8px 12px;min-height:0;animation:gDeal 377ms}
.g-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.g-bin{display:flex;flex-direction:column;gap:10px;min-height:190px;padding:16px;border:2px dashed var(--g-line);border-radius:var(--g-r-lg);cursor:pointer;transition:border-color 233ms,background 233ms,box-shadow 233ms}
.g-bin-h{font:900 20px/1 var(--lab-font-body);text-transform:uppercase;letter-spacing:.04em;color:var(--g-a);text-shadow:var(--g-glow-a)}
.g-bin[data-b="0"] .g-bin-h{color:var(--lab-viola-2);text-shadow:var(--g-glow-b)}.g-bin[data-b="2"] .g-bin-h{color:var(--lab-rosa);text-shadow:0 0 10px color-mix(in srgb,var(--lab-rosa) 60%,transparent)}
.g-bin-in{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.g-cat.is-picking .g-bin,.g-bin.is-over{border-style:solid;border-color:var(--g-a);background:color-mix(in srgb,var(--g-a) 6%,transparent)}
/* memory */
.g-mem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;perspective:1200px}
.g-mem{aspect-ratio:1.25;padding:0;border:0;background:none;cursor:pointer;color:inherit}
.g-mem-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform 377ms var(--lab-ease-out)}
.g-mem.is-open .g-mem-in{transform:rotateY(180deg)}
.g-mem-f{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;border-radius:var(--g-r);backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--g-b)}
.g-mem-back{font:900 34px/1 var(--lab-font-body);color:var(--g-b);text-shadow:var(--g-glow-b);background:repeating-linear-gradient(45deg,var(--g-panel-2) 0 8px,var(--g-panel) 8px 16px)}
.g-mem:hover:not(.is-open) .g-mem-back{border-color:var(--g-a);color:var(--g-a)}
.g-mem-face{transform:rotateY(180deg);background:var(--g-panel-2);border-color:var(--g-a);font:800 clamp(14px,1.8vw,19px)/1.25 var(--lab-font-body)}
.g-mem-a{text-transform:uppercase;letter-spacing:.03em;color:var(--g-a)}
.g-mem.is-match .g-mem-face{border-color:var(--g-ok);background:color-mix(in srgb,var(--g-ok) 16%,var(--g-panel-2));color:var(--lab-ink);animation:gPop 377ms}
/* completa */
.g-text{font-size:clamp(19px,2.2vw,24px);line-height:2.1;color:var(--lab-ink);margin:0 0 34px;text-wrap:pretty}
.g-blank{display:inline-block;min-width:130px;min-height:1.6em;padding:0 12px;margin:0 2px;vertical-align:baseline;font:800 .92em/1.5 var(--lab-font-body);color:var(--g-a);background:var(--g-panel-2);border:0;border-bottom:3px solid var(--g-line);border-radius:6px 6px 0 0;cursor:pointer;transition:border-color 233ms,background 233ms}
.g-blank.is-active{border-color:var(--g-b);box-shadow:0 6px 14px -8px var(--g-b);animation:gBlink 1.2s infinite}
.g-blank.is-ok{border-color:var(--g-ok);color:var(--g-ok);cursor:default}
.g-blank.is-wrong{border-color:var(--g-ko);color:var(--g-ko);animation:gShake 377ms}
.g-blank.is-shown{color:var(--lab-ambra)}
.g-bank{display:flex;flex-wrap:wrap;gap:10px;padding-top:21px;border-top:1.5px dashed var(--g-line)}
.g-word{padding:12px 18px;min-height:48px;font:800 17px/1 var(--lab-font-body);color:var(--lab-ink);background:var(--g-panel-2);border:2px solid var(--g-a);border-radius:var(--g-r);cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--g-a) 40%,#000);transition:transform 144ms,opacity 233ms}
.g-word:hover:not(:disabled){transform:translateY(-2px)}.g-word:disabled{opacity:.2;cursor:default;box-shadow:none}
@keyframes gBlink{50%{border-color:var(--g-line)}}
/* sondaggio */
.g-poll-opts{display:grid;gap:13px}
.g-poll-row{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px}
.g-poll-b{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:13px;min-height:68px;padding:0 21px;text-align:left;border:2px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel-2);color:var(--lab-ink);cursor:pointer;transition:border-color 233ms,transform 144ms}
.g-poll-b:hover{border-color:var(--g-a)}.g-poll-b:active{transform:scale(.99)}
.g-poll-bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--g-b) 35%,transparent);transition:width 987ms var(--lab-ease-out)}
.g-poll-a{position:relative;font:800 22px/1.2 var(--lab-font-body)}
.g-poll-b .g-num{position:relative}
.g-poll-row.is-top .g-poll-b{border-color:var(--g-a);box-shadow:var(--g-glow-a)}.g-poll-row.is-top .g-poll-bar{background:color-mix(in srgb,var(--g-a) 35%,transparent)}
.g-poll-minus{border:1.5px solid var(--g-line);border-radius:var(--g-r);background:none;color:var(--lab-muted);font:800 22px/1 var(--lab-font-body);cursor:pointer}
.g-poll-minus:hover{color:var(--lab-ink);border-color:var(--lab-ink)}
.g-poll-b:active{transform:scale(.97)}
.g-poll-res{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.g-poll-n{font:700 13px/1 var(--lab-font-body);color:var(--lab-ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-poll-ok{position:absolute;right:13px;top:50%;z-index:1;margin-top:-14px;padding:0 12px;height:28px;display:none;align-items:center;border-radius:999px;background:var(--g-ok);color:#06281d;font:900 13px/1 var(--lab-font-body);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.g-poll-row.is-voted .g-poll-b{border-color:var(--g-ok);animation:gVote 987ms var(--lab-ease-out)}
.g-poll-row.is-voted .g-poll-ok{display:flex;animation:gVoteTag 1.6s var(--lab-ease-out) forwards}
.g-poll.is-shown .g-poll-row.is-voted .g-poll-ok{display:none}
.g-poll-reg{color:var(--g-ok);font-weight:800}
@keyframes gVote{0%{transform:scale(.97);background:color-mix(in srgb,var(--g-ok) 30%,var(--g-panel-2));box-shadow:0 0 0 0 color-mix(in srgb,var(--g-ok) 60%,transparent)}100%{transform:none;box-shadow:0 0 0 13px transparent}}
@keyframes gVoteTag{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}25%,75%{opacity:1;transform:none}100%{opacity:0}}
.g-debate{margin-top:21px;padding:16px 21px;border-radius:var(--g-r);border:2px solid var(--lab-ambra);animation:gIn 377ms both}
.g-debate p{margin:6px 0 0;font:700 20px/1.4 var(--lab-font-body);color:var(--lab-ink)}
.g-debate[hidden]{display:none}
@media (max-width:760px){.g-cols{grid-template-columns:1fr;gap:21px}.g-bins{grid-template-columns:1fr}.g-bin{min-height:110px}.g-mem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.g-seq-item{grid-template-columns:28px minmax(0,1fr) auto}.g-seq-y{display:none}.g-vf-btns{gap:13px}}

/* Lab IRC — Lezione interattiva (React). Si appoggia a lab-tokens.css, lab-artefatto.css e giochi.css.
   Uso: <body class="la g" data-anno="1-5"> + lab-lezione.js. Stati hover/focus/active espliciti su ogni controllo. */

html:has(body.ll),body.ll{overflow-x:clip}
body.ll[data-modo="lezione"]::before,body.ll[data-modo="studio"]::before{display:none}
#app{position:relative;z-index:1}

/* ---------- testata ---------- */
.ll-top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:minmax(0,1.618fr) auto;align-items:center;gap:13px 21px;padding:13px 21px;background:color-mix(in srgb,var(--lab-bg) 78%,transparent);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--lab-line-soft)}
.ll-brand{display:flex;align-items:center;gap:13px;min-width:0}
.ll-brand>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.ll-logo{flex:none;width:40px;height:40px;cursor:pointer;transition:transform 233ms var(--lab-ease-out)}
.ll-logo svg{display:block;width:100%;height:100%}
.ll-logo:hover{transform:rotate(-8deg) scale(1.08)}
.ll-logo:active{transform:scale(.92)}
.ll-brand small{font:600 12px/1.3 var(--lab-font-inscription);letter-spacing:.18em;text-transform:uppercase;color:var(--lab-oro)}
.ll-brand b{font:600 clamp(19px,2.2vw,24px)/1.15 var(--lab-font-display);color:var(--lab-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ll-modes{display:flex;gap:3px;padding:3px;border:1px solid var(--lab-line);border-radius:999px;background:var(--lab-surface)}
.ll-modes button{position:relative;font:700 14px/1 var(--lab-font-body);color:var(--lab-muted);background:none;border:0;padding:10px 16px;min-height:40px;border-radius:999px;cursor:pointer;transition:color 144ms,background 233ms var(--lab-ease-out),transform 144ms}
.ll-modes button:hover{color:var(--lab-ink);background:var(--lab-surface-2)}
.ll-modes button:active{transform:scale(.94)}
.ll-modes button[aria-selected="true"]{background:var(--lab-ink);color:var(--lab-bg)}
.ll-modes button:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);cursor:pointer;font-size:17px;transition:border-color 144ms,transform 233ms var(--lab-ease-out),background 233ms}
.ll-icon:hover{border-color:var(--lab-oro);transform:rotate(-12deg)}
.ll-icon:active{transform:scale(.9)}
.ll-icon:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-icon svg{width:19px;height:19px}
/* in visore (?in=visore → <html data-visore>, da lab-artefatto.js): il Visore del sito ha già una barra da 55 px con titolo e il pulsante schermo intero,
   quindi restano solo le schede (e il tema) in una riga da 55 px; il titolo della lezione resta nel corpo */
:root[data-visore] body.ll .ll-brand,:root[data-visore] body.ll .ll-tools [data-lim-toggle],:root[data-visore] body.ll .ll-tools .ll-icon--schermo{display:none}
:root[data-visore] body.ll .ll-top{grid-template-columns:1fr;box-sizing:border-box;min-height:55px;padding:3px 13px}
:root[data-visore] body.ll .ll-tools{justify-content:flex-start}
:root[data-visore] body.ll .ll-tools>.ll-icon{margin-left:auto}

/* ---------- palco della lezione ---------- */
.ll-stage{max-width:960px;margin:0 auto;padding:34px 21px 55px}
.ll-scene{position:relative}
.ll-scene.is-next{animation:llInNext 610ms var(--lab-ease-out) both}
.ll-scene.is-prev{animation:llInPrev 610ms var(--lab-ease-out) both}
.ll-moment{display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.18em;text-transform:uppercase;color:var(--lab-oro);margin:0 0 13px}
.ll-moment::before{content:"";width:21px;height:1px;background:currentColor}
.ll-h{font:600 clamp(34px,5.2vw,58px)/1.06 var(--lab-font-display);letter-spacing:-.02em;margin:0 0 21px;text-wrap:balance;color:var(--lab-ink)}
.ll-h:focus{outline:none}
.ll-h em{font-style:italic;font-weight:500;color:var(--la-accent)}
.ll-lead{font-size:clamp(18px,1.9vw,21px);line-height:1.55;color:var(--lab-ink-soft);max-width:58ch;margin:0 0 34px;text-wrap:pretty}
.ll-p{font-size:clamp(17px,1.7vw,19px);line-height:1.618;color:var(--lab-ink-soft);max-width:62ch;margin:0 0 21px;text-wrap:pretty}
.ll-p strong{color:var(--lab-ink);font-weight:700}
.ll-p em{font-style:italic}
.ll-blocks{display:grid;gap:34px;margin-top:21px}
.ll-block{position:relative;min-width:0}
.ll-blocks>*,.ll-stage>*{min-width:0}
.ll-block-h{font:600 clamp(22px,2.4vw,28px)/1.2 var(--lab-font-display);margin:0 0 13px;color:var(--lab-ink)}
.ll-hint{font-size:14px;color:var(--lab-muted);margin:0 0 13px}

/* navigazione fra le scene */
/* guscio: testata · scena che scorre · barra delle scene. La barra non copre mai il contenuto (prima galleggiava sopra) */
body.ll{height:100vh;height:100dvh;overflow:hidden}
body.ll #app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.ll-scroll{min-height:0;overflow-y:auto;overflow-x:clip;overscroll-behavior:contain}
.ll-nav{position:relative;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:13px;padding:8px 13px;border-top:1px solid var(--lab-line-soft);background:color-mix(in srgb,var(--lab-bg) 86%,transparent);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px)}
.ll-navc{flex:0 1 auto;display:flex;align-items:center;gap:13px;min-width:0}
.ll-nav-m{flex:none;width:68px;height:44px}
body.ll .la-mascot{right:13px;bottom:3px}
body.ll .la-mascot lab-mascotte{width:55px!important;height:55px!important}
body.ll:not([data-modo="lezione"]) .la-mascot{bottom:13px}
.ll-dots{display:flex;gap:5px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.ll-dot{flex:none;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--lab-muted);background:none;padding:0;cursor:pointer;transition:transform 233ms var(--lab-ease-out),background 233ms,border-color 233ms,width 377ms var(--lab-ease-out)}
.ll-dot:hover{transform:scale(1.3);border-color:var(--lab-oro)}
.ll-dot:active{transform:scale(.9)}
.ll-dot.is-seen{background:color-mix(in srgb,var(--la-accent) 45%,transparent);border-color:transparent}
.ll-dot[aria-current="step"]{width:34px;border-radius:999px;background:var(--la-accent);border-color:transparent}
.ll-dot:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-navbtn{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface-2);color:var(--lab-ink);font:700 15px/1 var(--lab-font-body);cursor:pointer;transition:transform 233ms var(--lab-ease-out),border-color 144ms,filter 233ms,background 233ms}
.ll-navbtn:hover:not(:disabled){border-color:var(--la-accent);transform:translateY(-2px)}
.ll-navbtn:active:not(:disabled){transform:scale(.96)}
.ll-navbtn:disabled{opacity:.35;cursor:default}
.ll-navbtn--go{background:var(--lab-grad);color:#fff;border-color:transparent;box-shadow:var(--lab-btn-glow);transform:translate(var(--bx,0px),var(--by,0px))}
.ll-navbtn--go:hover:not(:disabled){filter:brightness(1.08);box-shadow:var(--lab-btn-glow-hover)}
.ll-navbtn:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-count{font:600 12px/1 var(--lab-font-inscription);letter-spacing:.12em;color:var(--lab-muted);white-space:nowrap}

/* ---------- bottoni interni ---------- */
.ll-btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 21px;border-radius:999px;border:1px solid transparent;background:var(--la-accent);color:#14131F;font:700 15px/1 var(--lab-font-body);letter-spacing:.01em;cursor:pointer;transform:translate(var(--bx,0px),var(--by,0px)) scale(var(--bs,1));transition:transform 610ms var(--lab-ease-out),filter 233ms,box-shadow 377ms,border-color 377ms,color 233ms}
.ll-btn::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38.2%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);pointer-events:none}
.ll-btn:hover:not(:disabled){transition-duration:233ms,233ms,377ms,377ms,233ms;filter:brightness(1.06);box-shadow:0 13px 34px -13px var(--la-accent)}
.ll-btn:hover:not(:disabled)::before{left:130%;transition:left 987ms var(--lab-ease-out)}
.ll-btn:active:not(:disabled){--bs:.96}
.ll-btn--solenne{background:transparent;color:var(--lab-oro);border-color:color-mix(in srgb,var(--lab-oro) 45%,transparent);font:700 13px/1 var(--lab-font-inscription);letter-spacing:.18em;text-transform:uppercase}
.ll-btn--solenne::before,.ll-btn--ghost::before{left:0;top:auto;width:100%;height:100%;background:var(--lab-oro-soft);transform:scaleY(0);transform-origin:bottom;transition:transform 377ms var(--lab-ease-out)}
.ll-btn--ghost::before{background:color-mix(in srgb,var(--la-accent) 14%,transparent)}
.ll-btn--solenne:hover:not(:disabled)::before,.ll-btn--ghost:hover:not(:disabled)::before{left:0;transform:scaleY(1)}
.ll-btn--solenne:hover:not(:disabled){border-color:var(--lab-oro);box-shadow:none;filter:none}
.ll-btn--oro{background:var(--lab-ambra);color:#3a2a06}
.ll-btn:disabled{opacity:.4;cursor:default}
.ll-btn:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-btn--ghost{background:transparent;color:var(--lab-ink);border-color:var(--lab-line)}
.ll-btn--ghost:hover:not(:disabled){border-color:var(--la-accent);filter:none;box-shadow:none;color:var(--lab-ink)}
.ll-link{position:relative;background:none;border:0;padding:4px 0;color:var(--lab-accent);font:600 15px/1.3 var(--lab-font-body);cursor:pointer;transition:color 144ms}
.ll-link::after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:1px;background:var(--lab-oro);transition:left 377ms var(--lab-ease-out),right 377ms var(--lab-ease-out)}
.ll-link:hover{color:var(--lab-oro)}
.ll-link:hover::after{left:0;right:0}
.ll-link:active{opacity:.7}
.ll-link:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px;border-radius:4px}
.ll-row{display:flex;flex-wrap:wrap;align-items:center;gap:13px;margin-top:21px}

/* ---------- Rivela: passi progressivi ---------- */
.ll-steps{list-style:none;margin:0;padding:0;display:grid;gap:13px;counter-reset:st}
.ll-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:13px;align-items:start;padding:13px 21px 13px 13px;border-radius:13px;background:var(--lab-surface);border:1px solid var(--lab-line);animation:llStep 610ms var(--lab-ease-out) both}
.ll-step::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:600 14px/1 var(--lab-font-inscription);color:var(--la-accent);border:1px solid currentColor}
.ll-step b{display:block;font:600 21px/1.25 var(--lab-font-display);color:var(--lab-ink);margin:3px 0 5px}
.ll-step p{margin:0;color:var(--lab-ink-soft);font-size:17px;line-height:1.55}

/* ---------- Tappe: linea del tempo ---------- */
.ll-tl{position:relative;display:flex;gap:8px;overflow-x:auto;padding:21px 5px 13px;scrollbar-width:thin}
.ll-tl::before{content:"";position:absolute;left:13px;right:13px;top:41px;height:2px;background:linear-gradient(90deg,transparent,var(--lab-line) 8%,var(--lab-line) 92%,transparent)}
.ll-tl-b{position:relative;flex:1 0 110px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0 5px;color:var(--lab-muted);cursor:pointer;font:600 13px/1.3 var(--lab-font-body);text-align:center;transition:color 233ms}
.ll-tl-b i{width:21px;height:21px;border-radius:50%;border:2px solid var(--lab-line);background:var(--lab-bg);transition:transform 377ms var(--lab-ease-out),background 233ms,border-color 233ms,box-shadow 377ms}
.ll-tl-b span{font:600 12.5px/1.2 var(--lab-font-inscription);letter-spacing:.06em}
.ll-tl-b:hover{color:var(--lab-ink)}
.ll-tl-b:hover i{transform:scale(1.25);border-color:var(--lab-oro)}
.ll-tl-b:active i{transform:scale(.9)}
.ll-tl-b[aria-pressed="true"]{color:var(--lab-ink)}
.ll-tl-b[aria-pressed="true"] i{background:var(--la-accent);border-color:var(--la-accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--la-accent) 22%,transparent);transform:scale(1.2)}
.ll-tl-b:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px;border-radius:8px}
.ll-tl-card{margin-top:8px;padding:21px 34px 21px 21px;border-left:3px solid var(--la-accent);border-radius:0 13px 13px 0;background:var(--lab-surface);animation:llSlide 377ms var(--lab-ease-out) both}
.ll-tl-card small{font:600 12.5px/1 var(--lab-font-inscription);letter-spacing:.14em;color:var(--lab-oro)}
.ll-tl-card b{display:block;font:600 24px/1.2 var(--lab-font-display);margin:8px 0}
.ll-tl-card p{margin:0;color:var(--lab-ink-soft);font-size:17px}

/* ---------- Confronto ---------- */
.ll-cmp{display:grid;grid-template-columns:minmax(0,.618fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--lab-line);border-radius:21px;overflow:hidden;background:var(--lab-surface)}
.ll-cmp>div{padding:13px 21px;border-top:1px solid var(--lab-line-soft);font-size:16.5px;line-height:1.45;color:var(--lab-ink-soft)}
.ll-cmp .ll-cmp-h{border-top:0;font:600 22px/1.2 var(--lab-font-display);color:var(--lab-ink);background:var(--lab-surface-2)}
.ll-cmp .ll-cmp-h:nth-child(2){color:var(--la-accent)}
.ll-cmp .ll-cmp-k{font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.1em;text-transform:uppercase;color:var(--lab-muted)}
.ll-cmp .is-new{animation:llFade 610ms var(--lab-ease-out) both}
.ll-cmp .is-hidden{color:transparent;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--lab-line) 40%,transparent) 8px 9px)}
@media (max-width:640px){.ll-cmp{grid-template-columns:1fr 1fr}.ll-cmp .ll-cmp-k{grid-column:1/-1;padding-bottom:0;border-top-width:3px}.ll-cmp .ll-cmp-h:first-child{display:none}}

/* ---------- Carte da girare ---------- */
.ll-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
.ll-flip{position:relative;min-height:178px;perspective:987px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ll-flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 610ms var(--lab-ease-out)}
.ll-flip[aria-pressed="true"] .ll-flip-in{transform:rotateY(180deg)}
.ll-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:21px;border-radius:21px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--lab-line);background:var(--lab-surface);transition:border-color 233ms,box-shadow 377ms}
.ll-face b{font:600 26px/1.15 var(--lab-font-display);color:var(--lab-ink)}
.ll-face small{font:600 11.5px/1 var(--lab-font-inscription);letter-spacing:.16em;text-transform:uppercase;color:var(--lab-muted)}
.ll-face--back{transform:rotateY(180deg);background:color-mix(in srgb,var(--la-accent) 13%,var(--lab-surface));border-color:color-mix(in srgb,var(--la-accent) 45%,var(--lab-line))}
.ll-face--back p{margin:0;font-size:16.5px;line-height:1.5;color:var(--lab-ink)}
.ll-flip:hover .ll-face{border-color:var(--lab-oro);box-shadow:var(--lab-shadow)}
.ll-flip:active .ll-flip-in{transition-duration:144ms}
.ll-flip:focus-visible{outline:none}
.ll-flip:focus-visible .ll-face{outline:1.5px solid var(--lab-oro);outline-offset:3px}

/* ---------- Citazione ---------- */
.ll-quote{position:relative;margin:0;padding:34px 34px 34px 55px}
.ll-quote::before{content:"«";position:absolute;left:0;top:-8px;font:500 89px/1 var(--lab-font-display);color:var(--lab-oro);opacity:.7}
.ll-quote blockquote{margin:0;font:italic 500 clamp(24px,3vw,34px)/1.35 var(--lab-font-display);color:var(--lab-ink);text-wrap:balance}
.ll-quote figcaption{margin-top:21px;display:flex;align-items:center;gap:13px;font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro)}
.ll-quote figcaption::before{content:"";width:34px;height:1px;background:currentColor}
.ll-gloss{margin:13px 0 0;padding:13px 21px;border-radius:13px;background:var(--lab-oro-soft);color:var(--lab-ink);font-size:17px;line-height:1.55;animation:llSlide 377ms var(--lab-ease-out) both}

/* ---------- Domanda alla classe (conteggio a mano alzata) ---------- */
.ll-poll{display:grid;gap:8px}
.ll-poll-r{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.ll-poll-b{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:13px;min-height:52px;padding:0 21px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface-2);color:var(--lab-ink);font:600 17px/1.3 var(--lab-font-body);cursor:pointer;text-align:left;transition:border-color 144ms,transform 233ms var(--lab-ease-out)}
.ll-poll-b>i{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--la-accent) 24%,transparent);transition:width 610ms var(--lab-ease-out)}
.ll-poll-b>span,.ll-poll-b>b{position:relative}
.ll-poll-b>b{font:600 15px/1 var(--lab-font-inscription);color:var(--la-accent)}
.ll-poll-b:hover{border-color:var(--la-accent);transform:translateX(3px)}
.ll-poll-b:active{transform:scale(.98)}
.ll-poll-b:focus-visible,.ll-poll-m:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-poll-m{border-radius:13px;border:1.5px solid var(--lab-line);background:none;color:var(--lab-muted);font:700 20px/1 var(--lab-font-body);cursor:pointer;transition:color 144ms,border-color 144ms,transform 144ms}
.ll-poll-m:hover{color:var(--lab-rosso);border-color:var(--lab-rosso)}
.ll-poll-m:active{transform:scale(.9)}

/* ---------- Verifica lampo ---------- */
.ll-check{padding:34px;border-radius:21px;background:var(--lab-surface);border:1px solid var(--lab-line)}
.ll-check .la-q{margin:0 0 21px}
.ll-why{margin:21px 0 0;padding:13px 21px;border-radius:13px;font-size:17px;line-height:1.5;animation:llSlide 377ms var(--lab-ease-out) both}
.ll-why.is-ok{background:color-mix(in srgb,var(--lab-verde) 14%,transparent);color:var(--lab-ink)}
.ll-why.is-ko{background:color-mix(in srgb,var(--lab-rosso) 12%,transparent);color:var(--lab-ink)}

/* ---------- Smista ---------- */
.ll-sort{padding:34px;border-radius:21px;background:var(--lab-surface-2);border:1px dashed var(--lab-line)}
.ll-sort-item{font:600 clamp(22px,2.6vw,30px)/1.25 var(--lab-font-display);color:var(--lab-ink);min-height:2.6em;margin:13px 0 21px;text-wrap:balance}
.ll-sort-item.is-in{animation:llDeal 377ms var(--lab-ease-out) both}
.ll-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}
.ll-bin{min-height:64px;padding:13px;border-radius:13px;border:2px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:700 16px/1.25 var(--lab-font-body);cursor:pointer;transition:border-color 144ms,transform 233ms var(--lab-ease-out),background 233ms}
.ll-bin:hover:not(:disabled){border-color:var(--la-accent);transform:translateY(-3px)}
.ll-bin:active:not(:disabled){transform:translateY(1px) scale(.97)}
.ll-bin:disabled{cursor:default;opacity:.5}
.ll-bin.is-right{border-color:var(--lab-verde);background:color-mix(in srgb,var(--lab-verde) 14%,var(--lab-surface));opacity:1}
.ll-bin.is-wrong{border-color:var(--lab-rosso);animation:laShake 377ms}
.ll-bin:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-tally{font:600 13px/1 var(--lab-font-inscription);letter-spacing:.12em;color:var(--lab-muted)}

/* ---------- Mappa concettuale ---------- */
.ll-map{position:relative;aspect-ratio:1.618/1;min-height:300px;border-radius:21px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--la-accent) 10%,transparent),transparent 61.8%),var(--lab-surface);border:1px solid var(--lab-line);overflow:hidden}
.ll-map svg{position:absolute;inset:0;width:100%;height:100%}
.ll-map line{stroke:var(--lab-line);stroke-width:1.5;transition:stroke 377ms,stroke-width 377ms}
.ll-map line.is-on{stroke:var(--la-accent);stroke-width:3}
.ll-map-c,.ll-map-n{position:absolute;transform:translate(-50%,-50%);text-align:center}
.ll-map-c{padding:13px 21px;border-radius:999px;background:var(--lab-grad);color:#fff;font:600 clamp(19px,2.4vw,26px)/1.1 var(--lab-font-display);box-shadow:var(--lab-btn-glow);white-space:nowrap}
.ll-map-n{max-width:30%;padding:8px 13px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-bg-2);color:var(--lab-ink);font:700 clamp(13px,1.5vw,16px)/1.25 var(--lab-font-body);cursor:pointer;transition:border-color 144ms,transform 233ms var(--lab-ease-out),background 233ms}
.ll-map-n:hover{border-color:var(--lab-oro);transform:translate(-50%,-50%) scale(1.06)}
.ll-map-n:active{transform:translate(-50%,-50%) scale(.95)}
.ll-map-n[aria-pressed="true"]{border-color:var(--la-accent);background:color-mix(in srgb,var(--la-accent) 18%,var(--lab-bg-2))}
.ll-map-n:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.ll-map-d{margin-top:13px;padding:13px 21px;border-radius:13px;background:var(--lab-surface);border-left:3px solid var(--la-accent);font-size:17px;line-height:1.5;color:var(--lab-ink-soft);animation:llSlide 377ms var(--lab-ease-out) both}
.ll-map-d b{color:var(--lab-ink)}

/* ---------- Parola ---------- */
.ll-word{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);gap:21px;align-items:center;padding:34px;border-radius:34px;background:linear-gradient(160deg,color-mix(in srgb,var(--la-accent) 12%,var(--lab-surface)),var(--lab-surface));border:1px solid var(--lab-line)}
.ll-word-w{font:600 clamp(40px,7vw,76px)/1 var(--lab-font-inscription);letter-spacing:.06em;color:var(--lab-ink);background:none;border:0;padding:0;cursor:pointer;text-align:left;transition:color 233ms,letter-spacing 610ms var(--lab-ease-out)}
.ll-word-w:hover{color:var(--la-accent);letter-spacing:.1em}
.ll-word-w:active{opacity:.7}
.ll-word-w:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:6px;border-radius:8px}
.ll-word-w span{display:inline-block;transition:transform 610ms var(--lab-ease-out),color 377ms}
.ll-word.is-open .ll-word-w span.is-root{color:var(--la-accent);transform:translateY(-5px)}
.ll-word-info small{font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro)}
.ll-word-info p{margin:8px 0 0;font-size:17px;line-height:1.5;color:var(--lab-ink-soft);animation:llFade 610ms var(--lab-ease-out) both}
@media (max-width:640px){.ll-word{grid-template-columns:1fr;padding:21px}}

/* ---------- Immagine ---------- */
.ll-fig{margin:0}
.ll-fig img{display:block;width:100%;height:auto;border-radius:21px;border:1px solid var(--lab-line)}
.ll-fig figcaption{margin-top:8px;font-size:14px;color:var(--lab-muted)}

/* ---------- Richiamo al gioco ---------- */
.ll-play{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:13px;padding:21px 21px 21px 34px;border-radius:21px;background:var(--lab-grad-warm);color:#231505}
.ll-play b{font:600 24px/1.2 var(--lab-font-display)}
.ll-play p{margin:4px 0 0;font-size:15px;opacity:.85}
.ll-play .ll-btn{background:#231505;color:#fff}

/* ---------- Studio ---------- */
.ll-study{max-width:720px;margin:0 auto;padding:55px 21px 89px}
.ll-study h1{font:600 clamp(36px,5.4vw,60px)/1.06 var(--lab-font-display);margin:0 0 13px}
.ll-study h2{font:600 clamp(26px,3vw,33px)/1.2 var(--lab-font-display);margin:55px 0 13px;color:var(--lab-ink)}
.ll-study .ll-p{max-width:none}
.ll-study-meta{font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro);margin:0 0 34px}
.ll-sources{margin-top:55px;padding-top:21px;border-top:1px solid var(--lab-line);font-size:14.5px;color:var(--lab-muted)}
.ll-sources li{margin-bottom:5px}

/* ---------- Giochi (contenitore) ---------- */
.ll-games{max-width:960px;margin:0 auto;padding:21px 21px 55px}
.ll-games .g-tabs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

/* ---------- piede, festa, AMDG ---------- */
.ll-foot{max-width:960px;margin:0 auto;padding:21px 21px 34px;display:flex;justify-content:space-between;gap:13px;font-size:12.5px;color:var(--lab-muted)}
.ll-amdg{background:none;border:0;padding:0;font:600 11px/1 var(--lab-font-inscription);letter-spacing:.3em;color:var(--lab-oro);opacity:.13;cursor:pointer;transition:opacity 610ms}
.ll-amdg:hover,.ll-amdg:focus-visible{opacity:.8}
.ll-party{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.ll-party i{position:absolute;top:-13px;width:8px;height:13px;border-radius:2px;animation:llFall 1618ms var(--lab-ease-solemn) forwards}
.ll-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@keyframes llInNext{from{opacity:0;transform:translateX(34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes llInPrev{from{opacity:0;transform:translateX(-34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes llStep{from{opacity:0;transform:translateY(13px) scale(.98)}to{opacity:1;transform:none}}
@keyframes llSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes llFade{from{opacity:0}to{opacity:1}}
@keyframes llDeal{from{opacity:0;transform:rotate(-2deg) translateY(21px)}to{opacity:1;transform:none}}
@keyframes llFall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.2}}

@media (max-width:720px){
  .ll-top{grid-template-columns:1fr;padding:8px 13px}
  .ll-tools{justify-content:space-between}
  .ll-modes button{padding:10px 12px}
  .ll-stage{padding:21px 16px 34px}
  .ll-count{display:none}
  .ll-check,.ll-sort{padding:21px}
  .ll-map{aspect-ratio:auto;min-height:420px}
}
@media (prefers-reduced-motion:reduce){.ll-flip-in{transition:none}.ll-party{display:none}}
@media print{.ll-top,.ll-nav,.la-mascot,.la-halo,.ll-foot{display:none!important}body{background:#fff;color:#000}body.ll{height:auto;overflow:visible}body.ll #app{display:block;height:auto}.ll-scroll{overflow:visible}}

/* ---------- intestazione di scena con mascotte (φ: 1.618fr : 1fr) ---------- */
.ll-head.has-masc{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);align-items:center;gap:21px}
.ll-head-m{display:grid;place-items:center;animation:llPeek 987ms var(--lab-ease-out) 233ms both}
.la-mascot{transition:opacity 377ms,transform 610ms var(--lab-ease-out)}
body[data-masc-scena="1"] .la-mascot{animation:none;opacity:0;visibility:hidden;pointer-events:none}

/* ---------- Nota (callout ambra del design system) ---------- */
.ll-nota{display:flex;gap:13px;align-items:flex-start;border-left:4px solid var(--lab-ambra);background:color-mix(in srgb,var(--lab-ambra) 12%,transparent);border-radius:0 13px 13px 0;padding:13px 21px}
.ll-nota-i{flex:none;font-size:17px;line-height:1.5}
.ll-nota-p{margin:0 0 8px;font-size:16.5px;line-height:1.55;color:var(--lab-ink-soft)}
.ll-nota-p:last-child{margin:0}

/* ---------- La mascotte interviene ---------- */
.ll-masc{display:flex;align-items:center;gap:21px}
.ll-masc lab-mascotte{flex:none}
.ll-masc-b{position:relative;flex:1;padding:13px 21px;border-radius:21px;border:1px solid var(--lab-oro);background:var(--lab-surface);box-shadow:var(--lab-shadow)}
.ll-masc-b::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;margin-top:-6.5px;background:inherit;border-left:1px solid var(--lab-oro);border-bottom:1px solid var(--lab-oro);transform:rotate(45deg)}
.ll-masc-b small{font:600 12px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro)}
.ll-masc-b p{margin:5px 0 0;font:500 clamp(18px,2vw,21px)/1.45 var(--lab-font-body);color:var(--lab-ink);animation:llFade 610ms var(--lab-ease-out) both}

/* ---------- Studio ---------- */
.ll-study-top{display:flex;align-items:center;gap:13px;margin-bottom:21px}
.ll-study-top .ll-study-meta{margin:0}

@keyframes llPeek{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
@media (max-width:720px){
  .ll-head.has-masc{grid-template-columns:1fr}
  .ll-head-m{order:-1;justify-items:start}
  .ll-head-m lab-mascotte{width:89px!important;height:89px!important}
  .la-mascot lab-mascotte{width:44px!important;height:44px!important}
  .ll-masc{gap:13px}.ll-masc lab-mascotte{width:55px!important;height:55px!important}
}
@media print{.ll-head-m{display:none}}

/* ---------- barra dei giochi (kit definitivo, 5 ottobre 2026): stessa fascia della barra delle scene ---------- */
.ll-nav--giochi .ll-navc:nth-child(2){margin-left:auto}
.ll-navbtn--back{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.ll-navbtn--back small{font:600 11px/1 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-muted)}
.ll-nav--giochi .g-tool{min-height:44px;padding:0 16px;border-radius:999px;white-space:nowrap;transition:color 144ms,border-color 233ms,transform 144ms}
.ll-nav--giochi .g-tool:hover{border-color:var(--la-accent)}
.ll-nav--giochi .g-tool:active{transform:scale(.95)}
.ll-nav--giochi .g-tool[aria-pressed="true"]{color:var(--lab-muted);border-style:dashed}
body.ll[data-modo="giochi"] .la-mascot{bottom:3px}
@media (max-width:480px){.ll-navbtn--back small{display:none}}

/* Lab IRC — Strumenti aggiuntivi della lezione. Solo token del design system; φ in spazi e durate. */

/* comuni */
.lp-p{margin:0 0 8px;font-size:17px;line-height:1.55;color:var(--lab-ink-soft)}.lp-p:last-child{margin:0}
.lp-pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--lab-oro) 50%,transparent);font:600 11.5px/1 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-oro);white-space:nowrap}
.lp-sq{width:44px;padding:0;justify-content:center;font-size:18px}
.lp-src{display:block;margin-top:5px;font-size:13px;color:var(--lab-muted)}

/* ---------- Gestalt nella scena ----------
   prossimità: 8 dentro un gruppo · 21 fra gruppi vicini · 55 fra blocchi diversi;
   regione comune: ogni strumento interattivo sta in un solo riquadro; figura–sfondo: dentro il riquadro gli elementi salgono di un tono;
   somiglianza: un solo pulsante pieno per blocco (azione principale), contorno per le secondarie, link per tornare indietro. */
.ll-head{margin-bottom:21px}
.ll-lead{margin-bottom:21px}
.ll-blocks{gap:55px;margin-top:34px}
.ll-block[data-tipo="aggancio"]{margin-top:-34px}
.ll-block[data-tipo="testo"]+.ll-block{margin-top:-21px}
.ll-block:is([data-tipo="catena"],[data-tipo="animazione"],[data-tipo="strati"],[data-tipo="bilancia"],[data-tipo="lente"],[data-tipo="leggi"],[data-tipo="ordina"],[data-tipo="tappe"],[data-tipo="rivela"],[data-tipo="domanda"]){padding:34px;border-radius:21px;background:var(--lab-surface);border:1px solid var(--lab-line)}
.ll-block:is([data-tipo="rivela"]) .ll-step,.ll-block[data-tipo="tappe"] .ll-tl-card,.ll-block[data-tipo="catena"] .lp-node,.ll-block[data-tipo="ordina"] .lp-ord-i{background:var(--lab-surface-2)}
.ll-block[data-tipo="tappe"] .ll-tl-b i{background:var(--lab-surface)}
.ll-block .ll-block-h{margin-bottom:21px}
.ll-block .ll-row{margin-top:21px}
.ll-block[data-tipo="animazione"] .lp-stage{background:var(--lab-bg-2)}

/* percorsi (testata della prima scena) */
.ll-route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 34px;padding:13px;border:1px dashed var(--lab-line);border-radius:21px}
.ll-route .ll-moment{margin:0 8px 0 0}
.ll-route button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink-soft);font:700 14px/1 var(--lab-font-body);cursor:pointer;transition:border-color 144ms,background 233ms,color 144ms,transform 144ms}
.ll-route button:hover{border-color:var(--lab-oro);color:var(--lab-ink)}
.ll-route button:active{transform:scale(.95)}
.ll-route button[aria-checked="true"]{background:var(--lab-ink);color:var(--lab-bg);border-color:transparent}
.ll-route button:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-route p{flex-basis:100%;margin:5px 0 0 5px;font-size:14px;color:var(--lab-muted)}
.ll-moment{white-space:nowrap}
.ll-play .ll-btn,.ll-games .ll-row>.ll-navbtn,.ll-games .g-tool{white-space:nowrap}
.ll-games .ll-row{flex-wrap:wrap}
/* corsia della mascotte fissa (in basso a destra): i controlli non ci finiscono sotto */
@media (min-width:641px){.ll-play,.lp-task-h{padding-right:144px}}
body:has(.lp-task) .la-mascot,body:has(.ll-play) .la-mascot,body:has(.ll-masc) .la-mascot{opacity:0;visibility:hidden;pointer-events:none}

/* ---------- catena ---------- */
.lp-chain-l{list-style:none;margin:0;padding:0;display:grid}
.lp-ring{display:grid;justify-items:start;animation:lpHook 610ms var(--lab-ease-out) both}
.lp-link{position:relative;display:flex;align-items:center;gap:13px;height:44px;margin-left:27px}
.lp-link i{width:2px;height:100%;background:linear-gradient(var(--lab-oro),var(--la-accent));transform-origin:top;animation:lpDraw 377ms var(--lab-ease-out) both}
.lp-link em{font:italic 500 19px/1 var(--lab-font-display);color:var(--lab-oro);animation:llFade 610ms var(--lab-ease-out) 233ms both}
.lp-node{display:grid;gap:3px;width:100%;max-width:640px;text-align:left;padding:13px 21px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:inherit;transition:border-color 233ms,opacity 610ms,transform 610ms var(--lab-ease-out),filter 610ms}
.lp-node b{font:600 22px/1.25 var(--lab-font-display)}
.lp-node span{font-size:16px;line-height:1.5;color:var(--lab-ink-soft)}
.lp-ring:last-child .lp-node{border-color:color-mix(in srgb,var(--la-accent) 55%,var(--lab-line));box-shadow:0 0 0 4px color-mix(in srgb,var(--la-accent) 10%,transparent)}
button.lp-node{cursor:pointer}
button.lp-node:hover{border-color:var(--lab-rosso)}
button.lp-node:active{transform:scale(.98)}
button.lp-node:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.lp-ring.is-broken .lp-node{border-style:dashed;border-color:var(--lab-rosso);opacity:.55}
.lp-ring.is-fallen .lp-node{opacity:.32;transform:translateY(8px) rotate(-1deg);filter:grayscale(1)}
.lp-ring.is-fallen .lp-link i,.lp-ring.is-broken .lp-link i{background:repeating-linear-gradient(var(--lab-rosso) 0 5px,transparent 5px 10px)}

/* ---------- animazione ---------- */
.lp-stage{position:relative;width:100%;min-height:240px;max-height:46vh;border-radius:13px;border:1px solid var(--lab-line-soft);background:var(--lab-bg-2);overflow:hidden}
.lp-arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lp-arrow{fill:none;stroke:var(--lab-oro);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lpStroke 987ms var(--lab-ease-out) 377ms forwards}
.lp-arrow.is-dash{stroke-dasharray:6 6;stroke-dashoffset:0;animation:llFade 610ms 377ms both}
.lp-arrow-t{position:absolute;transform:translate(-50%,-140%);padding:3px 8px;border-radius:8px;background:var(--lab-bg);font:italic 500 clamp(13px,1.5vw,17px)/1.2 var(--lab-font-display);color:var(--lab-oro);white-space:nowrap;animation:llFade 610ms var(--lab-ease-out) 987ms both;pointer-events:none}
.lp-actor{position:absolute;display:grid;place-items:center;text-align:center;color:var(--lab-ink);font:700 clamp(12px,1.6vw,16px)/1.2 var(--lab-font-body);transition:left 987ms var(--lab-ease-out),top 987ms var(--lab-ease-out),opacity 610ms var(--lab-ease-out),transform 987ms var(--lab-ease-out),box-shadow 610ms,border-color 610ms;will-change:left,top,transform}
.lp-f-pillola{padding:8px 13px;border-radius:999px;border:1.5px solid var(--lp-c);background:color-mix(in srgb,var(--lp-c) 16%,var(--lab-bg-2));max-width:38%}
.lp-f-riquadro{padding:13px;border-radius:13px;border:1.5px solid var(--lp-c);background:color-mix(in srgb,var(--lp-c) 12%,var(--lab-bg-2));max-width:34%}
.lp-f-cerchio{width:clamp(55px,11vw,96px);aspect-ratio:1;border-radius:50%;border:1.5px solid var(--lp-c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--lp-c) 34%,transparent),color-mix(in srgb,var(--lp-c) 10%,var(--lab-bg-2)));padding:5px}
.lp-f-punto{width:21px;height:21px;border-radius:50%;background:var(--lp-c);box-shadow:0 0 21px var(--lp-c);font-size:0}
.lp-f-testo{font:600 clamp(18px,2.6vw,30px)/1.1 var(--lab-font-display);color:var(--lp-c);max-width:46%}
.lp-actor.is-on{box-shadow:0 0 0 6px color-mix(in srgb,var(--lp-c) 22%,transparent),0 0 34px color-mix(in srgb,var(--lp-c) 45%,transparent)}
.lp-c-accent{--lp-c:var(--la-accent)}.lp-c-oro{--lp-c:var(--lab-oro)}.lp-c-ciano{--lp-c:var(--lab-ciano)}.lp-c-rosa{--lp-c:var(--lab-rosa)}.lp-c-verde{--lp-c:var(--lab-verde)}.lp-c-rosso{--lp-c:var(--lab-rosso)}.lp-c-muted{--lp-c:var(--lab-muted)}
.lp-cap{min-height:3.2em;margin:21px 0 0;font-size:clamp(17px,1.8vw,20px);line-height:1.5;color:var(--lab-ink);animation:llSlide 377ms var(--lab-ease-out) both;text-wrap:pretty}
.lp-cap .ll-tally{margin-right:8px}
.lp-ctrl{margin-top:8px}
.lp-pips{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- strati ---------- */
.lp-lay-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.618fr);gap:21px;align-items:center}
.lp-rings-w{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden}
.lp-rings{position:absolute;inset:0;transition:transform 987ms var(--lab-ease-out)}
.lp-ring-b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid var(--lab-line);background:color-mix(in srgb,var(--la-accent) 6%,var(--lab-surface));color:var(--lab-muted);cursor:pointer;padding:0;transition:border-color 233ms,background 377ms,opacity 610ms,color 233ms}
.lp-ring-b span{position:absolute;left:50%;top:5%;transform:translateX(-50%);max-width:70%;font:600 clamp(10px,1.2vw,12.5px)/1.2 var(--lab-font-inscription);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-ring-b:last-child span{top:50%;transform:translate(-50%,-50%);white-space:normal;text-align:center}
.lp-ring-b:hover{border-color:var(--lab-oro);color:var(--lab-ink)}
.lp-ring-b:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:-4px}
.lp-ring-b.is-on{border-color:var(--la-accent);border-width:2.5px;background:color-mix(in srgb,var(--la-accent) 20%,var(--lab-surface));color:var(--lab-ink)}
.lp-ring-b.is-out{opacity:.35}
.lp-lay-in{animation:llSlide 377ms var(--lab-ease-out) both}
.lp-lay-in small{font:600 12px/1 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro)}
.lp-lay-in b{display:block;margin:8px 0;font:600 clamp(24px,2.8vw,32px)/1.15 var(--lab-font-display);color:var(--lab-ink)}
@media (max-width:640px){.lp-lay-g{grid-template-columns:1fr}.lp-rings-w{max-width:300px;width:100%;margin:0 auto}}

/* ---------- aggancio (rimando breve, appartiene al blocco sopra) ---------- */
.lp-hook{border-radius:13px;border:1px solid var(--lab-line-soft);background:transparent;transition:border-color 233ms,background 377ms}
.lp-hook.is-open{border-color:color-mix(in srgb,var(--lab-oro) 40%,var(--lab-line));background:var(--lab-oro-soft)}
.lp-hook-b{display:flex;align-items:center;gap:13px;width:100%;min-height:52px;padding:8px 13px 8px 8px;border:0;background:none;color:var(--lab-ink-soft);font:500 16px/1.35 var(--lab-font-body);text-align:left;cursor:pointer;border-radius:13px}
.lp-hook-b:hover{color:var(--lab-ink)}
.lp-hook-b:hover .lp-hook-k{border-color:var(--lab-oro)}
.lp-hook-b:active{opacity:.8}
.lp-hook-b:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lp-hook-k{flex:none;display:inline-flex;align-items:center;min-height:30px;padding:0 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--lab-oro) 50%,transparent);font:600 11.5px/1 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--lab-oro);transition:border-color 144ms}
.lp-hook-t{flex:1;min-width:0}
.lp-hook-b i{flex:none;font-style:normal;font-size:20px;color:var(--lab-oro);width:21px;text-align:center}
.lp-hook-c{padding:0 21px 13px;animation:llSlide 377ms var(--lab-ease-out) both}
.lp-hook-c .lp-p{font-size:16px}

/* ---------- bilancia ---------- */
.lp-beam-w{position:relative;height:178px;margin:0 auto 8px;max-width:520px}
.lp-beam{position:absolute;left:8%;right:8%;top:34px;height:4px;border-radius:4px;background:var(--lab-oro);transform-origin:50% 50%;transition:transform 987ms var(--lab-ease-out)}
.lp-pan{position:absolute;top:2px;width:34%;min-width:110px;display:grid;justify-items:center;gap:3px;padding:34px 8px 8px;transform-origin:50% 0;transition:transform 987ms var(--lab-ease-out)}
.lp-pan::before{content:"";position:absolute;top:0;left:50%;width:1px;height:34px;background:var(--lab-oro)}
.lp-pan--0{left:0;translate:-50% 0}.lp-pan--1{right:0;translate:50% 0}
.lp-pan b{display:block;width:100%;padding:8px;border-radius:0 0 34px 34px;border:1.5px solid var(--lab-oro);border-top-width:3px;background:var(--lab-surface);font:600 18px/1.2 var(--lab-font-display);text-align:center;color:var(--lab-ink)}
.lp-pan span{font-size:11px;letter-spacing:2px;color:var(--la-accent);min-height:14px}
.lp-fulcrum{position:absolute;left:50%;top:36px;width:0;height:0;transform:translateX(-50%);border-left:21px solid transparent;border-right:21px solid transparent;border-bottom:89px solid var(--lab-line)}
.lp-args{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.lp-arg{display:grid;gap:5px;text-align:left;padding:13px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface-2);color:var(--lab-ink);font:500 16px/1.4 var(--lab-font-body);cursor:pointer;transition:border-color 144ms,transform 233ms var(--lab-ease-out),background 233ms}
.lp-arg small{font:600 11px/1 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-muted)}
.lp-arg:hover{border-color:var(--lab-oro);transform:translateY(-2px)}
.lp-arg:active{transform:scale(.97)}
.lp-arg:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lp-arg[aria-pressed="true"]{border-color:var(--la-accent);background:color-mix(in srgb,var(--la-accent) 14%,var(--lab-surface-2))}
.lp-arg[aria-pressed="true"] small{color:var(--la-accent)}

/* ---------- stima ---------- */
.lp-est{padding:34px;border-radius:21px;background:var(--lab-surface);border:1px solid var(--lab-line)}
.lp-est .la-q{margin:8px 0 13px}
.lp-est-v{font:600 clamp(42px,7vw,68px)/1 var(--lab-font-inscription);color:var(--la-accent);margin:13px 0 21px}
.lp-est-v b{font-weight:600}
.lp-est-t{position:relative;padding:8px 0 34px}
.lp-est-t input{width:100%;accent-color:var(--la-accent);height:34px;cursor:pointer}
.lp-est-t input:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:4px;border-radius:8px}
.lp-est-true{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;animation:lpDrop 610ms var(--lab-ease-out) both;pointer-events:none}
.lp-est-true i{width:3px;height:44px;border-radius:3px;background:var(--lab-oro);box-shadow:0 0 13px var(--lab-oro)}
.lp-est-true em{margin-top:3px;font:600 13px/1 var(--lab-font-inscription);font-style:normal;color:var(--lab-oro);white-space:nowrap}
.lp-est-s{display:flex;justify-content:space-between;font:600 12px/1 var(--lab-font-inscription);color:var(--lab-muted)}

/* ---------- lente ---------- */
.lp-lens-q{font:600 clamp(21px,2.4vw,26px)/1.3 var(--lab-font-display);color:var(--lab-ink);margin:0 0 13px}
.lp-lens-q .la-meta{display:block;margin-bottom:5px;color:var(--lab-oro)}
.lp-lens-f{margin:0}
.lp-lens-s{position:relative;width:100%;border-radius:21px;overflow:hidden;border:1px solid var(--lab-line);background:var(--lab-surface)}
.lp-lens-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lp-ph{position:absolute;inset:0;display:grid;place-items:center;padding:21px;background:repeating-linear-gradient(135deg,var(--lab-surface) 0 13px,var(--lab-surface-2) 13px 14px);color:var(--lab-muted);font:600 13px/1.4 var(--lab-font-inscription);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.lp-pt{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:color-mix(in srgb,var(--la-accent) 80%,#000);color:#fff;font:700 16px/1 var(--lab-font-body);cursor:pointer;box-shadow:0 0 0 0 color-mix(in srgb,var(--la-accent) 60%,transparent);animation:lpPulse 2618ms var(--lab-ease-out) infinite;transition:transform 233ms var(--lab-ease-out),background 233ms}
.lp-pt:hover{transform:translate(-50%,-50%) scale(1.12)}
.lp-pt:active{transform:translate(-50%,-50%) scale(.92)}
.lp-pt:focus-visible{outline:2px solid var(--lab-oro);outline-offset:3px}
.lp-pt.is-on{background:var(--lab-oro);color:#231505;animation:none}
.lp-pt.is-key{background:var(--lab-verde);color:#06281d}
.lp-pt.is-wrong{background:var(--lab-rosso);animation:laShake 377ms}
.lp-lens-f figcaption{margin-top:8px;font-size:14px;color:var(--lab-muted)}
.lp-lens-d{margin-top:13px;padding:13px 21px;border-radius:13px;background:var(--lab-surface);border-left:3px solid var(--lab-oro);animation:llSlide 377ms var(--lab-ease-out) both}
.lp-lens-d b{display:block;margin-bottom:5px;font:600 21px/1.25 var(--lab-font-display);color:var(--lab-ink)}

/* ---------- leggi ---------- */
.lp-read-t{margin:0;padding:21px 0 0 34px;border-left:2px solid var(--lab-oro)}
.lp-read-t p{margin:0 0 13px;font:500 clamp(21px,2.6vw,28px)/1.5 var(--lab-font-display);color:var(--lab-ink-soft);text-wrap:pretty}
.lp-seg{display:inline;padding:0 2px;margin:0;border:0;border-radius:4px;background:none;color:var(--lab-ink);font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lab-oro);text-decoration-thickness:1.5px;text-underline-offset:5px;transition:background 233ms,color 233ms;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lp-seg:hover{background:var(--lab-oro-soft)}
.lp-seg:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lp-seg.is-hunt{text-decoration-style:dotted}
.lp-seg.is-on{background:color-mix(in srgb,var(--la-accent) 20%,transparent)}
.lp-seg.is-right{background:color-mix(in srgb,var(--lab-verde) 24%,transparent);text-decoration-color:var(--lab-verde)}
.lp-seg.is-wrong{text-decoration-color:var(--lab-rosso);text-decoration-style:wavy}
.lp-read-f{margin:8px 0 0 34px;font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-oro)}

/* ---------- ordina ---------- */
.lp-ord-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lp-ord-i{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:13px;align-items:center;padding:8px 8px 8px 13px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface);animation:llStep 377ms var(--lab-ease-out) both;transition:border-color 233ms,background 233ms}
.lp-ord-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--la-accent);font:600 14px/1 var(--lab-font-inscription);color:var(--la-accent)}
.lp-ord-t{font-size:17px;line-height:1.4;color:var(--lab-ink)}
.lp-ord-t small{display:block;margin-top:3px;font:600 12px/1 var(--lab-font-inscription);letter-spacing:.1em;color:var(--lab-oro)}
.lp-ord-b{display:flex;gap:5px}
.lp-ord-b .ll-icon{width:44px;height:44px;font-size:18px}
.lp-ord-b .ll-icon:disabled{opacity:.3;cursor:default;transform:none}
.lp-ord-i.is-right{border-color:var(--lab-verde);background:color-mix(in srgb,var(--lab-verde) 10%,var(--lab-surface))}
.lp-ord-i.is-wrong{border-color:color-mix(in srgb,var(--lab-rosso) 70%,var(--lab-line))}

/* ---------- bivio ---------- */
.lp-fork{padding:34px;border-radius:21px;background:var(--lab-surface);border:1px solid var(--lab-line)}
.lp-fork-c{margin:8px 0 21px}
.lp-fork-p{margin:0 0 8px;font:600 clamp(21px,2.4vw,26px)/1.35 var(--lab-font-display);color:var(--lab-ink);text-wrap:pretty}
.lp-fork-s{display:grid;gap:8px}
.lp-fork-s .la-choice.is-pick{border-color:var(--la-accent);background:color-mix(in srgb,var(--la-accent) 14%,var(--lab-surface-2))}
.lp-fork-s .la-choice.is-seen{opacity:.7}
.lp-fork-e{margin-top:13px;padding:13px 21px;border-radius:13px;border-left:3px solid var(--lab-muted);background:var(--lab-surface-2);animation:llSlide 377ms var(--lab-ease-out) both}
.lp-fork-e small{display:block;margin-bottom:5px;font:600 12px/1 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-muted)}
.lp-tono-ok{border-left-color:var(--lab-verde)}.lp-tono-ko{border-left-color:var(--lab-rosso)}.lp-tono-neutro{border-left-color:var(--lab-oro)}

/* ---------- varianti ---------- */
.lp-var-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(233px,1fr));gap:13px}
.lp-var-c{display:grid;align-content:start;gap:8px;text-align:left;padding:21px;border-radius:21px;border:1.5px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:inherit;cursor:pointer;transition:border-color 233ms,transform 377ms var(--lab-ease-out),box-shadow 377ms}
.lp-var-c:hover{border-color:var(--lab-oro);transform:translateY(-5px);box-shadow:var(--lab-shadow-lg)}
.lp-var-c:active{transform:scale(.985)}
.lp-var-c:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.lp-var-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lp-var-h b{font:600 24px/1.15 var(--lab-font-display)}
.lp-var-o{font-size:16px;line-height:1.45;color:var(--lab-ink-soft)}
.lp-var-c small{font-size:14px;color:var(--lab-muted)}
.lp-var-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:13px;padding:13px 21px;margin-bottom:8px;border-radius:13px;background:var(--lab-surface-2);border:1px solid var(--lab-line)}
.lp-var-bar>span{display:flex;flex-wrap:wrap;align-items:center;gap:8px 13px}
.lp-var-bar small{flex-basis:100%}
.lp-var-bar b{font:600 22px/1.2 var(--lab-font-display);color:var(--lab-ink)}

/* ---------- consegna ---------- */
.lp-task{padding:34px;border-radius:21px;background:var(--lab-surface-2);border:1px dashed var(--lab-line)}
.lp-task-h{display:grid;grid-template-columns:minmax(0,1.618fr) auto;gap:21px;align-items:center}
.lp-task-h .ll-block-h{margin-bottom:8px}
.lp-clock{position:relative;width:144px;height:144px;display:grid;place-items:center}
.lp-clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lp-clock-bg{fill:none;stroke:var(--lab-line);stroke-width:5}
.lp-clock-fg{fill:none;stroke:var(--la-accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;transition:stroke-dashoffset 1000ms linear,stroke 377ms}
.lp-clock b{font:600 34px/1 var(--lab-font-inscription);color:var(--lab-ink)}
.lp-clock.is-late .lp-clock-fg{stroke:var(--lab-ambra)}
.lp-clock.is-over b{color:var(--lab-rosso);animation:laShake 377ms}
.lp-task-p{margin:13px 0;padding-left:21px;display:grid;gap:8px}
.lp-task-p li{font-size:17px;line-height:1.5;color:var(--lab-ink-soft);transition:color 377ms,opacity 377ms}
.lp-task-p li.is-now{color:var(--lab-ink);font-weight:700}

.lp-roles{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}

/* Lab IRC — Percezione nella lezione: Gestalt + neuropsicologia grafica. Solo token del design system; durate φ.
   Tre livelli, dal basso verso l'alto: SGUARDO (contrasto, un solo punto focale, movimento solo su ciò che cambia)
   → EMOZIONE (ricompensa entro 233 ms, chiusura, attesa) → RAGIONE (il «perché» subito dopo l'esito, testo leggibile). */
@property --lz-a{syntax:'<number>';inherits:false;initial-value:0}

/* ---------- 1. regia dello sguardo: l'ingresso segue la gerarchia (continuità + destino comune) ---------- */
.ll-scene.is-next,.ll-scene.is-prev{animation-duration:987ms}
.ll-scene .ll-moment,.ll-scene .ll-h,.ll-scene .ll-lead,.ll-scene>.ll-p,.ll-scene .ll-blocks>.ll-block{animation:lzRise 987ms var(--lab-ease-out) backwards}
.ll-scene .ll-h{animation-delay:89ms}
.ll-scene .ll-lead{animation-delay:178ms}
.ll-scene>.ll-p{animation-delay:267ms}
.ll-scene .ll-blocks>.ll-block:nth-child(1){animation-delay:356ms}
.ll-scene .ll-blocks>.ll-block:nth-child(2){animation-delay:445ms}
.ll-scene .ll-blocks>.ll-block:nth-child(3){animation-delay:534ms}
.ll-scene .ll-blocks>.ll-block:nth-child(n+4){animation-delay:623ms}
/* punto focale: la parola in colore riceve un filo d'oro che si traccia dopo il titolo */
.ll-h em{background:linear-gradient(var(--lab-oro),var(--lab-oro)) 0 94%/0 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:lzUnder 987ms var(--lab-ease-out) 610ms forwards}

/* ---------- 2. figura–sfondo: mentre si lavora su un riquadro, il resto arretra ---------- */
.ll-blocks>.ll-block{transition:opacity 377ms var(--lab-ease-out),filter 377ms var(--lab-ease-out)}
@media (hover:hover){
  .ll-blocks:has(>.ll-block:hover:not([data-tipo="testo"],[data-tipo="nota"],[data-tipo="aggancio"],[data-tipo="mascotte"],[data-tipo="immagine"],[data-tipo="citazione"]))>.ll-block:not(:hover){opacity:var(--lz-recede,.5);filter:saturate(.5);transition-duration:610ms;transition-delay:233ms}
}
.ll-blocks:has(>.ll-block :focus-visible)>.ll-block:not(:focus-within){opacity:var(--lz-recede,.5);filter:saturate(.5)}
/* regione comune: l'aggancio appartiene al blocco sopra e resta in primo piano con lui */
.ll-blocks>.ll-block:is(:hover,:focus-within)+.ll-block[data-tipo="aggancio"]{opacity:1!important;filter:none!important}
/* somiglianza: ogni riquadro interattivo risponde allo stesso modo (bordo che si tinge) */
.ll-block:is([data-tipo="catena"],[data-tipo="animazione"],[data-tipo="strati"],[data-tipo="bilancia"],[data-tipo="lente"],[data-tipo="leggi"],[data-tipo="ordina"],[data-tipo="tappe"],[data-tipo="rivela"],[data-tipo="domanda"]){transition:opacity 377ms var(--lab-ease-out),filter 377ms var(--lab-ease-out),border-color 233ms}
.ll-block:is([data-tipo="catena"],[data-tipo="animazione"],[data-tipo="strati"],[data-tipo="bilancia"],[data-tipo="lente"],[data-tipo="leggi"],[data-tipo="ordina"],[data-tipo="tappe"],[data-tipo="rivela"],[data-tipo="domanda"]):hover,.ll-check:hover,.lp-fork:hover,.lp-est:hover{border-color:color-mix(in srgb,var(--la-accent) 38%,var(--lab-line))}

/* ---------- 3. chiusura: un compito risolto si «chiude» con un anello d'oro ---------- */
.ll-blocks>.ll-block:has(.ll-why.is-ok)::before,.ll-blocks>.ll-block[data-tipo="smista"]:not(:has(.ll-bin))::before{content:"";position:absolute;z-index:3;top:-13px;right:21px;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--lab-oro) calc(var(--lz-a)*360deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:lzRing 987ms var(--lab-ease-out) forwards;pointer-events:none}
.ll-blocks>.ll-block:has(.ll-why.is-ok)::after,.ll-blocks>.ll-block[data-tipo="smista"]:not(:has(.ll-bin))::after{content:"✓";position:absolute;z-index:2;top:-13px;right:21px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lab-bg);color:var(--lab-oro);font:700 15px/1 var(--lab-font-body);animation:lzSeal 610ms var(--lab-ease-out) 610ms backwards;pointer-events:none}

/* ---------- 4. ricompensa: la risposta giusta si accende entro 233 ms, poi arriva il perché ---------- */
:is(.la-choice,.ll-bin,.lp-ord-i).is-right,.lp-pt.is-key{animation:lzReward 987ms var(--lab-ease-out)}
.ll-why{animation-duration:610ms}

/* ---------- 5. continuità e attesa: il filo della lezione (effetto Zeigarnik, picco–fine) ---------- */
body[data-modo="lezione"] .ll-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--lab-oro),var(--la-accent));transform-origin:0 50%;transform:scaleX(var(--lz-prog,0));transition:transform 987ms var(--lab-ease-out),box-shadow 987ms;pointer-events:none}
body[data-lz-ultima] .ll-top::after{background:var(--lab-oro);box-shadow:0 0 13px var(--lab-oro)}
.ll-dots{position:relative;align-items:center}
.ll-dots::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1.5px;margin-top:-.75px;background:linear-gradient(90deg,var(--la-accent) calc(var(--lz-rail,0)*100%),var(--lab-line) 0);pointer-events:none}
.ll-dot{position:relative;z-index:1;background:var(--lab-surface)}
.ll-dot.is-seen{background:color-mix(in srgb,var(--la-accent) 45%,var(--lab-surface))}
/* compito chiuso nella scena → «Avanti» invita, due volte e poi tace */
body:has(.ll-blocks>.ll-block .ll-why.is-ok) .ll-navbtn--go:not(:disabled){animation:lzCall 2618ms var(--lab-ease-out) 987ms 2}

/* ---------- 6. pausa gioco: figura calma, una sola azione piena (prima era un secondo punto focale caldo) ---------- */
.ll-play{position:relative;overflow:hidden;isolation:isolate;background:var(--lab-surface);color:var(--lab-ink);border:1px solid color-mix(in srgb,var(--lab-oro) 40%,var(--lab-line));transition:border-color 233ms,transform 610ms var(--lab-ease-out),box-shadow 610ms}
.ll-play::after{content:"";position:absolute;z-index:-1;right:-34px;top:-55px;width:144px;height:144px;border-radius:50%;background:var(--la-accent);opacity:.07;transition:opacity 610ms}
.ll-play:hover{border-color:var(--lab-oro);transform:translateY(-3px);box-shadow:var(--lab-shadow-lg);transition-duration:233ms}
.ll-play:hover::after{opacity:.13}
.ll-play b{color:var(--lab-ink)}
.ll-play p{color:var(--lab-ink-soft);opacity:1}
.ll-play .ll-btn{background:var(--la-accent);color:#14131F}
html[data-tema="chiaro"] .ll-play .ll-btn{color:#fff}

/* ---------- 7. lettura (neocorteccia): misura e respiro ---------- */
.ll-p,.ll-lead{hanging-punctuation:first}
.ll-p strong{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--la-accent) 16%,transparent) 0)}

@keyframes lzRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes lzUnder{to{background-size:100% 1.5px}}
@keyframes lzRing{to{--lz-a:1}}
@keyframes lzSeal{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes lzReward{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lab-verde) 55%,transparent)}61.8%,100%{box-shadow:0 0 0 13px transparent}}
@keyframes lzCall{0%,100%{box-shadow:var(--lab-btn-glow)}38.2%{box-shadow:0 0 0 8px color-mix(in srgb,var(--la-accent) 22%,transparent),var(--lab-btn-glow-hover)}}

@media (prefers-reduced-motion:reduce){
  .ll-scene .ll-moment,.ll-scene .ll-h,.ll-scene .ll-lead,.ll-scene>.ll-p,.ll-scene .ll-blocks>.ll-block,.ll-navbtn--go,:is(.la-choice,.ll-bin,.lp-ord-i).is-right,.lp-pt.is-key{animation:none!important}
  .ll-h em{animation:none;background-size:100% 1.5px}
  .ll-blocks>.ll-block::before,.ll-blocks>.ll-block::after{animation:none!important;--lz-a:1}
  body[data-modo="lezione"] .ll-top::after,.ll-play{transition:none}
}
@media print{body .ll-top::after,.ll-dots::before{display:none}.ll-blocks>.ll-block{opacity:1!important;filter:none!important}}

/* Lab IRC — Attività di classe + barra delle scene (cronometro, fasi) + glossario. Solo token del design system; spazi e durate φ.
   Dopo lab-lezione.css, lab-lezione-plus.css e lab-lezione-percezione.css. */

/* ---------- testata: pulsanti a pillola (Glossario, LIM) ---------- */
.ll-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:700 14px/1 var(--lab-font-body);letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:border-color 144ms,background 233ms,color 144ms,transform 144ms}

.ll-chip:hover{border-color:var(--lab-oro)}
.ll-chip:active{transform:scale(.95)}
.ll-chip[aria-pressed="true"]{background:var(--lab-ink);color:var(--lab-bg);border-color:transparent}
.ll-chip[aria-pressed="true"] b{background:color-mix(in srgb,var(--lab-bg) 22%,transparent);color:inherit}
.ll-chip:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}

/* ---------- barra delle scene: cronometro · fasi con i loro passi · mascotte ---------- */
.ll-clock{flex:0 1 auto;display:flex;align-items:center;gap:8px;min-width:0;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface);white-space:nowrap}
.ll-clock-b,.ll-clock-r{flex:none;display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:999px;border:0;background:var(--lab-surface-2);color:var(--lab-ink);font:700 12px/1 var(--lab-font-body);cursor:pointer;transition:background 233ms,transform 144ms,color 144ms}
.ll-clock-r{background:none;color:var(--lab-ink-soft);font-size:15px}
.ll-clock-b:hover,.ll-clock-r:hover{background:var(--lab-oro-soft);color:var(--lab-ink)}
.ll-clock-b:active,.ll-clock-r:active{transform:scale(.9)}
.ll-clock-b:focus-visible,.ll-clock-r:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-clock-t{font:600 17px/1 var(--lab-font-inscription);letter-spacing:.04em;color:var(--lab-ink);font-variant-numeric:tabular-nums}
.ll-clock-t small{font-size:12px;color:var(--lab-ink-soft)}
.ll-clock-st{min-width:0;overflow:hidden;text-overflow:ellipsis;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--lab-verde) 16%,transparent);color:var(--lab-ink);font:700 12.5px/1 var(--lab-font-body);transition:background 610ms}
.ll-clock.is-idle .ll-clock-st{background:var(--lab-surface-2);color:var(--lab-ink-soft)}

.ll-clock.is-late .ll-clock-st{background:color-mix(in srgb,var(--lab-ambra) 26%,transparent)}
.ll-clock.is-very-late .ll-clock-st{background:color-mix(in srgb,var(--lab-rosso) 20%,transparent);animation:lxLate 2618ms var(--lab-ease-out) 2}
.ll-plan{display:flex;align-items:flex-end;min-width:0;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.ll-plan::-webkit-scrollbar{display:none}
.ll-fase{display:grid;justify-items:center;gap:2px;flex:0 0 auto;min-width:0;padding:0 8px}
.ll-fase+.ll-fase{border-left:1px solid var(--lab-line)}
.ll-fase-n{font:600 10.5px/1.2 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-ink-soft);white-space:nowrap;transition:color 233ms}

.ll-fig-ph{display:grid;place-items:center;padding:21px;border-radius:21px;border:1px dashed var(--lab-line);background:repeating-linear-gradient(135deg,var(--lab-surface) 0 13px,var(--lab-surface-2) 13px 14px);color:var(--lab-ink-soft);font:600 13px/1.4 var(--lab-font-inscription);letter-spacing:.1em;text-transform:uppercase;text-align:center}

.ll-pop{position:fixed;z-index:70;left:13px;top:13px;width:min(360px,calc(100vw - 26px));padding:21px 21px 13px;border-radius:21px;border:1px solid color-mix(in srgb,var(--lab-oro) 45%,var(--lab-line));background:var(--lab-surface);box-shadow:var(--lab-shadow-lg);animation:lxPop 233ms var(--lab-ease-out) both}

.ll-block:is([data-tipo="sondaggio"],[data-tipo="nuvola"],[data-tipo="spettro"],[data-tipo="chi"],[data-tipo="quiz"],[data-tipo="idee"]):hover{border-color:color-mix(in srgb,var(--la-accent) 38%,var(--lab-line))}
