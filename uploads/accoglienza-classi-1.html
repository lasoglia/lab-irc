/* Lab IRC — Percezione nella lezione: Gestalt + neuropsicologia grafica. Solo token del design system; durate φ.
   Tre livelli, dal basso verso l'alto: SGUARDO (contrasto, un solo punto focale, movimento solo su ciò che cambia)
   → EMOZIONE (ricompensa entro 233 ms, chiusura, attesa) → RAGIONE (il «perché» subito dopo l'esito, testo leggibile). */
@property --lz-a{syntax:'<number>';inherits:false;initial-value:0}

/* ---------- 1. regia dello sguardo: l'ingresso segue la gerarchia (continuità + destino comune) ---------- */
.ll-scene.is-next,.ll-scene.is-prev{animation-duration:987ms}
.ll-scene .ll-moment,.ll-scene .ll-h,.ll-scene .ll-lead,.ll-scene>.ll-p,.ll-scene .ll-blocks>.ll-block{animation:lzRise 987ms var(--lab-ease-out) backwards}
.ll-scene .ll-h{animation-delay:89ms}
.ll-scene .ll-lead{animation-delay:178ms}
.ll-scene>.ll-p{animation-delay:267ms}
.ll-scene .ll-blocks>.ll-block:nth-child(1){animation-delay:356ms}
.ll-scene .ll-blocks>.ll-block:nth-child(2){animation-delay:445ms}
.ll-scene .ll-blocks>.ll-block:nth-child(3){animation-delay:534ms}
.ll-scene .ll-blocks>.ll-block:nth-child(n+4){animation-delay:623ms}
/* punto focale: la parola in colore riceve un filo d'oro che si traccia dopo il titolo */
.ll-h em{background:linear-gradient(var(--lab-oro),var(--lab-oro)) 0 94%/0 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:lzUnder 987ms var(--lab-ease-out) 610ms forwards}

/* ---------- 2. figura–sfondo: mentre si lavora su un riquadro, il resto arretra ---------- */
.ll-blocks>.ll-block{transition:opacity 377ms var(--lab-ease-out),filter 377ms var(--lab-ease-out)}
@media (hover:hover){
  .ll-blocks:has(>.ll-block:hover:not([data-tipo="testo"],[data-tipo="nota"],[data-tipo="aggancio"],[data-tipo="mascotte"],[data-tipo="immagine"],[data-tipo="citazione"]))>.ll-block:not(:hover){opacity:var(--lz-recede,.5);filter:saturate(.5);transition-duration:610ms;transition-delay:233ms}
}
.ll-blocks:has(>.ll-block :focus-visible)>.ll-block:not(:focus-within){opacity:var(--lz-recede,.5);filter:saturate(.5)}
/* regione comune: l'aggancio appartiene al blocco sopra e resta in primo piano con lui */
.ll-blocks>.ll-block:is(:hover,:focus-within)+.ll-block[data-tipo="aggancio"]{opacity:1!important;filter:none!important}
/* somiglianza: ogni riquadro interattivo risponde allo stesso modo (bordo che si tinge) */
.ll-block:is([data-tipo="catena"],[data-tipo="animazione"],[data-tipo="strati"],[data-tipo="bilancia"],[data-tipo="lente"],[data-tipo="leggi"],[data-tipo="ordina"],[data-tipo="tappe"],[data-tipo="rivela"],[data-tipo="domanda"]){transition:opacity 377ms var(--lab-ease-out),filter 377ms var(--lab-ease-out),border-color 233ms}
.ll-block:is([data-tipo="catena"],[data-tipo="animazione"],[data-tipo="strati"],[data-tipo="bilancia"],[data-tipo="lente"],[data-tipo="leggi"],[data-tipo="ordina"],[data-tipo="tappe"],[data-tipo="rivela"],[data-tipo="domanda"]):hover,.ll-check:hover,.lp-fork:hover,.lp-est:hover{border-color:color-mix(in srgb,var(--la-accent) 38%,var(--lab-line))}

/* ---------- 3. chiusura: un compito risolto si «chiude» con un anello d'oro ---------- */
.ll-blocks>.ll-block:has(.ll-why.is-ok)::before,.ll-blocks>.ll-block[data-tipo="smista"]:not(:has(.ll-bin))::before{content:"";position:absolute;z-index:3;top:-13px;right:21px;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--lab-oro) calc(var(--lz-a)*360deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:lzRing 987ms var(--lab-ease-out) forwards;pointer-events:none}
.ll-blocks>.ll-block:has(.ll-why.is-ok)::after,.ll-blocks>.ll-block[data-tipo="smista"]:not(:has(.ll-bin))::after{content:"✓";position:absolute;z-index:2;top:-13px;right:21px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lab-bg);color:var(--lab-oro);font:700 15px/1 var(--lab-font-body);animation:lzSeal 610ms var(--lab-ease-out) 610ms backwards;pointer-events:none}

/* ---------- 4. ricompensa: la risposta giusta si accende entro 233 ms, poi arriva il perché ---------- */
:is(.la-choice,.ll-bin,.lp-ord-i).is-right,.lp-pt.is-key{animation:lzReward 987ms var(--lab-ease-out)}
.ll-why{animation-duration:610ms}

/* ---------- 5. continuità e attesa: il filo della lezione (effetto Zeigarnik, picco–fine) ---------- */
body[data-modo="lezione"] .ll-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--lab-oro),var(--la-accent));transform-origin:0 50%;transform:scaleX(var(--lz-prog,0));transition:transform 987ms var(--lab-ease-out),box-shadow 987ms;pointer-events:none}
body[data-lz-ultima] .ll-top::after{background:var(--lab-oro);box-shadow:0 0 13px var(--lab-oro)}
.ll-dots{position:relative;align-items:center}
.ll-dots::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1.5px;margin-top:-.75px;background:linear-gradient(90deg,var(--la-accent) calc(var(--lz-rail,0)*100%),var(--lab-line) 0);pointer-events:none}
.ll-dot{position:relative;z-index:1;background:var(--lab-surface)}
.ll-dot.is-seen{background:color-mix(in srgb,var(--la-accent) 45%,var(--lab-surface))}
/* compito chiuso nella scena → «Avanti» invita, due volte e poi tace */
body:has(.ll-blocks>.ll-block .ll-why.is-ok) .ll-navbtn--go:not(:disabled){animation:lzCall 2618ms var(--lab-ease-out) 987ms 2}

/* ---------- 6. pausa gioco: figura calma, una sola azione piena (prima era un secondo punto focale caldo) ---------- */
.ll-play{position:relative;overflow:hidden;isolation:isolate;background:var(--lab-surface);color:var(--lab-ink);border:1px solid color-mix(in srgb,var(--lab-oro) 40%,var(--lab-line));transition:border-color 233ms,transform 610ms var(--lab-ease-out),box-shadow 610ms}
.ll-play::after{content:"";position:absolute;z-index:-1;right:-34px;top:-55px;width:144px;height:144px;border-radius:50%;background:var(--la-accent);opacity:.07;transition:opacity 610ms}
.ll-play:hover{border-color:var(--lab-oro);transform:translateY(-3px);box-shadow:var(--lab-shadow-lg);transition-duration:233ms}
.ll-play:hover::after{opacity:.13}
.ll-play b{color:var(--lab-ink)}
.ll-play p{color:var(--lab-ink-soft);opacity:1}
.ll-play .ll-btn{background:var(--la-accent);color:#14131F}
html[data-tema="chiaro"] .ll-play .ll-btn{color:#fff}

/* ---------- 7. lettura (neocorteccia): misura e respiro ---------- */
.ll-p,.ll-lead{hanging-punctuation:first}
.ll-p strong{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--la-accent) 16%,transparent) 0)}

@keyframes lzRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes lzUnder{to{background-size:100% 1.5px}}
@keyframes lzRing{to{--lz-a:1}}
@keyframes lzSeal{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes lzReward{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lab-verde) 55%,transparent)}61.8%,100%{box-shadow:0 0 0 13px transparent}}
@keyframes lzCall{0%,100%{box-shadow:var(--lab-btn-glow)}38.2%{box-shadow:0 0 0 8px color-mix(in srgb,var(--la-accent) 22%,transparent),var(--lab-btn-glow-hover)}}

@media (prefers-reduced-motion:reduce){
  .ll-scene .ll-moment,.ll-scene .ll-h,.ll-scene .ll-lead,.ll-scene>.ll-p,.ll-scene .ll-blocks>.ll-block,.ll-navbtn--go,:is(.la-choice,.ll-bin,.lp-ord-i).is-right,.lp-pt.is-key{animation:none!important}
  .ll-h em{animation:none;background-size:100% 1.5px}
  .ll-blocks>.ll-block::before,.ll-blocks>.ll-block::after{animation:none!important;--lz-a:1}
  body[data-modo="lezione"] .ll-top::after,.ll-play{transition:none}
}
@media print{body .ll-top::after,.ll-dots::before{display:none}.ll-blocks>.ll-block{opacity:1!important;filter:none!important}}

/* Lab IRC — Attività di classe + barra delle scene (cronometro, fasi) + glossario. Solo token del design system; spazi e durate φ.
   Dopo lab-lezione.css, lab-lezione-plus.css e lab-lezione-percezione.css. */

/* ---------- testata: pulsanti a pillola (Glossario, LIM) ---------- */
.ll-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:700 14px/1 var(--lab-font-body);letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:border-color 144ms,background 233ms,color 144ms,transform 144ms}
.ll-chip b{display:grid;place-items:center;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--lab-oro-soft);color:var(--lab-ink);font:600 11px/1 var(--lab-font-inscription)}
.ll-chip:hover{border-color:var(--lab-oro)}
.ll-chip:active{transform:scale(.95)}
.ll-chip[aria-pressed="true"]{background:var(--lab-ink);color:var(--lab-bg);border-color:transparent}
.ll-chip[aria-pressed="true"] b{background:color-mix(in srgb,var(--lab-bg) 22%,transparent);color:inherit}
.ll-chip:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}

/* ---------- barra delle scene: cronometro · fasi con i loro passi · mascotte ---------- */
.ll-clock{flex:0 1 auto;display:flex;align-items:center;gap:8px;min-width:0;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-surface);white-space:nowrap}
.ll-clock-b,.ll-clock-r{flex:none;display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:999px;border:0;background:var(--lab-surface-2);color:var(--lab-ink);font:700 12px/1 var(--lab-font-body);cursor:pointer;transition:background 233ms,transform 144ms,color 144ms}
.ll-clock-r{background:none;color:var(--lab-ink-soft);font-size:15px}
.ll-clock-b:hover,.ll-clock-r:hover{background:var(--lab-oro-soft);color:var(--lab-ink)}
.ll-clock-b:active,.ll-clock-r:active{transform:scale(.9)}
.ll-clock-b:focus-visible,.ll-clock-r:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-clock-t{font:600 17px/1 var(--lab-font-inscription);letter-spacing:.04em;color:var(--lab-ink);font-variant-numeric:tabular-nums}
.ll-clock-t small{font-size:12px;color:var(--lab-ink-soft)}
.ll-clock-st{min-width:0;overflow:hidden;text-overflow:ellipsis;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--lab-verde) 16%,transparent);color:var(--lab-ink);font:700 12.5px/1 var(--lab-font-body);transition:background 610ms}
.ll-clock.is-idle .ll-clock-st{background:var(--lab-surface-2);color:var(--lab-ink-soft)}
.ll-clock.is-early .ll-clock-st{background:color-mix(in srgb,var(--lab-ciano) 18%,transparent)}
.ll-clock.is-late .ll-clock-st{background:color-mix(in srgb,var(--lab-ambra) 26%,transparent)}
.ll-clock.is-very-late .ll-clock-st{background:color-mix(in srgb,var(--lab-rosso) 20%,transparent);animation:lxLate 2618ms var(--lab-ease-out) 2}
.ll-plan{display:flex;align-items:flex-end;min-width:0;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.ll-plan::-webkit-scrollbar{display:none}
.ll-fase{display:grid;justify-items:center;gap:2px;flex:0 0 auto;min-width:0;padding:0 8px}
.ll-fase+.ll-fase{border-left:1px solid var(--lab-line)}
.ll-fase-n{font:600 10.5px/1.2 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-ink-soft);white-space:nowrap;transition:color 233ms}
.ll-fase-n small{font-size:inherit;letter-spacing:.04em}
.ll-fase.is-on .ll-fase-n{color:var(--lab-ink)}
.ll-fase.is-on .ll-fase-n::before{content:"";display:inline-block;width:5px;height:5px;margin:0 5px 2px 0;border-radius:50%;background:var(--lab-oro);vertical-align:middle}
.ll-plan .ll-dots{padding:3px 2px}
.ll-plan .ll-dots::before{display:none}
.ll-nav .ll-count{display:grid;justify-items:center;gap:3px}
.ll-count-f{display:none;font:600 10.5px/1.2 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-ink)}

/* ---------- immagine da inserire ---------- */
.ll-fig-ph{display:grid;place-items:center;padding:21px;border-radius:21px;border:1px dashed var(--lab-line);background:repeating-linear-gradient(135deg,var(--lab-surface) 0 13px,var(--lab-surface-2) 13px 14px);color:var(--lab-ink-soft);font:600 13px/1.4 var(--lab-font-inscription);letter-spacing:.1em;text-transform:uppercase;text-align:center}

/* ---------- parole nuove: sottolineatura d'oro puntinata → fumetto con etimologia ---------- */
.ll-dfn{display:inline;padding:0 1px;margin:0;border:0;border-radius:3px;background:none;color:inherit;font:inherit;letter-spacing:inherit;cursor:help;text-decoration:underline dotted var(--lab-oro);text-decoration-thickness:2px;text-underline-offset:.22em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background 233ms}
.ll-dfn:hover{background:var(--lab-oro-soft);text-decoration-style:solid}
.ll-dfn:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-dfn.is-orfana{text-decoration-color:var(--lab-muted)}
.ll-pop{position:fixed;z-index:70;left:13px;top:13px;width:min(360px,calc(100vw - 26px));padding:21px 21px 13px;border-radius:21px;border:1px solid color-mix(in srgb,var(--lab-oro) 45%,var(--lab-line));background:var(--lab-surface);box-shadow:var(--lab-shadow-lg);animation:lxPop 233ms var(--lab-ease-out) both}
.ll-pop-x{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--lab-ink-soft);font:400 24px/1 var(--lab-font-body);cursor:pointer;transition:background 233ms,color 144ms}
.ll-pop-x:hover{background:var(--lab-surface-2);color:var(--lab-ink)}
.ll-pop-x:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.ll-pop-k{margin:0;font:600 11px/1.3 var(--lab-font-inscription);letter-spacing:.16em;text-transform:uppercase;color:var(--lab-oro)}
.ll-pop-w{margin:5px 40px 8px 0;font:600 34px/1.05 var(--lab-font-display);color:var(--lab-ink)}
.ll-pop-e{margin:0 0 8px;font:italic 500 18px/1.35 var(--lab-font-display);color:var(--lab-ink-soft)}
.ll-pop-d{margin:0 0 5px;font-size:16px;line-height:1.5;color:var(--lab-ink)}
.ll-glos{position:fixed;z-index:65;top:0;right:0;bottom:0;width:min(420px,100vw);overflow-y:auto;padding:34px 34px 55px;background:var(--lab-surface);border-left:1px solid var(--lab-line);box-shadow:var(--lab-shadow-lg);animation:lxGlos 377ms var(--lab-ease-out) both}
.ll-glos .ll-pop-x{top:21px;right:21px}
.ll-glos h2{margin:0 0 21px;font:600 40px/1.05 var(--lab-font-display);color:var(--lab-ink)}
.ll-glos ol{list-style:none;margin:0;padding:0}
.ll-glos li{padding:13px 0;border-top:1px solid var(--lab-line-soft)}
.ll-glos li b{display:block;font:600 24px/1.2 var(--lab-font-display);color:var(--lab-ink)}
.ll-glos li small{display:block;margin:3px 0 5px;font:italic 500 17px/1.35 var(--lab-font-display);color:var(--lab-ink-soft)}
.ll-glos li p{margin:0;font-size:15.5px;line-height:1.5;color:var(--lab-ink-soft)}

/* ---------- riquadri delle attività (regione comune, come gli strumenti) ---------- */
.ll-block:is([data-tipo="sondaggio"],[data-tipo="nuvola"],[data-tipo="spettro"],[data-tipo="chi"],[data-tipo="quiz"],[data-tipo="idee"]){padding:34px;border-radius:21px;background:var(--lab-surface);border:1px solid var(--lab-line);transition:opacity 377ms var(--lab-ease-out),filter 377ms var(--lab-ease-out),border-color 233ms}
.ll-block:is([data-tipo="sondaggio"],[data-tipo="nuvola"],[data-tipo="spettro"],[data-tipo="chi"],[data-tipo="quiz"],[data-tipo="idee"]):hover{border-color:color-mix(in srgb,var(--la-accent) 38%,var(--lab-line))}
.lx-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 13px;margin-bottom:13px}
/* la barra non copre più nulla: la mascotte resta nella sua corsia anche con consegna e pausa gioco */
@media (min-width:641px){.ll-play,.lp-task-h{padding-right:21px}.lp-task-h{padding-right:0}}
body.ll:not(:has(.ll-masc)):is(:has(.lp-task),:has(.ll-play)) .la-mascot{opacity:1;visibility:visible;pointer-events:auto}

/* sondaggio */
.lx-opts{display:grid;gap:8px}
.lx-opt{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:13px;min-height:55px;padding:8px 21px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface-2);color:var(--lab-ink);font:600 17px/1.3 var(--lab-font-body);text-align:left;cursor:pointer;transition:border-color 144ms,transform 233ms var(--lab-ease-out)}
.lx-opt:hover{border-color:var(--la-accent);transform:translateX(3px)}
.lx-opt:active{transform:scale(.985)}
.lx-opt:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lx-bar{position:absolute;z-index:-1;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--la-accent) 20%,transparent);transition:width 987ms var(--lab-ease-out)}
.lx-opt.is-top .lx-bar{background:color-mix(in srgb,var(--la-accent) 32%,transparent)}
.lx-ref{position:absolute;z-index:-1;left:0;top:5px;bottom:5px;border-right:2px dashed var(--lab-oro);pointer-events:none;animation:llFade 610ms var(--lab-ease-out) 610ms both}
.lx-opt-t{min-width:0}
.lx-opt-r{flex:none;display:grid;justify-items:end;gap:3px;text-align:right}
.lx-opt-r b{font:600 21px/1 var(--lab-font-inscription);color:var(--lab-ink)}
.lx-opt-r small{font-size:12.5px;line-height:1.2;color:var(--lab-ink-soft);white-space:nowrap}
.lx-ok{position:absolute;right:13px;top:50%;padding:6px 12px;border-radius:999px;background:var(--lab-verde);color:#06281d;font:700 13px/1 var(--lab-font-body);opacity:0;transform:translateY(-50%) scale(.8);pointer-events:none}
.lx-opt.is-voted{border-color:var(--lab-verde);animation:lxVote 610ms var(--lab-ease-out)}
.lx-opt.is-voted .lx-ok{animation:lxOk 1618ms var(--lab-ease-out) both}
.lx-ref-k{display:flex;align-items:center;gap:8px;margin:13px 0 0}
.lx-ref-k i{width:21px;border-top:2px dashed var(--lab-oro)}

/* nuvola di parole */
.lx-cloud-in{display:flex;gap:8px;margin-bottom:13px}
.lx-cloud-in input{flex:1;min-width:0;min-height:48px;padding:0 21px;border-radius:999px;border:1.5px solid var(--lab-line);background:var(--lab-surface-2);color:var(--lab-ink);font:500 17px/1 var(--lab-font-body);transition:border-color 144ms}
.lx-cloud-in input::placeholder{color:var(--lab-ink-soft)}
.lx-cloud-in input:focus{outline:none;border-color:var(--la-accent)}
.lx-words{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 21px;min-height:178px;padding:21px;border-radius:13px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--la-accent) 8%,transparent),transparent 61.8%),var(--lab-bg-2)}
.lx-word{padding:3px 5px;border:0;border-radius:8px;background:none;color:var(--c);font:600 calc(17px * var(--s))/1.05 var(--lab-font-display);transform:rotate(var(--r));cursor:pointer;transition:transform 377ms var(--lab-ease-out),font-size 610ms var(--lab-ease-out),background 233ms}
.lx-word sup{margin-left:2px;font:700 11px/1 var(--lab-font-body);color:var(--lab-ink-soft)}
.lx-word:hover{transform:rotate(0) scale(1.08);background:var(--lab-oro-soft)}
.lx-word:active{transform:scale(.94)}
.lx-word:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lx-word.is-new{animation:lxIn 610ms var(--lab-ease-out)}
.lx-empty{color:var(--lab-ink-soft);font-style:italic}

/* spettro delle posizioni */
.lx-axis{position:relative;height:178px;margin:13px 34px 0}
.lx-axis::before{content:"";position:absolute;left:-13px;right:-13px;top:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--la-accent),var(--lab-oro) 50%,var(--lab-muted))}
.lx-pt{position:absolute;left:calc(var(--x) * 1%);top:21px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:55px;padding:0;border:0;background:none;color:var(--lab-ink);font:700 16px/1.2 var(--lab-font-body);white-space:nowrap;cursor:pointer}
.lx-pt i{width:27px;height:27px;border-radius:50%;border:3px solid var(--lab-surface);background:var(--lab-line);box-shadow:0 0 0 1.5px var(--lab-line);transition:transform 377ms var(--lab-ease-out),background 233ms,box-shadow 377ms}
.lx-pt:hover i{transform:scale(1.25);box-shadow:0 0 0 1.5px var(--lab-oro)}
.lx-pt:active i{transform:scale(.9)}
.lx-pt.is-seen i{background:color-mix(in srgb,var(--la-accent) 45%,var(--lab-surface))}
.lx-pt.is-on i{background:var(--la-accent);box-shadow:0 0 0 7px color-mix(in srgb,var(--la-accent) 24%,transparent);transform:scale(1.2)}
.lx-pt.is-off{top:89px}
.lx-pt.is-off i{border:2px dashed var(--lab-muted);background:var(--lab-surface)}
.lx-pt.is-off.is-on i{background:var(--la-accent);border-style:solid}
.lx-pt small{font:600 10.5px/1 var(--lab-font-inscription);letter-spacing:.1em;text-transform:uppercase;color:var(--lab-ink-soft)}
.lx-pt:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:4px;border-radius:8px}
.lx-ends{display:flex;gap:13px;margin:0;font:600 11.5px/1.3 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-ink-soft)}
.lx-ends span{flex:1 1 0}.lx-ends span:nth-child(2){text-align:center}.lx-ends span:last-child{text-align:right}
.lx-spec-c{margin-top:13px;padding:21px;border-radius:13px;background:var(--lab-surface-2);border-left:3px solid var(--la-accent);animation:llSlide 377ms var(--lab-ease-out) both}
.lx-spec-c small{display:block;font:italic 500 17px/1.35 var(--lab-font-display);color:var(--lab-ink-soft)}
.lx-spec-c b{display:block;margin:5px 0 8px;font:600 28px/1.15 var(--lab-font-display);color:var(--lab-ink)}
.lx-ex{margin:8px 0 0;font:italic 500 19px/1.4 var(--lab-font-display);color:var(--lab-ink)}

/* chi lo dice? */
.lx-qms{display:grid;gap:13px}
.lx-qm{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);gap:13px 21px;align-items:center;padding:21px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface-2);transition:border-color 377ms,background 377ms}
.lx-qm.is-ok{border-color:var(--lab-verde)}
.lx-qm.is-ko{border-color:color-mix(in srgb,var(--lab-rosso) 60%,var(--lab-line))}
.lx-qm blockquote{margin:0;font:italic 500 clamp(19px,2.2vw,24px)/1.35 var(--lab-font-display);color:var(--lab-ink);text-wrap:pretty}
.lx-who{display:block;margin-top:8px;font:600 11.5px/1.3 var(--lab-font-inscription);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-ink-soft)}
.lx-qm-b{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.lx-qm-b button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:700 15px/1 var(--lab-font-body);cursor:pointer;transition:border-color 144ms,background 233ms,transform 233ms var(--lab-ease-out),opacity 377ms}
.lx-qm-b button:hover:not(:disabled){border-color:var(--la-accent);transform:translateY(-2px)}
.lx-qm-b button:active:not(:disabled){transform:scale(.95)}
.lx-qm-b button:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lx-qm-b button:disabled{cursor:default}
.lx-qm-b .is-right{border-color:var(--lab-verde);background:color-mix(in srgb,var(--lab-verde) 18%,var(--lab-surface));animation:lzReward 987ms var(--lab-ease-out)}
.lx-qm-b .is-wrong{border-color:var(--lab-rosso);background:color-mix(in srgb,var(--lab-rosso) 12%,var(--lab-surface));animation:laShake 377ms}
.lx-qm-b .is-dim{opacity:.4}
.lx-qm-why{grid-column:1/-1;margin:0;font-size:15.5px;line-height:1.5;color:var(--lab-ink-soft);animation:llSlide 377ms var(--lab-ease-out) both}

/* quiz a più domande */
.lx-pips{display:flex;gap:5px}
.lx-pips i{width:34px;height:6px;border-radius:6px;background:var(--lab-line);transition:background 377ms,width 377ms var(--lab-ease-out)}
.lx-pips i.is-on{width:55px;background:var(--la-accent)}
.lx-pips i.is-ok{background:var(--lab-verde)}
.lx-pips i.is-ko{background:var(--lab-rosso)}
.lx-quiz-q{animation:llInNext 610ms var(--lab-ease-out) both}
.lx-quiz .la-q{margin:8px 0 21px}
.ll-why.lx-yes{background:color-mix(in srgb,var(--lab-verde) 14%,transparent);color:var(--lab-ink)}
.lx-quiz-end{display:grid;justify-items:center;gap:8px;padding:13px 0 0;text-align:center}
.lx-stars{display:flex;gap:13px}
.lx-stars i{width:55px;height:55px;background:var(--lab-line);clip-path:polygon(50% 0,61.8% 38.2%,100% 38.2%,69% 61.8%,80.9% 100%,50% 76.4%,19.1% 100%,31% 61.8%,0 38.2%,38.2% 38.2%);animation:lxStar 610ms var(--lab-ease-out) calc(var(--i) * 233ms + 233ms) both}
.lx-stars i.is-on{background:var(--lab-ambra)}
.lx-score{font:600 55px/1 var(--lab-font-inscription);color:var(--lab-ink)}
.lx-quiz-msg{margin:0;font-size:18px;color:var(--lab-ink-soft)}
.lx-quiz-end .ll-why{margin:0}
.lx-quiz-end .ll-row{justify-content:center;margin-top:8px}

/* idee da portare a casa */
.lx-take-l{list-style:none;margin:0;padding:0;display:grid;gap:13px}
.lx-take-l li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:13px;align-items:center;min-height:70px;padding:13px 21px 13px 13px;border-radius:13px;border:1.5px dashed var(--lab-line);transition:border-color 377ms,background 377ms}
.lx-take-l li span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--lab-line);font:600 17px/1 var(--lab-font-inscription);color:var(--lab-ink-soft);transition:background 377ms,color 377ms,border-color 377ms}
.lx-take-l li p{margin:0;font:600 clamp(20px,2.2vw,25px)/1.35 var(--lab-font-display);color:var(--lab-ink);text-wrap:pretty}
.lx-take-l li.is-on{border-style:solid;border-color:color-mix(in srgb,var(--la-accent) 40%,var(--lab-line));background:var(--lab-surface-2);animation:llStep 610ms var(--lab-ease-out) both}
.lx-take-l li.is-on span{background:var(--la-accent);border-color:transparent;color:#14131F}

/* per continuare */
.lx-next{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr) minmax(0,1fr);gap:13px}
.lx-box{position:relative;display:grid;align-content:start;gap:8px;min-height:144px;padding:21px 21px 55px;border-radius:21px;border:1.5px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:inherit;text-align:left}
button.lx-box{cursor:pointer;transition:border-color 233ms,transform 377ms var(--lab-ease-out),box-shadow 377ms}
button.lx-box:hover{border-color:var(--lab-oro);transform:translateY(-5px);box-shadow:var(--lab-shadow-lg)}
button.lx-box:active{transform:scale(.985)}
button.lx-box:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.lx-box b{font:600 26px/1.15 var(--lab-font-display)}
.lx-box span{font-size:16px;line-height:1.5;color:var(--lab-ink-soft)}
.lx-box i{position:absolute;right:21px;bottom:13px;font:400 28px/1 var(--lab-font-body);font-style:normal;color:var(--lab-oro);transition:transform 377ms var(--lab-ease-out)}
button.lx-box:hover i{transform:translateX(5px)}
.lx-box--main{background:linear-gradient(160deg,color-mix(in srgb,var(--la-accent) 16%,var(--lab-surface)),var(--lab-surface));border-color:color-mix(in srgb,var(--la-accent) 45%,var(--lab-line))}

/* etimologia della parola chiave */
.lx-etym{padding:34px;border-radius:34px;background:linear-gradient(160deg,color-mix(in srgb,var(--la-accent) 12%,var(--lab-surface)),var(--lab-surface));border:1px solid var(--lab-line)}
.lx-etym-w{margin:8px 0 21px;font:600 clamp(40px,6.5vw,72px)/1 var(--lab-font-inscription);letter-spacing:.06em;color:var(--lab-ink)}
.lx-etym-parts{display:flex;flex-wrap:wrap;align-items:center;gap:13px}
.lx-etym-plus{font:italic 500 24px/1 var(--lab-font-display);color:var(--lab-oro)}
.lx-etym-p{display:grid;gap:5px;min-height:55px;padding:13px 21px;border-radius:13px;border:1.5px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-ink);font:inherit;text-align:left;cursor:pointer;transition:border-color 233ms,background 233ms,transform 233ms var(--lab-ease-out)}
.lx-etym-p b{font:italic 600 24px/1.1 var(--lab-font-display)}
.lx-etym-p small{display:none;max-width:24ch;font-size:14.5px;line-height:1.4;color:var(--lab-ink-soft)}
.lx-etym-p:hover{border-color:var(--lab-oro);transform:translateY(-2px)}
.lx-etym-p:active{transform:scale(.97)}
.lx-etym-p:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:3px}
.lx-etym-p[aria-expanded="true"]{border-color:var(--la-accent);background:color-mix(in srgb,var(--la-accent) 10%,var(--lab-surface))}
.lx-etym-p[aria-expanded="true"] small{display:block;animation:llFade 610ms var(--lab-ease-out) both}

/* agenda della lezione */
.lx-agenda{padding:21px;border-radius:21px;border:1px solid var(--lab-line);background:var(--lab-surface)}
.lx-agenda-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;padding:0 8px}
.lx-agenda-h b{font:600 22px/1.2 var(--lab-font-display);color:var(--lab-ink)}
.lx-agenda-h span{font:600 15px/1 var(--lab-font-inscription);color:var(--lab-ink-soft)}
.lx-ag{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:13px;align-items:center;width:100%;padding:13px 8px;border:0;border-top:1px solid var(--lab-line-soft);border-radius:8px;background:none;color:var(--lab-ink);font:inherit;text-align:left;cursor:pointer;transition:background 233ms}
.lx-ag:hover{background:var(--lab-surface-2)}
.lx-ag:active{background:var(--lab-oro-soft)}
.lx-ag:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:2px}
.lx-ag i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--la-accent);font:600 14px/1 var(--lab-font-inscription);font-style:normal;color:var(--la-accent)}
.lx-ag b{display:block;font:700 16px/1.3 var(--lab-font-body)}
.lx-ag small{display:block;font-size:13.5px;line-height:1.4;color:var(--lab-ink-soft)}
.lx-ag em{font:600 14px/1 var(--lab-font-inscription);font-style:normal;color:var(--lab-ink-soft)}

@keyframes lxPop{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lxGlos{from{transform:translateX(100%)}to{transform:none}}
@keyframes lxVote{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lab-verde) 50%,transparent)}61.8%,100%{box-shadow:0 0 0 13px transparent}}
@keyframes lxOk{0%{opacity:0;transform:translateY(-50%) scale(.8)}14.6%,76.4%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(1)}}
@keyframes lxIn{from{opacity:0;transform:scale(.4) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes lxStar{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes lxLate{0%,100%{box-shadow:none}38.2%{box-shadow:0 0 0 5px color-mix(in srgb,var(--lab-rosso) 22%,transparent)}}

@media (max-width:1060px){.ll-clock-st{display:none}.ll-fase-n small{display:none}.ll-fase-n{font-size:9.5px;letter-spacing:.06em}.ll-fase{padding:0 5px}}
@media (max-width:860px){.ll-fase-n{display:none}.ll-count-f{display:block}}
@media (max-width:1400px){:root[data-lim] body.ll .ll-fase-n{display:none}:root[data-lim] body.ll .ll-count-f{display:block}}
@media (max-width:720px){
  .ll-nav{gap:8px;padding:8px}
  .ll-clock-t small,.ll-clock-r,.ll-fase-n{display:none}
  .ll-navc{gap:8px}.ll-navbtn{padding:0 13px}
  .ll-nav-m{width:44px}
  .ll-block:is([data-tipo="sondaggio"],[data-tipo="nuvola"],[data-tipo="spettro"],[data-tipo="chi"],[data-tipo="quiz"],[data-tipo="idee"]){padding:21px 16px}
  .lx-qm{grid-template-columns:1fr}.lx-qm-b{justify-content:flex-start}
  .lx-next{grid-template-columns:1fr}
  .lx-cloud-in{flex-direction:column}
  .lx-axis{margin:13px 21px 0}.lx-pt{font-size:14px;min-width:44px}
  .lx-etym{padding:21px}
  .ll-chip{padding:0 12px}
}
/* telefono: il cronometro si riduce al solo pulsante ▶ da 44 px (il «0:00» a larghezza fissa finiva sopra «Indietro») */
@media (max-width:480px){
  .ll-clock{flex:none;width:44px;padding:4px;box-sizing:border-box;justify-content:center}
  .ll-clock-t{display:none}
  .ll-nav{gap:8px;padding:8px}
  .ll-navc{gap:8px}
}
@media (prefers-reduced-motion:reduce){.ll-pop,.ll-glos,.lx-opt,.lx-ok,.lx-word,.lx-stars i,.lx-take-l li,.lx-quiz-q,.lx-ref{animation:none!important}.lx-opt.is-voted .lx-ok{opacity:1;transform:translateY(-50%)}.lx-bar{transition:none}}
@media print{.ll-pop,.ll-glos{display:none!important}.ll-dfn{text-decoration:none}}

/* Lab IRC — Lezione in modalità LIM (<html data-lim>: pulsante «LIM» in testata, tasto L, ?lim=1).
   Un solo principio: tutto cresce in proporzione aurea, non regola per regola.
   Oltre 1100 px la scena cresce di φ (1,618) e testata e barra di √φ (1,272); sotto, la scena di √φ e i comandi di φ^¼.
   Così titoli, testo, spazi e aree di tocco mantengono fra loro gli stessi rapporti del disegno normale. */
:root[data-lim]{--ll-z:1.272;--ll-zc:1.128}
@media (min-width:1100px){:root[data-lim]{--ll-z:1.618;--ll-zc:1.272}}
:root[data-lim] body.ll .ll-top,:root[data-lim] body.ll .ll-nav{zoom:var(--ll-zc)}
:root[data-lim] body.ll .ll-scroll>*,:root[data-lim] body.ll .ll-pop,:root[data-lim] body.ll .ll-glos,:root[data-lim] body.ll .la-amdg{zoom:var(--ll-z)}
:root[data-lim] body.ll .ll-glos{width:min(420px,calc(100vw / var(--ll-z)))}
:root[data-lim] body.ll .ll-pop{width:min(360px,calc((100vw - 26px) / var(--ll-z)))}

/* i token LIM del kit artefatti (pensati senza zoom) tornano alle misure normali: lo zoom fa il resto, una volta sola */
:root[data-lim] body.ll{--lab-lim-caption:12.5px;--lab-lim-body:16px;--lab-lim-lead:17px;--lab-lim-question:clamp(25px,3vw,30px);--lab-lim-term:40px;--lab-lim-score:55px;--lab-lim-target:55px;--lab-lim-measure:62ch;--lu:6.18px}

/* leggibilità a 6–8 metri: tinte piene, pesi più alti, domande in sans 800 (stessa scala, più contrasto) */
:root[data-lim] body.ll .ll-p,:root[data-lim] body.ll .ll-lead,:root[data-lim] body.ll .lp-p,:root[data-lim] body.ll .ll-hint{color:var(--lab-ink)}
:root[data-lim] body.ll .ll-p,:root[data-lim] body.ll .ll-lead{font-weight:500}
:root[data-lim] body.ll .ll-h{font-weight:700}
:root[data-lim] body.ll .ll-h em{font-weight:600}
:root[data-lim] body.ll .la-q,:root[data-lim] body.ll .ll-block-h{font-family:var(--lab-font-body);font-weight:800;letter-spacing:-.01em}
:root[data-lim] body.ll .ll-dfn{text-decoration-thickness:3px}
:root[data-lim] body.ll .la-halo{display:none}

/* mascotte nella sua corsia della barra, alla stessa scala dei comandi */
:root[data-lim] body.ll .la-mascot{right:13px;bottom:3px;transform:none}
:root[data-lim] body.ll .la-mascot lab-mascotte{width:calc(55px * var(--ll-zc))!important;height:calc(55px * var(--ll-zc))!important}

  var inVisore = /[?&]in=visore(?:&|$)/.test(location.search);
  if (inVisore) root.setAttribute('data-visore', '');

  /* ---------- STRATI: livelli concentrici; si entra più a fondo con uno zoom ---------- */

  /* ---------- BILANCIA: argomenti sui due piatti; il peso lo discute la classe ---------- */

  /* ---------- STIMA: la classe stima un valore, poi si svela quello documentato ---------- */
  LL.blocco('stima', function (p) {

  /* ---------- LENTE: punti da esplorare su un'immagine o uno schema; modalità «trova il dettaglio» ---------- */

  /* ---------- LEGGI: lettura ravvicinata di una fonte; frasi che si aprono, oppure «trova la frase» ----------

  function segmenti(t) {

  /* ---------- ORDINA: rimettere in ordine passaggi di un ragionamento, fasi o eventi ---------- */
  LL.blocco('ordina', function (p) {
    var voci = p.voci || [], s = useState(function () { return mescola(voci.length, (p.q || '').length); }), ord = s[0], setOrd = s[1], c = useState(false), chk = c[0], setChk = c[1];
    function sposta(i, dlt) { var j = i + dlt; if (j < 0 || j >= ord.length) return; var o = ord.slice(), t = o[i]; o[i] = o[j]; o[j] = t; setOrd(o); setChk(false); }

  /* ---------- BIVIO: un caso, più scelte, conseguenze; poi il criterio della fonte ---------- */
  LL.blocco('bivio', function (p) {
    var sc = p.scelte || [], s = useState(null), a = s[0], setA = s[1], v = useState([]), visti = v[0], setVisti = v[1], c = useState(false), fine = c[0], setFine = c[1];

  LL.blocco('varianti', function (p, ctx) {

    </div>`;

      <div className="ll-blocks">${(o.blocchi || []).map(function (b, i) { return html`<${Sub} key=${a + '-' + i} b=${b} ctx=${ctx} />`; })}</div>
    </div>`;
  });

  /* ---------- CONSEGNA: lavoro di gruppo o a coppie con tempo, passi e prodotto atteso ---------- */
  LL.blocco('consegna', function (p) {
    var tot = Math.round((+p.minuti || 5) * 60), s = useState(tot), rem = s[0], setRem = s[1], r = useState(false), run = r[0], setRun = r[1];
    useEffect(function () { if (!run) return; if (rem <= 0) { setRun(false); LL.bip && LL.bip(); say(p.fine || 'Tempo! Un portavoce per gruppo.'); return; } var t = setTimeout(function () { setRem(rem - 1); }, 1000); return function () { clearTimeout(t); }; }, [run, rem]);
    var mm = Math.floor(Math.max(0, rem) / 60), ss = Math.max(0, rem) % 60, frac = Math.max(0, rem) / Math.max(1, tot);
    var fase = p.passi && p.passi.length ? Math.min(p.passi.length - 1, Math.floor((1 - frac) * p.passi.length)) : -1;

      ${p.ruoli && html`<div className="lp-roles">${p.ruoli.map(function (x, i) { return html`<span key=${i} className="lp-pill">${x}</span>`; })}</div>`}

      </div>
    </div>`;
  });

  /* ---------- AGGANCIO: rimando breve, chiuso di default (all'oggi, a un prerequisito, a un approfondimento) ---------- */
  LL.blocco('aggancio', function (p) {

/* La catena dei nomi: le tre regole, il suggerimento per chi parla («ripeti chi c'era prima») e la lavagna dei talenti.
   I nomi restano in memoria finché la pagina è aperta: la lavagna vera va fotografata. */
LabLezione.registra('CatenaNomi', function (p) {
  var REGOLE = [
    { t: 'Dici il tuo nome.', d: '' },
    { t: 'Dici una cosa che ti riesce bene.', d: 'Qualunque: cucinare, ascoltare, dormire, un videogioco.' },
    { t: 'Prima di parlare, ripeti chi c\'era prima di te.', d: '«Lei è Sara, che sa fare X. Io sono…»' }
  ];
  var n = React.useState(''), nome = n[0], setNome = n[1];
  var c = React.useState(''), cosa = c[0], setCosa = c[1];
  var l = React.useState([]), lista = l[0], setLista = l[1];
  var nomeRef = React.useRef(null);
  var ultimo = lista.length ? lista[lista.length - 1] : null;
  function aggiungi(e) {
    e.preventDefault();
    var nm = nome.trim(), cs = cosa.trim();
    if (!nm) { if (nomeRef.current) nomeRef.current.focus(); return; }
    if (!cs) cs = 'non lo so ancora';
    var nl = lista.concat([{ nome: nm, cosa: cs }]);
    setLista(nl); setNome(''); setCosa('');
    if (nl.length > 1 && nl.length % 10 === 0) p.ctx.cheer();
    if (nomeRef.current) nomeRef.current.focus();
  }
  function togli() { setLista(lista.slice(0, -1)); }
  return html`<div className="acc1-catena">
    <ol className="acc1-regole">
      ${REGOLE.map(function (r, i) { return html`<li key=${i}><b>${i + 1}</b><div><strong>${r.t}</strong>${r.d && html`<small>${r.d}</small>`}</div></li>`; })}
    </ol>
    <p className="ll-hint">Comincia chi sta in cattedra. Nessuno può passare, ma «non lo so ancora» è una risposta valida.</p>
    <div className="la-card acc1-lavagna" data-flat>
      <div className="acc1-lav-h">
        <span className="la-meta">La lavagna · ${lista.length} ${lista.length === 1 ? 'nome' : 'nomi'}</span>
        <span className="ll-hint">Questa lavagna la fotografo.</span>
      </div>
      <div aria-live="polite">${ultimo
        ? html`<p className="acc1-prima">Prima di te: <b>${ultimo.nome}</b>, che sa fare <em>${ultimo.cosa}</em>. «Io sono…»</p>`
        : html`<p className="ll-hint">Il primo nome è di chi sta in cattedra: una cosa piccola, non un talento.</p>`}</div>
      <form className="acc1-form" onSubmit=${aggiungi}>
        <input ref=${nomeRef} value=${nome} maxLength="24" placeholder="Nome" aria-label="Nome" onChange=${function (e) { setNome(e.target.value); }} />
        <input value=${cosa} maxLength="40" placeholder="Una cosa che ti riesce bene" aria-label="Una cosa che ti riesce bene" onChange=${function (e) { setCosa(e.target.value); }} />
        <button className="ll-btn" type="submit">Sulla lavagna</button>
        <button className="ll-btn ll-btn--ghost" type="button" onClick=${function () { setCosa('non lo so ancora'); }}>Non lo so ancora</button>
      </form>
      <ul className="acc1-nomi">

    var board = h('<div class="g-board g-abbina"><p class="g-note">Tocca un termine a sinistra, poi la frase che gli corrisponde.</p><div class="g-cols"><div class="g-col" data-side="l"></div><div class="g-col" data-side="r"></div></div></div>');
    root.appendChild(board);
    P.forEach(function (p, i) { var b = h('<button class="g-pill" type="button" data-i="' + i + '"></button>'); b.textContent = p[0]; $('[data-side="l"]', board).appendChild(b); });
    shuffle(P.map(function (_, i) { return i; })).forEach(function (i) { var b = h('<button class="g-pill g-pill--r" type="button" data-i="' + i + '"></button>'); b.textContent = P[i][1]; $('[data-side="r"]', board).appendChild(b); });
    $$('[data-side="l"] .g-pill', board).forEach(function (b) {
      b.onclick = function () { $$('[data-side="l"] .g-pill', board).forEach(function (x) { x.classList.remove('is-sel'); }); sel = b; b.classList.add('is-sel'); sfx.tick(); };
    });
    $$('[data-side="r"] .g-pill', board).forEach(function (b) {
      b.onclick = function () {
        if (!sel) { shake(b); return G.say('Prima scegli un termine a sinistra.'); }
        if (sel.dataset.i === b.dataset.i) {
          done++; var c = 'g-pair-' + done; [sel, b].forEach(function (x) { x.classList.remove('is-sel'); x.classList.add('is-done', c); x.disabled = true; x.dataset.n = done; });
          H.score(H.get() + 20, b); sfx.ok(); sel = null; H.prog(done, P.length, done + ' di ' + P.length + ' coppie');
          if (done === P.length) setTimeout(function () { G.end(root, { title: 'Tutte le coppie!', score: H.get(), max: P.length * 20, again: function () { G.mount('abbina'); } }); }, 500);
        } else {
          shake(b); shake(sel); lives--; H.lives(lives, LIVES); H.score(Math.max(0, H.get() - 5), b); sfx.ko(); G.oops();
          if (lives <= 0) setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Game over', score: H.get(), max: P.length * 20, again: function () { G.mount('abbina'); } }); }, 500);
        }
      };
    });
    H.score(0);
  });

  /* ---------- SEQUENZA ---------- */
  G.register('seq', function (root) {
    var S = D.seq, tries = 0, H = G.hud({});
    root.appendChild(H.el); H.prog(0, S.length, 'Metti in ordine dal più antico');
    var board = h('<div class="g-board g-seq"><ol class="g-seq-list"></ol><div class="g-actions"><span class="g-note">Usa le frecce o trascina.</span><button class="g-btn" data-check>Controlla</button></div></div>');
    root.appendChild(board);
    var list = $('ol', board), order = shuffle(S.map(function (_, i) { return i; }));
    if (order.every(function (v, i) { return v === i; })) order.reverse();
    order.forEach(function (i) {
      var li = h('<li class="g-seq-item" draggable="true" data-i="' + i + '"><span class="g-seq-n"></span><span class="g-seq-t"></span><span class="g-seq-y">' + S[i].y + '</span><span class="g-seq-mv"><button type="button" data-mv="-1" aria-label="Su">↑</button><button type="button" data-mv="1" aria-label="Giù">↓</button></span></li>');
      $('.g-seq-t', li).textContent = S[i].t; list.appendChild(li);
    });
    function renum() { $$('.g-seq-item', list).forEach(function (li, k) { $('.g-seq-n', li).textContent = k + 1; }); }
    function locked(li) { return li && li.classList.contains('is-ok'); }
    list.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mv]'); if (!b) return; var li = b.closest('li'); if (locked(li)) return;
      var dir = +b.dataset.mv, sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
      while (sib && locked(sib)) sib = dir < 0 ? sib.previousElementSibling : sib.nextElementSibling;
      if (!sib) return;
      if (dir < 0) list.insertBefore(li, sib); else list.insertBefore(li, sib.nextElementSibling);
      li.classList.remove('is-moved'); void li.offsetWidth; li.classList.add('is-moved'); $$('.is-wrong', list).forEach(function (x) { x.classList.remove('is-wrong'); }); sfx.tick(); renum();
    });
    var drag = null;
    list.addEventListener('dragstart', function (e) { var li = e.target.closest('li'); if (locked(li)) return e.preventDefault(); drag = li; li.classList.add('is-drag'); });
    list.addEventListener('dragend', function () { if (drag) drag.classList.remove('is-drag'); drag = null; renum(); });
    list.addEventListener('dragover', function (e) {
      e.preventDefault(); var over = e.target.closest('li'); if (!drag || !over || over === drag || locked(over)) return;
      var r = over.getBoundingClientRect(); list.insertBefore(drag, e.clientY > r.top + r.height / 2 ? over.nextElementSibling : over);
    });
    $('[data-check]', board).onclick = function () {
      tries++; var items = $$('.g-seq-item', list), ok = 0;
      items.forEach(function (li, k) { var r = +li.dataset.i === k; li.classList.toggle('is-ok', r); li.classList.toggle('is-wrong', !r); li.draggable = !r; if (r) ok++; });
      H.prog(ok, S.length, ok + ' di ' + S.length + ' al posto giusto · tentativo ' + tries);
      if (ok === S.length) { var sc = Math.max(20, 120 - (tries - 1) * 20); H.score(sc, this); sfx.win();
        setTimeout(function () { G.end(root, { title: 'Linea del tempo completa', score: sc, max: 120, msg: tries === 1 ? 'Al primo tentativo!' : 'In ' + tries + ' tentativi.', again: function () { G.mount('seq'); } }); }, 700);
      } else { sfx.ko(); G.say(ok ? ok + ' al posto giusto. Sposta le altre.' : 'Nessuna al posto giusto. Coraggio!'); }
    };
    renum(); H.score(0);
  });

  /* ---------- CATEGORIE ---------- */
  G.register('cat', function (root) {
    var C = D.cat, LIVES = 3, lives = LIVES, done = 0, sel = null, H = G.hud({ lives: true });
    root.appendChild(H.el); H.lives(lives, LIVES); H.prog(0, C.items.length, '0 di ' + C.items.length + ' frasi');
    var board = h('<div class="g-board g-cat"><div class="g-pool"></div><div class="g-bins">' + C.bins.map(function (b, i) { return '<div class="g-bin" data-b="' + i + '" role="button" tabindex="0"><span class="g-bin-h">' + b + '</span><div class="g-bin-in"></div></div>'; }).join('') + '</div></div>');
    root.appendChild(board);
    shuffle(C.items).forEach(function (it) { var c = h('<button class="g-chip-d" type="button" draggable="true" data-b="' + it[1] + '"></button>'); c.textContent = it[0]; $('.g-pool', board).appendChild(c); });
    function choose(c) { $$('.g-chip-d', board).forEach(function (x) { x.classList.remove('is-sel'); }); sel = c; if (c) { c.classList.add('is-sel'); sfx.tick(); } board.classList.toggle('is-picking', !!c); }
    function drop(bin) {
      if (!sel) return G.say('Tocca prima una frase.');
      var c = sel; choose(null);
      if (c.dataset.b === bin.dataset.b) {
        $('.g-bin-in', bin).appendChild(c); c.disabled = true; c.draggable = false; c.classList.add('is-in'); done++;
        H.score(H.get() + 10, bin); sfx.ok(); H.prog(done, C.items.length, done + ' di ' + C.items.length + ' frasi');
        if (done === C.items.length) setTimeout(function () { G.cheer(); G.end(root, { title: 'Tutto al suo posto', score: H.get(), max: C.items.length * 10, again: function () { G.mount('cat'); } }); }, 500);
      } else {
        shake(bin); shake(c); lives--; H.lives(lives, LIVES); sfx.ko(); G.oops();
        if (lives <= 0) setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Game over', score: H.get(), max: C.items.length * 10, again: function () { G.mount('cat'); } }); }, 500);
      }
    }
    board.addEventListener('click', function (e) {
      var c = e.target.closest('.g-chip-d'); if (c && !c.disabled) return choose(sel === c ? null : c);
      var b = e.target.closest('.g-bin'); if (b) drop(b);
    });
    board.addEventListener('dragstart', function (e) { var c = e.target.closest('.g-chip-d'); if (c) { choose(c); e.dataTransfer.setData('text', ''); } });
    $$('.g-bin', board).forEach(function (b) {
      b.addEventListener('dragover', function (e) { e.preventDefault(); b.classList.add('is-over'); });
      b.addEventListener('dragleave', function () { b.classList.remove('is-over'); });
      b.addEventListener('drop', function (e) { e.preventDefault(); b.classList.remove('is-over'); drop(b); });
      b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(b); } });
    });
    H.score(0); G.say('Tocca una frase, poi il contenitore giusto.');
  });

  /* ---------- MEMORY ---------- */
  G.register('memory', function (root) {
    var P = D.memory, moves = 0, found = 0, open = [], busy = false, sec = 0, H = G.hud({ timer: true });
    root.appendChild(H.el); H.prog(0, P.length, '0 di ' + P.length + ' coppie · 0 mosse');
    var cards = shuffle([].concat.apply([], P.map(function (p, i) { return [{ t: p[0], i: i, k: 'a' }, { t: p[1], i: i, k: 'b' }]; })));
    var board = h('<div class="g-board g-memory"><div class="g-mem-grid"></div></div>'); root.appendChild(board);
    cards.forEach(function (c) {
      var b = h('<button class="g-mem" type="button" aria-label="Carta coperta"><span class="g-mem-in"><span class="g-mem-f g-mem-back">?</span><span class="g-mem-f g-mem-face g-mem-' + c.k + '"></span></span></button>');
      $('.g-mem-face', b).textContent = c.t; b._c = c; $('.g-mem-grid', board).appendChild(b);
      b.onclick = function () {
        if (busy || b.classList.contains('is-open')) return;
        b.classList.add('is-open'); b.setAttribute('aria-label', c.t); sfx.flip(); open.push(b);
        if (open.length < 2) return;
        moves++; busy = true; var a = open[0], z = open[1];
        if (a._c.i === z._c.i) {
          found++; setTimeout(function () { a.classList.add('is-match'); z.classList.add('is-match'); sfx.ok(); H.score(H.get() + 20, z); open = []; busy = false;
            if (found === P.length) { G.clear(); var bonus = Math.max(0, 60 - (moves - P.length) * 5); H.score(H.get() + bonus);
              setTimeout(function () { G.end(root, { title: 'Memoria d’acciaio', score: H.get(), max: P.length * 20 + 60, msg: moves + ' mosse · ' + Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2), again: function () { G.mount('memory'); } }); }, 600); }
          }, 350);
        } else setTimeout(function () { a.classList.remove('is-open'); z.classList.remove('is-open'); a.setAttribute('aria-label', 'Carta coperta'); z.setAttribute('aria-label', 'Carta coperta'); open = []; busy = false; }, 900);
        H.prog(found + (a._c.i === z._c.i ? 1 : 0), P.length, (found + (a._c.i === z._c.i ? 1 : 0)) + ' di ' + P.length + ' coppie · ' + moves + ' mosse');
      };
    });
    G.every(1000, function () { H.time(++sec); });
    H.score(0); G.say('Trova il termine e la sua definizione.');
  });

  /* ---------- COMPLETA IL TESTO ---------- */
  G.register('completa', function (root) {
    var C = D.completa, LIVES = 3, lives = LIVES, active = null, H = G.hud({ lives: true });
    var answers = [], html = C.testo.replace(/\{([^}]+)\}/g, function (_, w) { answers.push(w); return '<button class="g-blank" type="button" data-k="' + (answers.length - 1) + '"></button>'; });
    root.appendChild(H.el); H.lives(lives, LIVES); H.prog(0, answers.length, '0 di ' + answers.length + ' spazi');
    var board = h('<div class="g-board g-completa"><p class="g-text">' + html + '</p><div class="g-bank"></div><div class="g-actions"><button class="g-btn" data-check>Controlla</button></div></div>');
    root.appendChild(board);
    shuffle(answers.concat(C.extra)).forEach(function (wd) { var b = h('<button class="g-word" type="button"></button>'); b.textContent = wd; $('.g-bank', board).appendChild(b); });
    var blanks = $$('.g-blank', board);
    function setActive(b) { blanks.forEach(function (x) { x.classList.toggle('is-active', x === b); }); active = b; }
    function nextEmpty() { return blanks.filter(function (x) { return !x.dataset.w && !x.classList.contains('is-ok'); })[0] || null; }
    blanks.forEach(function (b) { b.onclick = function () {
      if (b.classList.contains('is-ok')) return;
      if (b.dataset.w) { var w = $$('.g-word', board).filter(function (x) { return x.textContent === b.dataset.w && x.disabled; })[0]; if (w) w.disabled = false; b.dataset.w = ''; b.textContent = ''; b.classList.remove('is-wrong'); }
      setActive(b); sfx.tick();
    }; });
    $$('.g-word', board).forEach(function (w) { w.onclick = function () {
      var b = active && !active.dataset.w ? active : nextEmpty(); if (!b) return G.say('Tutti gli spazi sono pieni: controlla!');
      b.dataset.w = w.textContent; b.textContent = w.textContent; b.classList.remove('is-wrong'); w.disabled = true; sfx.tick(); setActive(nextEmpty());
    }; });
    $('[data-check]', board).onclick = function () {
      var wrong = 0, gained = 0;
      blanks.forEach(function (b) {
        if (!b.dataset.w || b.classList.contains('is-ok')) return;
        if (b.dataset.w === answers[+b.dataset.k]) { b.classList.add('is-ok'); gained += 15; } else { b.classList.add('is-wrong'); wrong++; }
      });
      var ok = blanks.filter(function (b) { return b.classList.contains('is-ok'); }).length;
      H.prog(ok, answers.length, ok + ' di ' + answers.length + ' spazi');
      if (gained) { H.score(H.get() + gained, this); sfx.ok(); }
      if (wrong) { lives--; H.lives(lives, LIVES); sfx.ko(); G.oops(); }
      if (!gained && !wrong) G.say('Riempi almeno uno spazio.');
      if (ok === answers.length) setTimeout(function () { G.end(root, { title: 'Testo completo', score: H.get(), max: answers.length * 15, again: function () { G.mount('completa'); } }); }, 500);
      else if (lives <= 0) { blanks.forEach(function (b) { if (!b.classList.contains('is-ok')) { b.textContent = answers[+b.dataset.k]; b.classList.remove('is-wrong'); b.classList.add('is-shown'); } });
        setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Ecco il testo', score: H.get(), max: answers.length * 15, again: function () { G.mount('completa'); } }); }, 1400); }
    };
    setActive(blanks[0]); H.score(0);
  });

  /* ---------- SONDAGGIO ---------- */
  G.register('sondaggio', function (root) {
    var S = D.sondaggio, qi = 0, votes = G.store.get('giochi_sondaggio', {}), shown = false, last = -1, H = G.hud({});
    root.appendChild(H.el);
    var board = h('<div class="g-board g-poll"><span class="g-label">Sondaggio di classe · anonimo</span><h2 class="g-q"></h2><div class="g-poll-opts"></div>' +
      '<div class="g-debate" hidden><span class="g-label">Per il dibattito</span><p></p></div>' +
      '<div class="g-actions"><span class="g-note" data-tot></span><button class="g-btn g-btn--ghost" data-reset>Azzera</button><button class="g-btn g-btn--ghost" data-show>Mostra risultati</button><button class="g-btn" data-next>Prossima →</button></div></div>');
    root.appendChild(board);
    function v() { return votes[qi] = votes[qi] || S[qi].a.map(function () { return 0; }); }
    function draw() {
      var q = S[qi], vv = v(), tot = vv.reduce(function (a, b) { return a + b; }, 0), max = Math.max.apply(null, vv);
      H.prog(qi + 1, S.length, 'Domanda ' + (qi + 1) + ' di ' + S.length); H.score(tot);
      $('.g-q', board).textContent = q.q; board.classList.toggle('is-shown', shown);
      var box = $('.g-poll-opts', board); box.innerHTML = '';
      q.a.forEach(function (a, i) {
        var pct = tot ? Math.round(vv[i] / tot * 100) : 0;
        var row = h('<div class="g-poll-row' + (shown && tot && vv[i] === max ? ' is-top' : '') + (i === last ? ' is-voted' : '') + '"><button class="g-poll-b" type="button"><span class="g-poll-ok" aria-hidden="true">✓ Votato</span><span class="g-poll-bar" style="width:' + (shown ? pct : 0) + '%"></span><span class="g-poll-a"></span><span class="g-poll-res">' + (shown ? '<b class="g-num g-num--sm">' + pct + '%</b><small class="g-poll-n">' + vv[i] + (vv[i] === 1 ? ' voto' : ' voti') + '</small>' : '') + '</span></button><button class="g-poll-minus" type="button" aria-label="Togli un voto">−</button></div>');
        $('.g-poll-a', row).textContent = a;
        $('.g-poll-b', row).onclick = function (e) { vv[i]++; G.store.set('giochi_sondaggio', votes); sfx.coin(); G.pop(e.currentTarget, '+1', true); last = i; draw(); };
        $('.g-poll-minus', row).onclick = function () { if (vv[i] > 0) { vv[i]--; G.store.set('giochi_sondaggio', votes); draw(); } };
        box.appendChild(row);
      });
      var tn = $('[data-tot]', board); tn.setAttribute('aria-live', 'polite');
      tn.innerHTML = (last > -1 ? '<b class="g-poll-reg">✓ Voto registrato</b> · ' : '') + tot + (tot === 1 ? ' voto' : ' voti');
      last = -1;
      $('[data-show]', board).textContent = shown ? 'Nascondi risultati' : 'Mostra risultati';
      var db = $('.g-debate', board); db.hidden = !shown; $('p', db).textContent = q.dibattito;
      $('[data-next]', board).textContent = qi === S.length - 1 ? 'Ricomincia' : 'Prossima →';
    }
    $('[data-show]', board).onclick = function () { shown = !shown; if (shown) sfx.win(); draw(); };
    $('[data-reset]', board).onclick = function () { votes[qi] = null; G.store.set('giochi_sondaggio', votes); shown = false; draw(); };
    $('[data-next]', board).onclick = function () { qi = (qi + 1) % S.length; shown = false; draw(); };
    $('.g-hud-score .g-label', H.el).textContent = 'Voti';
    draw(); G.say('Ognuno tocca la sua risposta. I risultati restano nascosti finché non li mostri.');
  });
})();
