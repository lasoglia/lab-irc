<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Lab IRC — token del design system, copiati da _ds/tokens (colori, tipografia, spazi, ombre, movimento, tema chiaro, base). */
:root {
  --lab-bg:        #14131F;
  --lab-bg-2:      #1A1827;
  --lab-surface:   #1E1C2E;
  --lab-surface-2: #272438;
  --lab-line:      #322E45;
  --lab-line-soft: #2A2739;
  --lab-ink:       #ECEAF5;
  --lab-ink-soft:  #C7C3DA;
  --lab-muted:     #8E89A6;
  --lab-viola:     #8B5CF6;
  --lab-viola-2:   #A78BFA;
  --lab-ciano:     #22D3EE;
  --lab-ambra:     #FBBF24;
  --lab-rosa:      #F472B6;
  --lab-verde:     #34D399;
  --lab-rosso:     #FB7185;
  --lab-oro:       #E3C27A;
  --lab-oro-soft:  rgba(227,194,122,.16);
  --lab-brand:     var(--lab-viola);
  --lab-accent:    var(--lab-ciano);
  --lab-on-brand:  #14131F;
  --lab-grad:      linear-gradient(135deg, #8B5CF6, #22D3EE);
  --lab-grad-warm: linear-gradient(135deg, #F472B6, #FBBF24);
  --lab-grad-soft: linear-gradient(160deg, #1E1C2E, #14131F);
  --lab-anno-1:    #FF7A59;
  --lab-anno-2:    #4FB0FF;
  --lab-anno-3:    #A78BFA;
  --lab-anno-4:    #FB7BB5;
  --lab-anno-5:    #FBBF24;
  color-scheme: dark;
}
:root {
  --lab-font-display:     "Cormorant Garamond", "Cormorant", Georgia, serif;
  --lab-font-inscription: "Cinzel", "Trajan Pro", Georgia, serif;
  --lab-font-body:        "Figtree", system-ui, -apple-system, sans-serif;
  --lab-text-xs:   12.5px;
  --lab-text-sm:   14px;
  --lab-text-base: 16px;
  --lab-text-md:   20.5px;
  --lab-text-lg:   26px;
  --lab-text-xl:   33px;
  --lab-text-2xl:  42px;
  --lab-text-3xl:  68px;
  --lab-text-display-sm: clamp(23px, 2.4vw, 29px);
  --lab-text-display-md: clamp(29px, 3.8vw, 46px);
  --lab-text-display-lg: clamp(36px, 5.4vw, 60px);
  --lab-text-hero:       clamp(46px, 7.4vw, 94px);
  --lab-weight-regular:   400;
  --lab-weight-medium:    500;
  --lab-weight-semibold:  600;
  --lab-weight-bold:      700;
  --lab-weight-extrabold: 800;
  --lab-leading-tight:   1.0;
  --lab-leading-snug:    1.08;
  --lab-leading-normal:  1.382;
  --lab-leading-relaxed: 1.5;
  --lab-leading-loose:   1.618;
  --lab-tracking-tight:   -0.02em;
  --lab-tracking-normal:  -0.01em;
  --lab-tracking-wide:    0.04em;
  --lab-tracking-widest:  0.18em;
  --lab-eyebrow-size:    13px;
  --lab-eyebrow-weight:  600;
  --lab-eyebrow-spacing: 0.18em;
}
:root {
  --lab-phi: 1.618;
  --lab-phi-inv: 0.618;
  --lab-space-1: 5px;
  --lab-space-2: 8px;
  --lab-space-3: 13px;
  --lab-space-4: 21px;
  --lab-space-5: 34px;
  --lab-space-6: 55px;
  --lab-space-7: 89px;
  --lab-space-8: 144px;
  --lab-radius-xs:   8px;
  --lab-radius-sm:   13px;
  --lab-radius:      21px;
  --lab-radius-lg:   34px;
  --lab-radius-pill: 999px;
  --lab-radius-icon: 13px;
  --lab-max-w:    1140px;
  --lab-max-w-sm:  880px;
  --lab-max-w-xs:  460px;
  --lab-measure:   62ch;
}
:root {
  --lab-shadow:     0 2px 6px rgba(0,0,0,.30), 0 18px 40px -22px rgba(0,0,0,.70);
  --lab-shadow-lg:  0 4px 10px rgba(0,0,0,.35), 0 36px 60px -28px rgba(0,0,0,.80);
  --lab-glow:       0 0 0 1px rgba(139,92,246,.35), 0 0 30px -6px rgba(139,92,246,.50);
  --lab-focus-ring: 0 0 0 3px rgba(139,92,246,.35);
  --lab-btn-glow:   0 8px 22px -10px rgba(139,92,246,.80);
  --lab-btn-glow-hover: 0 12px 28px -10px rgba(139,92,246,.90);
}
@keyframes labSu { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: none; } }
@keyframes labFloaty { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(0,-21px,0) scale(1.034); } }
@keyframes labPulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
@keyframes labFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes labRise { from { opacity: 0; transform: translateY(34px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes labLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes labBreath { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.13); } }
@keyframes labSpin { to { transform: rotate(360deg); } }
:root {
  --lab-ease-out:    cubic-bezier(.16, 1, .3, 1);
  --lab-ease-solemn: cubic-bezier(.618, 0, .382, 1);
  --lab-ease-spring: cubic-bezier(.2, .7, .2, 1);
  --lab-ease-sharp:  cubic-bezier(.4, 0, .2, 1);
  --lab-dur-instant: 144ms;
  --lab-dur-fast:    233ms;
  --lab-dur-normal:  377ms;
  --lab-dur-slow:    610ms;
  --lab-dur-solemn:  987ms;
  --lab-dur-float:   21s;
  --lab-stagger:     89ms;
  --lab-anim-in:   labRise var(--lab-dur-solemn) var(--lab-ease-out) both;
  --lab-anim-in-2: labRise var(--lab-dur-solemn) var(--lab-ease-out) 89ms both;
  --lab-anim-in-3: labRise var(--lab-dur-solemn) var(--lab-ease-out) 178ms both;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
html[data-tema="chiaro"] {
  --lab-bg:        #FAF7F1;
  --lab-bg-2:      #F3EFE6;
  --lab-surface:   #FFFFFF;
  --lab-surface-2: #FBF8F2;
  --lab-line:      #E7E0D2;
  --lab-line-soft: #EFEADD;
  --lab-ink:       #1B1822;
  --lab-ink-soft:  #39333F;
  --lab-muted:     #6A6472;
  --lab-viola:     #6D3FE0;
  --lab-viola-2:   #7C3AED;
  --lab-ciano:     #0891B2;
  --lab-ambra:     #C8941E;
  --lab-rosa:      #DB2777;
  --lab-verde:     #0E9E86;
  --lab-rosso:     #E11D48;
  --lab-oro:       #A67C2E;
  --lab-oro-soft:  rgba(166,124,46,.12);
  --lab-on-brand:  #FFFFFF;
  --lab-grad-soft: linear-gradient(160deg, #FFFFFF, #F3EFE6);
  --lab-shadow:    0 1px 2px rgba(27,24,34,.04), 0 14px 32px -20px rgba(27,24,34,.28);
  --lab-shadow-lg: 0 2px 4px rgba(27,24,34,.05), 0 30px 50px -28px rgba(27,24,34,.40);
  --lab-glow:      0 0 0 1px rgba(109,63,224,.25), 0 0 26px -8px rgba(109,63,224,.35);
  --lab-focus-ring: 0 0 0 3px rgba(109,63,224,.25);
  --lab-anno-1:    #E2603B;
  --lab-anno-2:    #2D7DD2;
  --lab-anno-3:    #6A4FB0;
  --lab-anno-4:    #C8417B;
  --lab-anno-5:    #C98A1E;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--lab-bg); color: var(--lab-ink); font-family: var(--lab-font-body); font-size: var(--lab-text-base); line-height: var(--lab-leading-loose); -webkit-font-smoothing: antialiased; transition: background var(--lab-dur-slow) ease, color var(--lab-dur-slow) ease; }
h1, h2, h3, h4 { font-family: var(--lab-font-display); font-weight: var(--lab-weight-semibold); line-height: var(--lab-leading-snug); letter-spacing: var(--lab-tracking-normal); margin: 0 0 .382em; color: var(--lab-ink); text-wrap: balance; }
h1 { font-size: var(--lab-text-display-lg); }
h2 { font-size: var(--lab-text-display-md); }
h3 { font-size: var(--lab-text-display-sm); }
p { margin: 0 0 1em; color: var(--lab-ink-soft); text-wrap: pretty; }
a { color: var(--lab-accent); text-decoration: none; transition: color var(--lab-dur-fast) ease; }
a:hover { color: var(--lab-oro); }
::selection { background: rgba(227,194,122,.35); color: var(--lab-ink); }
:focus-visible { outline: 1.5px solid var(--lab-oro); outline-offset: 3px; border-radius: 5px; }
.lab-grad-text { background: var(--lab-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.lab-eyebrow { font-family: var(--lab-font-inscription); font-size: var(--lab-eyebrow-size); letter-spacing: var(--lab-eyebrow-spacing); text-transform: uppercase; font-weight: var(--lab-eyebrow-weight); color: var(--lab-oro); margin: 0 0 13px; }
.lab-wrap { max-width: var(--lab-max-w); margin: 0 auto; padding: 0 var(--lab-space-4); }
</style>
<style>
/* Lab IRC — Kit artefatti. Uso: <body class="la" data-anno="1-5"> + lab-artefatto.js.
   Richiede tokens.css (e i font Cinzel, Cormorant Garamond, Figtree). */

body.la{--la-accent:var(--lab-viola);margin:0;min-height:100vh;background:var(--lab-bg);color:var(--lab-ink);font-family:var(--lab-font-body);line-height:1.618}
body[data-anno="1"]{--la-accent:var(--lab-anno-1)}
body[data-anno="2"]{--la-accent:var(--lab-anno-2)}
body[data-anno="3"]{--la-accent:var(--lab-anno-3)}
body[data-anno="4"]{--la-accent:var(--lab-anno-4)}
body[data-anno="5"]{--la-accent:var(--lab-anno-5)}

.la-stage{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:55px 21px 144px}
.la-eyebrow{display:flex;align-items:center;gap:13px;font:600 13px/1.4 var(--lab-font-inscription);letter-spacing:.18em;text-transform:uppercase;color:var(--lab-oro);margin:0 0 13px}
.la-eyebrow::before{content:"";width:34px;height:1px;background:currentColor;opacity:.7}
.la-title{font-family:var(--lab-font-display);font-weight:600;font-size:clamp(36px,5.4vw,60px);line-height:1.06;letter-spacing:-.02em;margin:0 0 13px;text-wrap:balance}
.la-title em{font-weight:500;color:var(--la-accent)}
.la-lead{font-size:18px;color:var(--lab-muted);max-width:52ch;margin:0 0 34px;text-wrap:pretty}

.la-card{position:relative;overflow:hidden;background:var(--lab-surface);border:1px solid var(--lab-line);border-radius:21px;padding:34px;box-shadow:var(--lab-shadow);transition:transform 610ms var(--lab-ease-out),box-shadow 377ms,border-color 377ms}
.la-card::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 377ms;background:radial-gradient(233px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--la-accent) 18%,transparent),transparent 61.8%)}
.la-card>*{position:relative;z-index:1}
.la-card.is-hot{box-shadow:var(--lab-shadow-lg);border-color:color-mix(in srgb,var(--la-accent) 40%,var(--lab-line));transition:transform 144ms linear,box-shadow 377ms,border-color 377ms}
.la-card.is-hot::after{opacity:1}

.la-btn{display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--lab-font-body);padding:13px 21px;border-radius:999px;border:1px solid transparent;background:var(--lab-grad);color:#fff;cursor:pointer;text-decoration:none;box-shadow:0 8px 21px -13px rgba(139,92,246,.6);transition:transform 233ms var(--lab-ease-out),box-shadow 377ms,filter 233ms,border-color 233ms}
.la-btn:hover{transform:translateY(-2px);box-shadow:0 13px 34px -13px rgba(139,92,246,.75);filter:brightness(1.06)}
.la-btn:active{transform:scale(.96)}
.la-btn--ghost{background:transparent;color:var(--lab-ink);border-color:var(--lab-line);box-shadow:none}
.la-btn--ghost:hover{border-color:var(--la-accent);box-shadow:none}
.la-btn--gold{background:var(--lab-ambra);color:#3a2a06;box-shadow:none}

.la-row{display:flex;justify-content:space-between;gap:13px;margin-bottom:8px}
.la-meta{font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.14em;text-transform:uppercase;color:var(--lab-muted)}
.la-progress{height:5px;border-radius:5px;background:var(--lab-line-soft);overflow:hidden}
.la-progress>i{display:block;height:100%;border-radius:5px;background:var(--la-accent);transition:width 610ms var(--lab-ease-out)}
.la-q{font:600 clamp(25px,3vw,34px)/1.2 var(--lab-font-display);margin:34px 0 21px;color:var(--lab-ink);text-wrap:balance}
.la-choices{display:grid;gap:13px}
.la-choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;font:500 16px/1.4 var(--lab-font-body);color:var(--lab-ink);background:var(--lab-surface-2);border:1.5px solid var(--lab-line);border-radius:13px;padding:13px 21px 13px 13px;cursor:pointer;transition:transform 233ms var(--lab-ease-out),border-color 233ms,background 233ms,opacity 377ms}
.la-choice:hover:not(:disabled){border-color:var(--lab-oro);transform:translateX(5px)}
.la-choice:active:not(:disabled){transform:scale(.98)}
.la-choice:disabled{cursor:default}
.la-key{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 var(--lab-font-inscription);color:var(--la-accent);border:1px solid currentColor}
.la-choice.is-right{border-color:var(--lab-verde);background:color-mix(in srgb,var(--lab-verde) 14%,var(--lab-surface-2))}
.la-choice.is-right .la-key{background:var(--lab-verde);color:#06281d;border-color:transparent}
.la-choice.is-wrong{border-color:var(--lab-rosso);background:color-mix(in srgb,var(--lab-rosso) 12%,var(--lab-surface-2));animation:laShake 377ms}
.la-choice.is-dim{opacity:.45}
.la-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px;min-height:55px;margin-top:21px}
.la-note{font-size:15px;color:var(--lab-muted);margin:0;max-width:48ch}
.la-score{font:600 clamp(55px,9vw,89px)/1 var(--lab-font-inscription);color:var(--la-accent);margin:34px 0 13px}

[data-reveal]{animation:labRise 987ms var(--lab-ease-out) both;animation-delay:calc(var(--i,0) * 89ms)}

.la-halo{position:fixed;left:0;top:0;width:466px;height:466px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity 610ms;background:radial-gradient(circle,color-mix(in srgb,var(--la-accent) 12%,transparent),rgba(227,194,122,.04) 38.2%,transparent 61.8%)}

.la-mascot{position:fixed;right:21px;bottom:21px;z-index:50;line-height:0;animation:laPeek 987ms var(--lab-ease-out) 1618ms both}
.la-mascot:focus-visible{outline:1.5px solid var(--lab-oro);outline-offset:5px;border-radius:50%}
.la-bubble{position:absolute;right:0;bottom:calc(100% + 8px);width:max-content;max-width:233px;background:var(--lab-surface);color:var(--lab-ink);border:1px solid var(--lab-oro);border-radius:13px;padding:8px 13px;font:500 13.5px/1.4 var(--lab-font-body);text-align:left;box-shadow:var(--lab-shadow);animation:labRise 377ms var(--lab-ease-out) both;pointer-events:none}
.la-bubble[hidden]{display:none}

.la-amdg{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;text-align:center;cursor:pointer;background:radial-gradient(circle at 50% 45%,rgba(227,194,122,.18),rgba(10,9,16,.95) 61.8%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:labFade 610ms ease-out both;transition:opacity 610ms}
.la-amdg.is-out{opacity:0}
.la-amdg-star{color:#E3C27A;font-size:34px;margin-bottom:21px;animation:labBreath 2.6s ease-in-out infinite}
.la-amdg-letters{display:flex;justify-content:center;align-items:baseline;gap:.2em;font:600 clamp(55px,11vw,144px)/1 var(--lab-font-inscription);color:#F3E7C6;text-shadow:0 0 34px rgba(227,194,122,.45)}
.la-amdg-letters b{font-weight:600;display:inline-block;animation:labRise 987ms var(--lab-ease-out) both}
.la-amdg-letters i{font-style:normal;color:#E3C27A;font-size:.382em;animation:labFade 987ms ease both}
.la-amdg-line{height:1px;width:min(377px,61.8vw);margin:34px auto 21px;background:linear-gradient(90deg,transparent,#E3C27A,transparent);animation:labLine 987ms var(--lab-ease-out) 987ms both}
.la-amdg-lat{font:italic 500 clamp(23px,2.8vw,30px)/1.3 var(--lab-font-display);color:rgba(243,231,198,.92);animation:labRise 987ms var(--lab-ease-out) 1220ms both}
.la-amdg-it{font:600 12.5px/1.4 var(--lab-font-inscription);letter-spacing:.2em;text-transform:uppercase;color:rgba(227,194,122,.75);margin-top:13px;animation:labFade 987ms ease 1600ms both}

@keyframes laShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes laPeek{from{transform:translateY(89px);opacity:0}to{transform:none;opacity:1}}
</style>
<style>
/* Lab IRC — Giochi. Struttura comune + skin Arcade notturno: body[data-skin="arcade"] */
body.g{--g-a:var(--lab-ciano);--g-b:var(--lab-viola);--g-ok:var(--lab-verde);--g-ko:var(--lab-rosso);--g-on-a:#0B0A14;--g-panel:var(--lab-surface);--g-panel-2:var(--lab-surface-2);--g-line:var(--lab-line);--g-r:8px;--g-r-lg:13px;--g-head:800 clamp(26px,3.4vw,40px)/1.1 var(--lab-font-body);--g-num-font:var(--lab-font-body);--g-label-font:700 12px/1.3 var(--lab-font-body);--g-label-track:.14em;margin:0;min-height:100vh;background:var(--lab-bg);color:var(--lab-ink);font-family:var(--lab-font-body);overflow-x:hidden}
body.g *{box-sizing:border-box}
a{color:var(--g-a)}a:hover{color:var(--lab-oro)}
.g-shell{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:21px 21px 144px}
.g-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:13px;margin-bottom:21px}
.g-brand{display:flex;flex-direction:column;gap:3px}
.g-brand b{font:var(--g-head);font-size:clamp(22px,2.6vw,30px)}
.g-tools{display:flex;flex-wrap:wrap;gap:8px}
.g-seg{display:flex;padding:3px;gap:3px;border:1px solid var(--g-line);border-radius:999px;background:var(--g-panel)}
.g-seg button,.g-tool{font:700 13px/1 var(--lab-font-body);color:var(--lab-muted);background:none;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;min-height:38px}
.g-seg button[aria-pressed="true"],.g-seg button[aria-selected="true"]{background:var(--g-a);color:var(--g-on-a)}
.g-tool{border:1px solid var(--g-line);background:var(--g-panel)}
.g-tool:hover,.g-seg button:hover{color:var(--lab-ink)}
.g-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:21px}
.g-tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px 16px;min-height:56px;border:1.5px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel);color:var(--lab-ink);font:700 16px/1.2 var(--lab-font-body);cursor:pointer;transition:border-color 233ms,transform 233ms}
.g-tabs button small{font:var(--g-label-font);letter-spacing:var(--g-label-track);text-transform:uppercase;color:var(--lab-muted)}
.g-tabs button:hover{transform:translateY(-2px);border-color:var(--g-b)}
.g-tabs button[aria-selected="true"]{border-color:var(--g-a)}
.g-label{font:var(--g-label-font);letter-spacing:var(--g-label-track);text-transform:uppercase;color:var(--lab-muted)}
.g-num{font:800 44px/1 var(--g-num-font);font-variant-numeric:tabular-nums;color:var(--g-a);display:inline-block}
.g-num--sm{font-size:26px}.g-num--xl{font-size:clamp(64px,11vw,110px)}.g-num--xl small{font-size:.35em;color:var(--lab-muted)}
.g-num.is-pop{animation:gPop 377ms var(--lab-ease-spring)}
.g-h{font:var(--g-head);margin:8px 0 21px;text-wrap:balance}
.g-note{font-size:15px;line-height:1.5;color:var(--lab-muted);margin:0;max-width:52ch;text-wrap:pretty}

.g-seq-y{font:800 13px/1 var(--lab-font-body);letter-spacing:.08em;color:var(--lab-ambra);opacity:0;transition:opacity 377ms}

.g-seq-item.is-ok{border-color:var(--g-ok);cursor:default}.g-seq-item.is-ok .g-seq-y{opacity:1}.g-seq-item.is-ok .g-seq-mv{visibility:hidden}.g-seq-item.is-ok .g-seq-n{color:var(--g-ok)}

.g-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.g-bin{display:flex;flex-direction:column;gap:10px;min-height:190px;padding:16px;border:2px dashed var(--g-line);border-radius:var(--g-r-lg);cursor:pointer;transition:border-color 233ms,background 233ms,box-shadow 233ms}

.g-bank{display:flex;flex-wrap:wrap;gap:10px;padding-top:21px;border-top:1.5px dashed var(--g-line)}
.g-word{padding:12px 18px;min-height:48px;font:800 17px/1 var(--lab-font-body);color:var(--lab-ink);background:var(--g-panel-2);border:2px solid var(--g-a);border-radius:var(--g-r);cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--g-a) 40%,#000);transition:transform 144ms,opacity 233ms}
.g-word:hover:not(:disabled){transform:translateY(-2px)}.g-word:disabled{opacity:.2;cursor:default;box-shadow:none}
@keyframes gBlink{50%{border-color:var(--g-line)}}
/* sondaggio */
.g-poll-opts{display:grid;gap:13px}
.g-poll-row{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px}
.g-poll-b{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:13px;min-height:68px;padding:0 21px;text-align:left;border:2px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel-2);color:var(--lab-ink);cursor:pointer;transition:border-color 233ms,transform 144ms}
.g-poll-b:hover{border-color:var(--g-a)}.g-poll-b:active{transform:scale(.99)}
.g-poll-bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--g-b) 35%,transparent);transition:width 987ms var(--lab-ease-out)}
.g-poll-a{position:relative;font:800 22px/1.2 var(--lab-font-body)}
.g-poll-b .g-num{position:relative}
.g-poll-row.is-top .g-poll-b{border-color:var(--g-a);box-shadow:var(--g-glow-a)}.g-poll-row.is-top .g-poll-bar{background:color-mix(in srgb,var(--g-a) 35%,transparent)}
.g-poll-minus{border:1.5px solid var(--g-line);border-radius:var(--g-r);background:none;color:var(--lab-muted);font:800 22px/1 var(--lab-font-body);cursor:pointer}
.g-poll-minus:hover{color:var(--lab-ink);border-color:var(--lab-ink)}
.g-debate{margin-top:21px;padding:16px 21px;border-radius:var(--g-r);border:2px solid var(--lab-ambra);animation:gIn 377ms both}
.g-debate p{margin:6px 0 0;font:700 20px/1.4 var(--lab-font-body);color:var(--lab-ink)}
.g-debate[hidden]{display:none}
@media (max-width:760px){.g-cols{grid-template-columns:1fr;gap:21px}.g-bins{grid-template-columns:1fr}.g-bin{min-height:110px}.g-mem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.g-seq-item{grid-template-columns:28px minmax(0,1fr) auto}.g-seq-y{display:none}.g-vf-btns{gap:13px}}

      var n = $('[data-next]', board); n.hidden = false; n.textContent = qi === Q.length - 1 ? 'Vedi il risultato' : 'Avanti →';
    }
    $$('.g-vf-b', board).forEach(function (b) { b.onclick = function () { pick(b.dataset.v === '1'); }; });
    var key = function (e) { if (!document.body.contains(board)) return document.removeEventListener('keydown', key); var k = e.key.toLowerCase(); if (k === 'v') pick(true); if (k === 'f') pick(false); };
    document.addEventListener('keydown', key);
    $('[data-next]', board).onclick = function () {
      qi++; if (qi < Q.length) return ask();
      H.prog(Q.length, Q.length, 'Fatto');
      G.end(root, { title: 'Vero o falso?', score: H.get(), max: 10 + 20 + 30 * (Q.length - 2), msg: 'Le risposte di fila valgono di più.', again: function () { G.mount('vf'); } });
    };
    H.score(0); ask();
  });

  /* ---------- ABBINAMENTI ---------- */
  G.register('abbina', function (root) {
    var P = D.abbina, LIVES = 3, lives = LIVES, done = 0, sel = null, H = G.hud({ lives: true });
    root.appendChild(H.el); H.lives(lives, LIVES); H.prog(0, P.length, '0 di ' + P.length + ' coppie');
    var board = h('<div class="g-board g-abbina"><p class="g-note">Tocca un termine a sinistra, poi la frase che gli corrisponde.</p><div class="g-cols"><div class="g-col" data-side="l"></div><div class="g-col" data-side="r"></div></div></div>');
    root.appendChild(board);
    P.forEach(function (p, i) { var b = h('<button class="g-pill" type="button" data-i="' + i + '"></button>'); b.textContent = p[0]; $('[data-side="l"]', board).appendChild(b); });
    shuffle(P.map(function (_, i) { return i; })).forEach(function (i) { var b = h('<button class="g-pill g-pill--r" type="button" data-i="' + i + '"></button>'); b.textContent = P[i][1]; $('[data-side="r"]', board).appendChild(b); });
    $$('[data-side="l"] .g-pill', board).forEach(function (b) {
      b.onclick = function () { $$('[data-side="l"] .g-pill', board).forEach(function (x) { x.classList.remove('is-sel'); }); sel = b; b.classList.add('is-sel'); sfx.tick(); };
    });
    $$('[data-side="r"] .g-pill', board).forEach(function (b) {
      b.onclick = function () {
        if (!sel) { shake(b); return G.say('Prima scegli un termine a sinistra.'); }
        if (sel.dataset.i === b.dataset.i) {
          done++; var c = 'g-pair-' + done; [sel, b].forEach(function (x) { x.classList.remove('is-sel'); x.classList.add('is-done', c); x.disabled = true; x.dataset.n = done; });
          H.score(H.get() + 20, b); sfx.ok(); sel = null; H.prog(done, P.length, done + ' di ' + P.length + ' coppie');
          if (done === P.length) setTimeout(function () { G.end(root, { title: 'Tutte le coppie!', score: H.get(), max: P.length * 20, again: function () { G.mount('abbina'); } }); }, 500);
        } else {
          shake(b); shake(sel); lives--; H.lives(lives, LIVES); H.score(Math.max(0, H.get() - 5), b); sfx.ko(); G.oops();
          if (lives <= 0) setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Game over', score: H.get(), max: P.length * 20, again: function () { G.mount('abbina'); } }); }, 500);
        }
      };
    });
    H.score(0);
  });

  /* ---------- SEQUENZA ---------- */
  G.register('seq', function (root) {
    var S = D.seq, tries = 0, H = G.hud({});
    root.appendChild(H.el); H.prog(0, S.length, 'Metti in ordine dal più antico');
    var board = h('<div class="g-board g-seq"><ol class="g-seq-list"></ol><div class="g-actions"><span class="g-note">Usa le frecce o trascina.</span><button class="g-btn" data-check>Controlla</button></div></div>');
    root.appendChild(board);
    var list = $('ol', board), order = shuffle(S.map(function (_, i) { return i; }));
    if (order.every(function (v, i) { return v === i; })) order.reverse();
    order.forEach(function (i) {
      var li = h('<li class="g-seq-item" draggable="true" data-i="' + i + '"><span class="g-seq-n"></span><span class="g-seq-t"></span><span class="g-seq-y">' + esc(S[i].y) + '</span><span class="g-seq-mv"><button type="button" data-mv="-1" aria-label="Su">↑</button><button type="button" data-mv="1" aria-label="Giù">↓</button></span></li>');
      $('.g-seq-t', li).textContent = S[i].t; list.appendChild(li);
    });
    function renum() { $$('.g-seq-item', list).forEach(function (li, k) { $('.g-seq-n', li).textContent = k + 1; }); }
    function locked(li) { return li && li.classList.contains('is-ok'); }
    list.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mv]'); if (!b) return; var li = b.closest('li'); if (locked(li)) return;
      var dir = +b.dataset.mv, sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
      while (sib && locked(sib)) sib = dir < 0 ? sib.previousElementSibling : sib.nextElementSibling;
      if (!sib) return;
      if (dir < 0) list.insertBefore(li, sib); else list.insertBefore(li, sib.nextElementSibling);
      li.classList.remove('is-moved'); void li.offsetWidth; li.classList.add('is-moved'); $$('.is-wrong', list).forEach(function (x) { x.classList.remove('is-wrong'); }); sfx.tick(); renum();
    });
    var drag = null;
    list.addEventListener('dragstart', function (e) { var li = e.target.closest('li'); if (locked(li)) return e.preventDefault(); drag = li; li.classList.add('is-drag'); });
    list.addEventListener('dragend', function () { if (drag) drag.classList.remove('is-drag'); drag = null; renum(); });
    list.addEventListener('dragover', function (e) {
      e.preventDefault(); var over = e.target.closest('li'); if (!drag || !over || over === drag || locked(over)) return;
      var r = over.getBoundingClientRect(); list.insertBefore(drag, e.clientY > r.top + r.height / 2 ? over.nextElementSibling : over);
    });
    $('[data-check]', board).onclick = function () {
      tries++; var items = $$('.g-seq-item', list), ok = 0;
      items.forEach(function (li, k) { var r = +li.dataset.i === k; li.classList.toggle('is-ok', r); li.classList.toggle('is-wrong', !r); li.draggable = !r; if (r) ok++; });
      H.prog(ok, S.length, ok + ' di ' + S.length + ' al posto giusto · tentativo ' + tries);
      if (ok === S.length) { var sc = Math.max(20, 120 - (tries - 1) * 20); H.score(sc, this); sfx.win();
        setTimeout(function () { G.end(root, { title: 'Linea del tempo completa', score: sc, max: 120, msg: tries === 1 ? 'Al primo tentativo!' : 'In ' + tries + ' tentativi.', again: function () { G.mount('seq'); } }); }, 700);
      } else { sfx.ko(); G.say(ok ? ok + ' al posto giusto. Sposta le altre.' : 'Nessuna al posto giusto. Coraggio!'); }
    };
    renum(); H.score(0);
  });

  /* ---------- CATEGORIE ---------- */
  G.register('cat', function (root) {
    var C = D.cat, LIVES = 3, lives = LIVES, done = 0, sel = null, H = G.hud({ lives: true });
    root.appendChild(H.el); H.lives(lives, LIVES); H.prog(0, C.items.length, '0 di ' + C.items.length + ' frasi');
    var board = h('<div class="g-board g-cat"><div class="g-pool"></div><div class="g-bins">' + C.bins.map(function (b, i) { return '<div class="g-bin" data-b="' + i + '" role="button" tabindex="0"><span class="g-bin-h">' + esc(b) + '</span><div class="g-bin-in"></div></div>'; }).join('') + '</div></div>');
    root.appendChild(board);
    shuffle(C.items).forEach(function (it) { var c = h('<button class="g-chip-d" type="button" draggable="true" data-b="' + it[1] + '"></button>'); c.textContent = it[0]; $('.g-pool', board).appendChild(c); });
    function choose(c) { $$('.g-chip-d', board).forEach(function (x) { x.classList.remove('is-sel'); }); sel = c; if (c) { c.classList.add('is-sel'); sfx.tick(); } board.classList.toggle('is-picking', !!c); }
    function drop(bin) {
      if (!sel) return G.say('Tocca prima una frase.');
      var c = sel; choose(null);
      if (c.dataset.b === bin.dataset.b) {
        $('.g-bin-in', bin).appendChild(c); c.disabled = true; c.draggable = false; c.classList.add('is-in'); done++;
        H.score(H.get() + 10, bin); sfx.ok(); H.prog(done, C.items.length, done + ' di ' + C.items.length + ' frasi');
        if (done === C.items.length) setTimeout(function () { G.cheer(); G.end(root, { title: 'Tutto al suo posto', score: H.get(), max: C.items.length * 10, again: function () { G.mount('cat'); } }); }, 500);
      } else {
        shake(bin); shake(c); lives--; H.lives(lives, LIVES); sfx.ko(); G.oops();
        if (lives <= 0) setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Game over', score: H.get(), max: C.items.length * 10, again: function () { G.mount('cat'); } }); }, 500);
      }
    }
    board.addEventListener('click', function (e) {
      var c = e.target.closest('.g-chip-d'); if (c && !c.disabled) return choose(sel === c ? null : c);
      var b = e.target.closest('.g-bin'); if (b) drop(b);
    });
    board.addEventListener('dragstart', function (e) { var c = e.target.closest('.g-chip-d'); if (c) { choose(c); e.dataTransfer.setData('text', ''); } });
    $$('.g-bin', board).forEach(function (b) {
      b.addEventListener('dragover', function (e) { e.preventDefault(); b.classList.add('is-over'); });
      b.addEventListener('dragleave', function () { b.classList.remove('is-over'); });
      b.addEventListener('drop', function (e) { e.preventDefault(); b.classList.remove('is-over'); drop(b); });
      b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(b); } });
    });
    H.score(0); G.say('Tocca una frase, poi il contenitore giusto.');
  });

  /* ---------- MEMORY ---------- */
  G.register('memory', function (root) {
    var P = D.memory, moves = 0, found = 0, open = [], busy = false, sec = 0, H = G.hud({ timer: true });
    root.appendChild(H.el); H.prog(0, P.length, '0 di ' + P.length + ' coppie · 0 mosse');
    var cards = shuffle([].concat.apply([], P.map(function (p, i) { return [{ t: p[0], i: i, k: 'a' }, { t: p[1], i: i, k: 'b' }]; })));
    var board = h('<div class="g-board g-memory"><div class="g-mem-grid"></div></div>'); root.appendChild(board);
    cards.forEach(function (c) {
      var b = h('<button class="g-mem" type="button" aria-label="Carta coperta"><span class="g-mem-in"><span class="g-mem-f g-mem-back">?</span><span class="g-mem-f g-mem-face g-mem-' + c.k + '"></span></span></button>');
      $('.g-mem-face', b).textContent = c.t; b._c = c; $('.g-mem-grid', board).appendChild(b);
      b.onclick = function () {
        if (busy || b.classList.contains('is-open')) return;
        b.classList.add('is-open'); b.setAttribute('aria-label', c.t); sfx.flip(); open.push(b);
        if (open.length < 2) return;
        moves++; busy = true; var a = open[0], z = open[1];
        if (a._c.i === z._c.i) {
          found++; setTimeout(function () { a.classList.add('is-match'); z.classList.add('is-match'); sfx.ok(); H.score(H.get() + 20, z); open = []; busy = false;
            if (found === P.length) { G.clear(); var bonus = Math.max(0, 60 - (moves - P.length) * 5); H.score(H.get() + bonus);
              setTimeout(function () { G.end(root, { title: 'Memoria d’acciaio', score: H.get(), max: P.length * 20 + 60, msg: moves + ' mosse · ' + Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2), again: function () { G.mount('memory'); } }); }, 600); }
          }, 350);
        } else setTimeout(function () { a.classList.remove('is-open'); z.classList.remove('is-open'); a.setAttribute('aria-label', 'Carta coperta'); z.setAttribute('aria-label', 'Carta coperta'); open = []; busy = false; }, 900);
        H.prog(found + (a._c.i === z._c.i ? 1 : 0), P.length, (found + (a._c.i === z._c.i ? 1 : 0)) + ' di ' + P.length + ' coppie · ' + moves + ' mosse');
      };
    });
    G.every(1000, function () { H.time(++sec); });
    H.score(0); G.say('Trova il termine e la sua definizione.');
  });

  /* ---------- COMPLETA IL TESTO ---------- */
  G.register('completa', function (root) {
    var C = D.completa, LIVES = 3, lives = LIVES, active = null, H = G.hud({ lives: true });
    var answers = [], html = C.testo.replace(/\{([^}]+)\}/g, function (_, w) { answers.push(w); return '<button class="g-blank" type="button" data-k="' + (answers.length - 1) + '"></button>'; });
    root.appendChild(H.el); H.lives(lives, LIVES); H.prog(0, answers.length, '0 di ' + answers.length + ' spazi');
    var board = h('<div class="g-board g-completa"><p class="g-text">' + html + '</p><div class="g-bank"></div><div class="g-actions"><button class="g-btn" data-check>Controlla</button></div></div>');
    root.appendChild(board);
    shuffle(answers.concat(C.extra)).forEach(function (wd) { var b = h('<button class="g-word" type="button"></button>'); b.textContent = wd; $('.g-bank', board).appendChild(b); });
    var blanks = $$('.g-blank', board);
    function setActive(b) { blanks.forEach(function (x) { x.classList.toggle('is-active', x === b); }); active = b; }
    function nextEmpty() { return blanks.filter(function (x) { return !x.dataset.w && !x.classList.contains('is-ok'); })[0] || null; }
    blanks.forEach(function (b) { b.onclick = function () {
      if (b.classList.contains('is-ok')) return;
      if (b.dataset.w) { var w = $$('.g-word', board).filter(function (x) { return x.textContent === b.dataset.w && x.disabled; })[0]; if (w) w.disabled = false; b.dataset.w = ''; b.textContent = ''; b.classList.remove('is-wrong'); }
      setActive(b); sfx.tick();
    }; });
    $$('.g-word', board).forEach(function (w) { w.onclick = function () {
      var b = active && !active.dataset.w ? active : nextEmpty(); if (!b) return G.say('Tutti gli spazi sono pieni: controlla!');
      b.dataset.w = w.textContent; b.textContent = w.textContent; b.classList.remove('is-wrong'); w.disabled = true; sfx.tick(); setActive(nextEmpty());
    }; });
    $('[data-check]', board).onclick = function () {
      var wrong = 0, gained = 0;
      blanks.forEach(function (b) {
        if (!b.dataset.w || b.classList.contains('is-ok')) return;
        if (b.dataset.w === answers[+b.dataset.k]) { b.classList.add('is-ok'); gained += 15; } else { b.classList.add('is-wrong'); wrong++; }
      });
      var ok = blanks.filter(function (b) { return b.classList.contains('is-ok'); }).length;
      H.prog(ok, answers.length, ok + ' di ' + answers.length + ' spazi');
      if (gained) { H.score(H.get() + gained, this); sfx.ok(); }
      if (wrong) { lives--; H.lives(lives, LIVES); sfx.ko(); G.oops(); }
      if (!gained && !wrong) G.say('Riempi almeno uno spazio.');
      if (ok === answers.length) setTimeout(function () { G.end(root, { title: 'Testo completo', score: H.get(), max: answers.length * 15, again: function () { G.mount('completa'); } }); }, 500);
      else if (lives <= 0) { blanks.forEach(function (b) { if (!b.classList.contains('is-ok')) { b.textContent = answers[+b.dataset.k]; b.classList.remove('is-wrong'); b.classList.add('is-shown'); } });
        setTimeout(function () { G.end(root, { kicker: 'Tentativi finiti', title: 'Ecco il testo', score: H.get(), max: answers.length * 15, again: function () { G.mount('completa'); } }); }, 1400); }
    };
    setActive(blanks[0]); H.score(0);
  });

  /* ---------- SONDAGGIO ---------- */
  G.register('sondaggio', function (root) {
    var S = D.sondaggio, qi = 0, votes = G.store.get('giochi_sondaggio', {}), shown = false, H = G.hud({});
    root.appendChild(H.el);
    var board = h('<div class="g-board g-poll"><span class="g-label">Sondaggio di classe · anonimo</span><h2 class="g-q"></h2><div class="g-poll-opts"></div>' +
      '<div class="g-debate" hidden><span class="g-label">Per il dibattito</span><p></p></div>' +
      '<div class="g-actions"><span class="g-note" data-tot></span><button class="g-btn g-btn--ghost" data-reset>Azzera</button><button class="g-btn g-btn--ghost" data-show>Mostra risultati</button><button class="g-btn" data-next>Prossima →</button></div></div>');
    root.appendChild(board);
    function v() { return votes[qi] = votes[qi] || S[qi].a.map(function () { return 0; }); }
    function draw() {
      var q = S[qi], vv = v(), tot = vv.reduce(function (a, b) { return a + b; }, 0), max = Math.max.apply(null, vv);
      H.prog(qi + 1, S.length, 'Domanda ' + (qi + 1) + ' di ' + S.length); H.score(tot);
      $('.g-q', board).textContent = q.q; board.classList.toggle('is-shown', shown);
      var box = $('.g-poll-opts', board); box.innerHTML = '';
      q.a.forEach(function (a, i) {
        var pct = tot ? Math.round(vv[i] / tot * 100) : 0;
        var row = h('<div class="g-poll-row' + (shown && tot && vv[i] === max ? ' is-top' : '') + '"><button class="g-poll-b" type="button"><span class="g-poll-bar" style="width:' + (shown ? pct : 0) + '%"></span><span class="g-poll-a"></span><b class="g-num g-num--sm">' + (shown ? pct + '%' : '') + '</b></button><button class="g-poll-minus" type="button" aria-label="Togli un voto">−</button></div>');
        $('.g-poll-a', row).textContent = a;
        $('.g-poll-b', row).onclick = function (e) { vv[i]++; G.store.set('giochi_sondaggio', votes); sfx.coin(); G.pop(e.currentTarget, '+1', true); draw(); };
        $('.g-poll-minus', row).onclick = function () { if (vv[i] > 0) { vv[i]--; G.store.set('giochi_sondaggio', votes); draw(); } };
        box.appendChild(row);
      });
      $('[data-tot]', board).textContent = tot + (tot === 1 ? ' voto' : ' voti');
      $('[data-show]', board).textContent = shown ? 'Nascondi risultati' : 'Mostra risultati';
      var db = $('.g-debate', board); db.hidden = !shown; $('p', db).textContent = q.dibattito;
      $('[data-next]', board).textContent = qi === S.length - 1 ? 'Ricomincia' : 'Prossima →';
    }
    $('[data-show]', board).onclick = function () { shown = !shown; if (shown) sfx.win(); draw(); };
    $('[data-reset]', board).onclick = function () { votes[qi] = null; G.store.set('giochi_sondaggio', votes); shown = false; draw(); };
    $('[data-next]', board).onclick = function () { qi = (qi + 1) % S.length; shown = false; draw(); };
    $('.g-hud-score .g-label', H.el).textContent = 'Voti';
    draw(); G.say('Ognuno tocca la sua risposta. I risultati restano nascosti finché non li mostri.');
  });
})();
